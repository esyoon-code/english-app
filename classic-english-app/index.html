eth’s family.","T"]],"questions":[["Why did people think Darcy was proud at the first dance?","He only danced with his friend’s sisters, didn’t talk to others, and said rude things about Elizabeth."],["What was wrong with Darcy’s first proposal?","He talked about how her family was lower than his and expected her to say yes."],["What did Darcy’s letter say about Wickham?","Wickham wasted money on gambling and tried to run away with Darcy’s sister for her money."],["Explain the title: who had pride and who had prejudice?","Darcy had pride, and Elizabeth had prejudice. (Both had a little of each.)"]],"listening":{"shadow":"7","dictation":[["She had five daughters and no sons, and her greatest ___ in life was to see her daughters married to rich men.","wish"],["She is okay, but not pretty ___ for me.","enough"],["You are the ___ man in the world that I would marry.","last"],["Until this moment, I never really ___ myself.","knew"],["It was Darcy ___ had found them in London.","who"]]},"grammar":{"title":"정중한 표현과 부드럽게 말하기","explain":["영어는 정중할수록 문장이 길고 간접적이 돼요. 비즈니스 이메일에서도 그대로 쓸 수 있어요.","부드럽게 의견 말하기: I’m afraid (that) ~ / It seems that ~ / I don’t think ~ → I’m afraid I can’t agree.","정중한 부탁: Would you mind ~ing? / I would be grateful if you could ~ / Could you possibly ~?","정중한 거절: I’m afraid that won’t be possible. / Thank you, but I can’t.","격식 단어: ask → request, help → assist, get → receive, want → would like"],"examples":[["I’m afraid I can’t accept your offer.","죄송하지만 제안을 받아들일 수 없습니다."],["It seems that there was a misunderstanding.","오해가 있었던 것 같습니다."],["I would be grateful if you could send me the details.","세부 사항을 보내 주시면 감사하겠습니다."],["Would you mind waiting a few minutes?","몇 분만 기다려 주시겠어요?"]],"exercise":[["I can’t come. (정중하게 거절)","I’m afraid I won’t be able to come."],["Send me the file. (아주 정중하게)","I would be grateful if you could send me the file."],["You are wrong. (부드럽게)","I’m afraid I see it a little differently. / It seems that you may be mistaken."]]},"expressions":[["at least","적어도","At least, that’s what I think."],["find out","알아내다","She found out the truth."],["look down on ~","~을 깔보다","Don’t look down on other people."],["see ~ in a new way","~을 새롭게 보다","After the trip, I saw my parents in a new way."]],"speaking":{"retell":["Mrs. Bennet – five daughters – rich Mr. Bingley","dance – Darcy was rude to Elizabeth","Wickham’s lies – Bingley left Jane","first proposal – refused","Darcy’s letter – the truth","Pemberley – Darcy changed","Lydia & Wickham – Darcy helped – second proposal"],"discuss":["Is it fair to judge people by first impressions?","Darcy changed his manners, and Elizabeth changed her opinion. Whose change was harder?","In Austen’s time, women needed to marry for money. How is it different today?"],"model":["Is it fair to judge people by first impressions?","It isn’t fair, but it’s very human. Our brains want to decide quickly if someone is friendly or not. The problem is that first impressions are often based on small things, like one rude comment or a story from someone else. Elizabeth was very smart, but she still made this mistake. So the lesson is not to stop having first impressions, but to be ready to change them."],"roleplay":"A: 첫 번째 청혼을 하는 다아시 / B: 엘리자베스. 이번에는 다아시가 정중하고 겸손한 표현으로 청혼하도록 고쳐서 연기해 보세요."},"writing":{"task":"정중한 편지: 엘리자베스가 다아시의 편지를 읽고 보내는 답장 (정중한 표현 3개 이상, 170~200단어)","hints":["Dear Mr. Darcy, / I am writing to ~","오해를 인정하고 사과하기 (I’m afraid / It seems that / I must admit)","고마움과 앞으로의 관계","Yours sincerely,"],"model":["Dear Mr. Darcy,","I am writing to thank you for your letter, which I have now read many times. I must admit that my first feelings were anger and disbelief. However, the more I thought about your words, the more I understood that they were true.","It seems that I was completely wrong about Mr. Wickham. I believed his story without question, simply because his manners were pleasant and yours, I’m afraid, were not. I now understand that I let your rude words at our first meeting shape every opinion I had of you.","About my sister Jane, I still believe that you were wrong. Her feelings are deep, even if she does not show them. However, I accept that you were trying to protect your friend.","Please forgive the hard words I said to you. I would be grateful if we could meet again as people who understand each other a little better.","Yours sincerely,","Elizabeth Bennet"]},"quote":["“Till this moment, I never knew myself.” (Jane Austen)","이 순간까지 나는 나 자신을 몰랐다."]},{"week":22,"title":"지킬 박사와 하이드 씨","en":"Dr Jekyll and Mr Hyde","author":"Robert Louis Stevenson (로버트 루이스 스티븐슨)","year":"1886","genre":"미스터리 소설 (Mystery)","intro":"「보물섬」의 작가 스티븐슨의 또 다른 걸작입니다. 존경받는 의사 지킬 박사가 약을 마시고 사악한 하이드 씨로 변하는 이야기로, “사람 안의 선과 악”이라는 주제를 다룹니다. 변호사 어터슨의 시선으로 미스터리처럼 진행되다가 마지막에 지킬의 고백으로 진실이 밝혀져요.","characters":[["Mr. Utterson (어터슨)","진실을 쫓는 신중한 변호사"],["Dr. Jekyll (지킬 박사)","존경받는 의사이자 과학자"],["Mr. Hyde (하이드)","작고 섬뜩한 인상의 남자"],["Poole (풀)","지킬 박사의 집사"]],"warmup":[["Does everyone have a “dark side”?","모든 사람에게 어두운 면이 있을까요?"],["Do people act differently online than in real life? Why?","사람들은 온라인에서 다르게 행동할까요?"]],"vocab":[["lawyer","변호사","Mr. Utterson was a lawyer."],["doctor","의사","Dr. Jekyll was a famous doctor."],["respect","존경하다","Everyone respected him."],["door","문","Did you ever notice that door?"],["knock down","쓰러뜨리다","Hyde knocked down a little girl."],["ugly","추한, 흉한","Something about him was ugly."],["will","유언장","Jekyll’s will gave everything to Hyde."],["murder","살인","Hyde committed a murder."],["cane","지팡이","They found half of a broken cane."],["servant","하인, 집사","Poole was Jekyll’s servant."],["laboratory","실험실","He worked in his laboratory."],["drink","약물, 마실 것","He made a special drink."],["evil","악; 사악한","Hyde was pure evil."],["control","조절하다","He couldn’t control the change."],["confession","고백","They found Jekyll’s confession."]],"story":["Mr. Utterson was a lawyer. He was a serious, quiet man who rarely smiled, but his friends trusted him. He liked to help people in trouble rather than judge them. Every Sunday, he took a long walk with his cousin, Mr. Enfield.","One Sunday, they passed an old door on a busy London street. “Did you ever notice that door?” asked Enfield. “I saw something terrible there.” He explained that late one winter night, he saw a small man walking quickly and a little girl running across the street. They ran into each other. Then the man calmly walked over the girl and left her screaming on the ground. “It wasn’t like a man,” said Enfield. “It was like a terrible machine.” People caught the man and made him pay one hundred pounds to the girl’s family. He went through that door and came back with a check signed by one of the most respected men in London. The man’s name was Hyde.","Utterson was worried, because he knew that name. He had the will of his old friend, Dr. Henry Jekyll. It said that if Jekyll died or disappeared, all his money should go to “my friend Edward Hyde.” Utterson had always disliked this will. Now he was afraid that Hyde was using some secret to control Jekyll.","Utterson decided to wait by the door until Hyde came. One cold night, a small man walked up the street. When Utterson spoke to him, Hyde stepped back with a strange hissing sound. His face was pale, and although nobody could say exactly what was wrong with him, everyone who saw him felt that something about him was ugly and evil. Utterson felt a strong fear and hate that he had never felt for any person before.","When Utterson asked Jekyll about Hyde, the doctor’s face turned pale. “I am very interested in that young man,” Jekyll said. “But don’t worry. I can be free of Mr. Hyde whenever I want. I promise you that.”","About a year later, London was shocked by a terrible crime. Late one night, a maid looked out of her window and saw a kind old gentleman, Sir Danvers Carew, stop a small man to ask for directions. Suddenly, the small man became wildly angry. He hit the old man with his heavy cane again and again until he was dead. The maid recognized the murderer. It was Mr. Hyde. Half of the broken cane was found at the scene. Utterson recognized it — he had given that cane to Jekyll years before. The police searched for Hyde, but he had disappeared.","For two months, Jekyll seemed like a new man. He saw his friends, gave dinners, and helped the poor. But then, suddenly, he locked himself inside his house and wouldn’t see anyone.","One evening, Jekyll’s frightened servant, Poole, came to Utterson. “Sir, something is very wrong,” he said. For a week, the person in the laboratory had been crying and sending notes asking for a special chemical. Every time Poole brought it, the voice inside said it was “not pure.” Poole had seen the person inside once, and he was sure it was not his master. Utterson and Poole broke down the door with an axe. On the floor lay a dead man. It was Hyde, wearing Jekyll’s clothes, which were much too big for him. He had taken poison. But there was no sign of Jekyll anywhere. On the desk, they found a long letter for Utterson: “Henry Jekyll’s Full Statement.”","In his confession, Jekyll explained everything. Since he was young, he had felt that he had two sides. One side wanted to be respected and do good things. The other side wanted wild and shameful pleasures. Although he hid his dark side well, he suffered from this battle inside him. “Man is not truly one, but truly two,” he wrote. As a scientist, he dreamed of separating the two sides. After years of work, he made a special drink. Even though he knew it was dangerous, he drank it one night. He felt terrible pain — and then a strange, new freedom. When he looked in the mirror, he saw Edward Hyde: smaller, younger, and pure evil. When he drank the drink again, he became Jekyll again.","At first, it was an exciting game. As Hyde, he could do anything without feeling guilty, and then he could return to being the respected Dr. Jekyll. But Hyde grew stronger and crueler. One morning, Jekyll woke up in his own bed and looked at his hand. It wasn’t his large, white hand. It was the thin, dark, hairy hand of Hyde. He had changed in his sleep, without the drink! After the murder, Jekyll promised never to become Hyde again. For two months, he succeeded. But one day, while he was sitting in the park, he changed again without any warning.","After that, he needed more and more of the drink to stay as Jekyll. Finally, he ran out of the special salt he used to make it, and the new salt didn’t work. He realized that the first salt must have had something unknown in it. Now he was trapped. As he wrote his confession, he knew that he was using the last of the drink, and that soon he would become Hyde forever. “Here,” he wrote, “I put down my pen, and I bring the life of that unhappy Henry Jekyll to an end.”"],"ko":["어터슨 씨는 변호사였다. 그는 좀처럼 웃지 않는 진지하고 조용한 사람이었지만, 친구들은 그를 믿었다. 그는 곤경에 처한 사람을 판단하기보다 돕기를 좋아했다. 매주 일요일, 그는 사촌 엔필드 씨와 함께 오래 산책을 했다.","어느 일요일, 그들은 런던의 번화한 거리에 있는 낡은 문 앞을 지나갔다. “저 문을 본 적 있나?” 엔필드가 물었다. “거기서 끔찍한 일을 봤네.” 그는 어느 겨울밤 늦게, 작은 남자가 빠르게 걷고 있었고 어린 소녀가 길을 가로질러 달려왔다고 설명했다. 둘은 서로 부딪쳤다. 그러자 그 남자는 태연하게 소녀를 밟고 지나가, 땅바닥에서 비명을 지르는 소녀를 그대로 두고 갔다. “사람 같지 않았어.” 엔필드가 말했다. “끔찍한 기계 같았지.” 사람들이 그 남자를 붙잡아 소녀의 가족에게 100파운드를 물어 주게 했다. 그는 저 문으로 들어가더니 런던에서 가장 존경받는 사람 중 한 명이 서명한 수표를 가지고 나왔다. 그 남자의 이름은 하이드였다.","어터슨은 걱정이 되었다. 그 이름을 알고 있었기 때문이다. 그는 오랜 친구 헨리 지킬 박사의 유언장을 가지고 있었다. 거기에는 지킬이 죽거나 사라지면 모든 재산을 “내 친구 에드워드 하이드”에게 준다고 쓰여 있었다. 어터슨은 늘 이 유언장이 마음에 들지 않았다. 이제 그는 하이드가 어떤 비밀을 이용해 지킬을 조종하고 있는 건 아닌지 두려웠다.","어터슨은 하이드가 올 때까지 그 문 옆에서 기다리기로 했다. 어느 추운 밤, 작은 남자가 거리를 걸어왔다. 어터슨이 말을 걸자 하이드는 이상한 쉿 소리를 내며 뒤로 물러섰다. 그의 얼굴은 창백했다. 무엇이 이상한지 정확히 말할 수 있는 사람은 없었지만, 그를 본 사람은 모두 그에게서 무언가 추하고 사악한 것을 느꼈다. 어터슨은 지금까지 어떤 사람에게도 느껴 본 적 없는 강한 두려움과 혐오를 느꼈다.","어터슨이 지킬에게 하이드에 대해 묻자, 박사의 얼굴이 창백해졌다. “나는 그 젊은이에게 관심이 아주 많네.” 지킬이 말했다. “하지만 걱정 말게. 나는 원할 때면 언제든 하이드 씨에게서 벗어날 수 있어. 약속하지.”","1년쯤 뒤, 런던은 끔찍한 범죄로 충격에 빠졌다. 어느 늦은 밤, 한 하녀가 창밖을 내다보다가 친절한 노신사 댄버스 커루 경이 작은 남자를 멈춰 세우고 길을 묻는 것을 보았다. 갑자기 작은 남자가 미친 듯이 화를 냈다. 그는 무거운 지팡이로 노인이 죽을 때까지 때리고 또 때렸다. 하녀는 살인자를 알아보았다. 하이드 씨였다. 현장에서는 부러진 지팡이 반쪽이 발견되었다. 어터슨은 그것을 알아보았다. 몇 년 전에 그가 지킬에게 선물한 지팡이였다. 경찰은 하이드를 찾았지만, 그는 사라지고 없었다.","두 달 동안 지킬은 새사람이 된 것 같았다. 그는 친구들을 만나고, 저녁 식사를 대접하고, 가난한 사람들을 도왔다. 그런데 갑자기 집 안에 틀어박혀 아무도 만나려 하지 않았다.","어느 저녁, 겁에 질린 지킬의 집사 풀이 어터슨을 찾아왔다. “나리, 뭔가 크게 잘못됐습니다.” 그가 말했다. 일주일 동안 실험실 안에 있는 사람이 울면서 특별한 화학 약품을 구해 달라는 쪽지를 보내고 있었다. 풀이 약품을 가져갈 때마다 안에서는 “순수하지 않다”는 목소리가 들렸다. 풀은 안에 있는 사람을 한 번 보았는데, 주인이 아니라고 확신했다. 어터슨과 풀은 도끼로 문을 부쉈다. 바닥에는 죽은 남자가 쓰러져 있었다. 자기에게 너무 큰 지킬의 옷을 입은 하이드였다. 그는 독을 먹었다. 하지만 지킬은 어디에도 흔적이 없었다. 책상 위에서 그들은 어터슨에게 쓴 긴 편지를 발견했다. “헨리 지킬의 모든 고백.”","고백에서 지킬은 모든 것을 설명했다. 젊었을 때부터 그는 자신에게 두 가지 면이 있다고 느꼈다. 한쪽은 존경받고 좋은 일을 하고 싶어 했다. 다른 한쪽은 거칠고 부끄러운 쾌락을 원했다. 그는 어두운 면을 잘 숨겼지만, 내면의 이 싸움 때문에 괴로웠다. “인간은 진정 하나가 아니라 둘이다.” 그는 이렇게 썼다. 과학자로서 그는 두 면을 분리하는 것을 꿈꾸었다. 수년간의 연구 끝에 그는 특별한 약을 만들었다. 위험하다는 것을 알면서도, 그는 어느 날 밤 그것을 마셨다. 끔찍한 고통이 느껴지더니, 이상하고 새로운 자유가 찾아왔다. 거울을 보니 거기에는 에드워드 하이드가 있었다. 더 작고, 더 젊고, 완전히 사악한 존재였다. 약을 다시 마시자 그는 다시 지킬이 되었다.","처음에는 신나는 놀이였다. 하이드로서 그는 죄책감 없이 무엇이든 할 수 있었고, 그다음 존경받는 지킬 박사로 돌아오면 그만이었다. 하지만 하이드는 점점 강해지고 더 잔인해졌다. 어느 날 아침, 지킬은 자기 침대에서 잠이 깨어 손을 보았다. 자신의 크고 하얀 손이 아니었다. 하이드의 가늘고 거무스름하며 털이 많은 손이었다. 약 없이 잠자는 동안 변해 버린 것이다! 살인 사건 후 지킬은 다시는 하이드가 되지 않겠다고 다짐했다. 두 달 동안은 성공했다. 하지만 어느 날 공원에 앉아 있다가 아무런 예고 없이 다시 변해 버렸다.","그 후로 그는 지킬로 남아 있기 위해 점점 더 많은 약이 필요했다. 마침내 약을 만드는 데 쓰던 특별한 소금이 다 떨어졌고, 새로 산 소금은 효과가 없었다. 그는 처음 소금에 무언가 알 수 없는 것이 들어 있었던 게 틀림없다고 깨달았다. 이제 그는 갇혀 버렸다. 고백을 쓰는 동안, 그는 자신이 마지막 약을 쓰고 있으며 곧 영원히 하이드가 되리라는 것을 알았다. “여기서,” 그는 썼다. “나는 펜을 내려놓고, 저 불행한 헨리 지킬의 삶을 끝낸다.”"],"gloss":[["rather than","~하기보다는"],["check","수표"],["hissing","쉿 하는 소리"],["crime","범죄"],["recognize","알아보다"],["chemical","화학 약품"],["poison","독"],["shameful","부끄러운"],["guilty","죄책감을 느끼는"],["trapped","갇힌"]],"keySentences":[["Although nobody could say exactly what was wrong with him, everyone… felt that something about him was ugly and evil.","although = 비록 ~지만 + 간접의문문(what was wrong with him)"],["Man is not truly one, but truly two.","not A but B = A가 아니라 B. 작품의 핵심 주제 문장"],["Even though he knew it was dangerous, he drank it one night.","even though = (사실임을 알면서도) ~에도 불구하고 — although보다 강해요"],["The first salt must have had something unknown in it.","must have p.p. 추론 (9·16주차 복습)"]],"tf":[["Hyde knocked down a little girl in the street.","T"],["Jekyll’s will gave his money to Utterson.","F — 하이드에게 준다고 되어 있었다."],["Hyde was taller than Jekyll.","F — 더 작고 젊었다."],["At the end, Jekyll couldn’t control the change.","T"]],"questions":[["Why was Utterson worried about Jekyll’s will?","It gave everything to Hyde. Utterson was afraid Hyde was controlling Jekyll."],["What proved that Hyde killed Sir Danvers Carew?","The maid saw him, and half of the cane Utterson had given Jekyll was found."],["Why did Jekyll make the special drink?","He wanted to separate his good side and his evil side."],["Why couldn’t Jekyll make more of the drink?","He ran out of the special salt, and the new salt didn’t work."]],"listening":{"shadow":"9","dictation":[["He liked to help people in trouble ___ than judge them.","rather"],["I can be free of Mr. Hyde ___ I want.","whenever"],["Man is not truly one, but truly ___.","two"],["___ though he knew it was dangerous, he drank it.","Even"],["He had changed in his sleep, ___ the drink!","without"]]},"grammar":{"title":"양보 표현 — although / even though / despite / however","explain":["although / even though + 문장: 비록 ~이지만 → Although Jekyll was respected, he had a dark side.","despite / in spite of + 명사 / ~ing: ~에도 불구하고 → Despite the danger, he drank it.","despite of (X) — despite 뒤에는 of 를 쓰지 않아요!","however / but: 그러나 → He promised to stop. However, he changed again.","although 와 but 은 한 문장에 같이 쓰지 않아요. Although ~, but ~ (X)"],"examples":[["Although it was raining, we went out.","비가 오고 있었지만 우리는 외출했다."],["Even though he was tired, he finished the work.","피곤했지만 그는 일을 끝냈다."],["Despite his efforts, he couldn’t stop the change.","노력에도 불구하고 그는 변화를 멈출 수 없었다."],["Hyde was small. However, he was very strong.","하이드는 작았다. 하지만 아주 힘이 셌다."]],"exercise":[["비가 왔지만 우리는 축구를 했다. (although)","Although it rained, we played soccer."],["___ the cold weather, he went swimming. (despite / although)","Despite"],["고치기: Despite of the noise, I slept well.","Despite the noise, I slept well."]]},"expressions":[["run into ~","~와 부딪치다, 우연히 만나다","I ran into my old teacher yesterday."],["be free of ~","~에서 벗어나다","I want to be free of stress."],["run out of ~","~이 다 떨어지다","We ran out of milk."],["without any warning","아무 예고 없이","The storm came without any warning."]],"speaking":{"retell":["Utterson & Enfield – the door – Hyde and the girl","Jekyll’s will – everything to Hyde","Utterson met Hyde – fear","murder – broken cane","Jekyll locked himself in","Poole – broke the door – Hyde dead","confession – the drink – lost control"],"discuss":["Do you agree that “man is not truly one, but truly two”?","Was Jekyll a victim, or was it his own fault?","What are the modern “drinks” that let people become someone else? (익명 댓글, 술 등)"],"model":["Was Jekyll a victim, or was it his own fault?","Although Jekyll suffers a lot at the end, I think it was his own fault. Nobody forced him to drink it. He chose it because he wanted to enjoy bad things without feeling guilty. Even after the murder, he kept the drink. Hyde wasn’t a stranger. He was the part of Jekyll that Jekyll allowed to grow."],"roleplay":"A: 어터슨 / B: 지킬 박사 (살인 사건 직후). 어터슨은 진실을 캐묻고, 지킬은 비밀을 숨기려 해 보세요."},"writing":{"task":"주제 에세이: “Is there a Mr. Hyde in all of us?” (양보 표현 3개 이상, 200단어)","hints":["처음: 지킬의 말 “Man is not truly one, but truly two” 인용","내 안의 “하이드” 예시 (화, 질투, 게으름 등)","현대 사회의 “하이드” (익명 댓글 등)","마지막: 하이드를 키우지 않는 방법"],"model":["In Stevenson’s famous story, Dr. Jekyll writes, “Man is not truly one, but truly two.” Although this idea is more than a hundred years old, I believe it is still true today.","Most of us want to be kind and patient. However, we all have moments when another side comes out. For example, even though I think I am a calm person, I sometimes get very angry when I drive in heavy traffic. In those moments, I say things I would never say to someone’s face. That is my small “Mr. Hyde.”","Technology has made it easier for these hidden sides to come out. On the internet, people can hide their names and faces, which works like Jekyll’s drink. Despite being polite in real life, some people write cruel comments online.","But the story also teaches us what to do. Jekyll’s mistake was not that he had a dark side. It was that he enjoyed it and let it grow. If we notice our “Hyde moments” and choose differently next time, our dark side becomes weaker."]},"quote":["“Man is not truly one, but truly two.” (R. L. Stevenson)","인간은 진정 하나가 아니라 둘이다."]},{"week":23,"title":"프랑켄슈타인","en":"Frankenstein","author":"Mary Shelley (메리 셸리)","year":"1818","genre":"고딕 · SF 소설 (Gothic / Science Fiction)","intro":"메리 셸리가 19살에 쓴 최초의 SF 소설로 꼽히는 작품입니다. 젊은 과학자 빅터 프랑켄슈타인이 생명을 창조하지만, 자신이 만든 존재의 모습에 겁을 먹고 버립니다. 원작의 “괴물”은 이름이 없고, 말을 배우고 책을 읽는 지적인 존재예요. 프랑켄슈타인은 괴물이 아니라 만든 사람의 이름이랍니다.","characters":[["Victor Frankenstein (빅터 프랑켄슈타인)","생명 창조에 빠진 젊은 과학자"],["The Creature (창조물)","빅터가 만든 이름 없는 존재"],["The De Lacey family (드 라세 가족)","창조물이 몰래 지켜보며 말을 배운 가난한 가족"],["Captain Walton (월턴 선장)","북극에서 빅터를 구한 선장"]],"warmup":[["Should scientists create everything they can? (AI, 복제 등)","과학자는 만들 수 있는 모든 것을 만들어야 할까요?"],["Are people born bad, or does society make them bad?","사람은 나쁘게 태어날까요, 사회가 그렇게 만들까요?"]],"vocab":[["scientist","과학자","Victor was a young scientist."],["create","창조하다","He wanted to create life."],["creature","생명체, 창조물","The creature opened its eyes."],["run away","도망치다","Victor ran away in fear."],["alone","혼자","The creature was alone."],["scream","비명 지르다","People screamed when they saw him."],["cottage","오두막","He hid near a small cottage."],["language","언어","He learned their language."],["read","읽다","He learned to read."],["reflection","비친 모습","He saw his reflection in the water."],["accept","받아들이다","He hoped they would accept him."],["hate","미워하다","Everyone hated him."],["revenge","복수","He wanted revenge."],["responsible","책임 있는","Victor was responsible."],["regret","후회하다","Victor regretted his work."]],"story":["Victor Frankenstein grew up in a happy family in Switzerland. As a young man, he went to university and became very interested in one question: where does life come from? He studied day and night. After almost two years of hard work, he discovered the secret of giving life to dead things.","On a dark, rainy night in November, he finished his work. By the light of a candle, he saw the creature’s dull yellow eye open. It breathed and moved its arms and legs. Victor had wanted to make it beautiful, but now it looked terrible. Its yellow skin barely covered the muscles underneath. Its eyes were watery, and its lips were black. “The beauty of my dream disappeared,” Victor said later, “and my heart was filled with horror.” He ran out of the room and left the creature alone. When he came back the next day, the creature was gone.","Two years later, Victor received terrible news: his little brother, William, had been killed. Near his home, during a storm, he saw a giant shape in a flash of lightning. He knew at once that it was his creature. But he didn’t tell anyone, because nobody would believe him. A kind young servant, Justine, was blamed for the murder and was executed. Victor was full of guilt.","Later, in the mountains, the creature appeared in front of Victor. Victor shouted at him angrily, but the creature said calmly, “I expected this. Everyone hates me. Even you, my creator, hate me. But please listen to my story.” For the first time, Victor listened.","The creature explained that at first he knew nothing. He felt cold, hunger, and thirst, but he didn’t understand anything. When he went into a village, people screamed, threw stones at him, and chased him away. He found shelter in a small shed next to a poor cottage in the woods. Through a hole in the wall, he could watch the family inside: a blind old man, Mr. De Lacey, and his son and daughter.","For months, he watched them secretly. They were poor and often hungry, but they were gentle and loving to each other. When he realized he was taking some of their food, he stopped and ate berries instead. At night, he collected firewood and left it at their door. The family called him their “good spirit.” By listening carefully, he learned their language. Later, he found some books in the forest and taught himself to read.","But knowledge also brought pain. One day, he saw his reflection in a pool of water, and he was shocked. “Is that really me?” he thought. He also found Victor’s notebook in the coat he had taken from the laboratory, and he learned how he had been made. “Why did you make me so ugly that even you turned away from me?” he cried. Still, he hoped that the kind family would accept him if they knew his heart.","One day, when the young people were out, he went into the cottage and spoke to the blind old man. Because Mr. De Lacey couldn’t see him, he listened kindly, and the creature’s heart was full of hope. But suddenly the others came back. The daughter fainted, and the son hit the creature again and again with a stick. The creature could have hurt him badly, but he didn’t. He ran back to the forest, full of sadness. The next day, the family moved away forever.","“From that moment,” said the creature, “I declared war against all people, and most of all against the one who made me.” Later, he saved a little girl from a river, but her friend shot him because he thought the creature was attacking her. Every time he was kind, people answered with cruelty. Then he met a little boy near Geneva and hoped that a child would not hate him. But the boy screamed and said that his father was Frankenstein. In a moment of anger, the creature killed him. It was William.","“I am alone and miserable,” the creature told Victor. “Make me a female companion who is like me. Then we will go far away to South America, and no human will ever see us again. I was good once. Sadness made me evil. Make me happy, and I will be good again.” At first, Victor agreed. But while he was working on the female creature, he imagined a whole race of these creatures spreading across the world. In fear, he destroyed his work. The creature, who was watching through the window, cried out in despair. “I will be with you on your wedding night,” he said. He kept his word. He killed Victor’s best friend, and then, on the night of Victor’s wedding, he killed Victor’s wife, Elizabeth.","Victor spent the rest of his life chasing the creature across Europe and into the frozen Arctic, where Captain Walton found him dying on the ice. After Victor died, Walton found the creature crying over Victor’s body. “You hate me,” the creature said, “but no one can hate me as much as I hate myself.” He said that he would go to the farthest north and end his life. Then he jumped onto a piece of ice, and he was soon carried away into the darkness."],"ko":["빅터 프랑켄슈타인은 스위스의 행복한 가정에서 자랐다. 청년이 된 그는 대학에 갔고, 한 가지 질문에 깊이 빠져들었다. 생명은 어디에서 오는가? 그는 밤낮으로 연구했다. 거의 2년 동안 열심히 연구한 끝에, 그는 죽은 것에 생명을 불어넣는 비밀을 알아냈다.","11월의 어둡고 비 오는 밤, 그는 작업을 끝냈다. 촛불 빛 아래에서 그는 창조물의 흐릿한 노란 눈이 떠지는 것을 보았다. 그것은 숨을 쉬었고 팔다리를 움직였다. 빅터는 그것을 아름답게 만들고 싶었지만, 지금은 끔찍해 보였다. 노란 피부는 그 아래 근육을 겨우 덮고 있었다. 눈은 물기가 흥건했고, 입술은 검었다. “내 꿈의 아름다움은 사라졌고,” 빅터는 나중에 말했다. “내 가슴은 공포로 가득 찼다.” 그는 방에서 뛰쳐나가 창조물을 혼자 남겨 두었다. 다음 날 돌아왔을 때 창조물은 사라지고 없었다.","2년 뒤, 빅터는 끔찍한 소식을 들었다. 어린 남동생 윌리엄이 살해당한 것이다. 집 근처에서 폭풍이 치던 중, 그는 번개 빛 속에서 거대한 형체를 보았다. 그는 그것이 자신의 창조물이라는 것을 곧바로 알았다. 하지만 아무도 믿지 않을 것이었기에 누구에게도 말하지 않았다. 착한 젊은 하녀 저스틴이 살인 누명을 쓰고 처형당했다. 빅터는 죄책감으로 가득 찼다.","나중에 산속에서 창조물이 빅터 앞에 나타났다. 빅터는 화가 나서 소리쳤지만, 창조물은 차분하게 말했다. “이럴 줄 알았소. 모두가 나를 미워하지. 나를 만든 당신조차 나를 미워하오. 하지만 제발 내 이야기를 들어 주시오.” 처음으로 빅터는 귀를 기울였다.","창조물은 처음에는 아무것도 몰랐다고 설명했다. 추위와 배고픔과 목마름을 느꼈지만, 아무것도 이해하지 못했다. 마을에 들어가자 사람들은 비명을 지르고 돌을 던지며 그를 쫓아냈다. 그는 숲속 가난한 오두막 옆의 작은 헛간에 몸을 숨겼다. 벽의 구멍으로 그는 안에 사는 가족을 볼 수 있었다. 눈먼 노인 드 라세 씨와 그의 아들과 딸이었다.","몇 달 동안 그는 그들을 몰래 지켜보았다. 그들은 가난하고 자주 굶주렸지만, 서로에게 다정하고 사랑이 넘쳤다. 자기가 그들의 음식을 조금씩 가져가고 있다는 것을 깨닫자, 그는 그만두고 대신 산딸기를 먹었다. 밤에는 땔감을 모아 그들의 문 앞에 두었다. 가족은 그를 “착한 정령”이라고 불렀다. 귀 기울여 들으면서 그는 그들의 언어를 배웠다. 나중에는 숲에서 책 몇 권을 발견해 혼자 읽는 법을 익혔다.","하지만 지식은 고통도 가져왔다. 어느 날, 그는 웅덩이에 비친 자기 모습을 보고 충격을 받았다. “저게 정말 나란 말인가?” 그는 생각했다. 그는 또 실험실에서 가져온 코트 안에서 빅터의 공책을 발견했고, 자신이 어떻게 만들어졌는지 알게 되었다. “당신은 왜 나를 이렇게 추하게 만들어서, 당신조차 나에게 등을 돌리게 했소?” 그가 울부짖었다. 그래도 그는 그 착한 가족이 자기 마음을 알면 받아 줄 거라고 기대했다.","어느 날, 젊은 사람들이 외출하자 그는 오두막에 들어가 눈먼 노인에게 말을 걸었다. 드 라세 씨는 그를 볼 수 없었기에 친절하게 이야기를 들어 주었고, 창조물의 가슴은 희망으로 가득 찼다. 하지만 갑자기 다른 가족이 돌아왔다. 딸은 기절했고, 아들은 막대기로 창조물을 계속 때렸다. 창조물은 그를 크게 다치게 할 수도 있었지만, 그러지 않았다. 그는 슬픔에 가득 차 숲으로 도망쳤다. 다음 날, 그 가족은 영원히 이사를 가 버렸다.","“그 순간부터,” 창조물이 말했다. “나는 모든 인간에게, 그리고 무엇보다 나를 만든 자에게 전쟁을 선포했소.” 나중에 그는 강에서 어린 소녀를 구했지만, 소녀의 친구는 그가 소녀를 공격한다고 생각해 그에게 총을 쐈다. 그가 친절을 베풀 때마다 사람들은 잔인함으로 답했다. 그러다 제네바 근처에서 한 어린 소년을 만났고, 아이라면 자신을 미워하지 않을 거라 기대했다. 하지만 소년은 비명을 지르며 자기 아버지가 프랑켄슈타인이라고 말했다. 분노에 휩싸인 순간, 창조물은 소년을 죽였다. 그 아이가 윌리엄이었다.","“나는 외롭고 비참하오.” 창조물이 빅터에게 말했다. “나와 같은 여자 동반자를 만들어 주시오. 그러면 우리는 멀리 남아메리카로 가서 다시는 어떤 인간 눈에도 띄지 않겠소. 나도 한때는 착했소. 슬픔이 나를 악하게 만들었소. 나를 행복하게 해 주면, 나는 다시 착해질 것이오.” 처음에 빅터는 동의했다. 하지만 여자 창조물을 만들던 중, 그는 이런 존재들이 온 세상에 퍼지는 모습을 상상했다. 두려움에 그는 만들던 것을 부숴 버렸다. 창문 너머로 지켜보던 창조물은 절망에 차 울부짖었다. “당신의 결혼식 날 밤에 함께하겠소.” 그가 말했다. 그는 그 말을 지켰다. 그는 빅터의 가장 친한 친구를 죽였고, 빅터의 결혼식 날 밤에는 빅터의 아내 엘리자베스를 죽였다.","빅터는 남은 생을 창조물을 쫓으며 유럽을 지나 얼어붙은 북극까지 갔고, 그곳 얼음 위에서 죽어 가던 그를 월턴 선장이 발견했다. 빅터가 죽은 뒤, 월턴은 빅터의 시신 앞에서 울고 있는 창조물을 보았다. “당신들은 나를 미워하지만,” 창조물이 말했다. “내가 나 자신을 미워하는 것만큼 나를 미워할 수 있는 사람은 아무도 없소.” 그는 가장 먼 북쪽으로 가서 생을 마치겠다고 말했다. 그러고는 얼음 조각 위로 뛰어내렸고, 곧 어둠 속으로 떠내려가 사라졌다."],"gloss":[["dull","흐릿한"],["barely","겨우"],["horror","공포"],["lightning","번개"],["blame","탓하다, 누명을 씌우다"],["execute","처형하다"],["guilt","죄책감"],["shelter","피난처"],["faint","기절하다"],["declare war","전쟁을 선포하다"],["companion","동반자"],["despair","절망"]],"keySentences":[["The beauty of my dream disappeared, and my heart was filled with horror.","be filled with ~ = ~로 가득 차다. 빅터가 책임을 버리는 순간"],["The creature could have hurt him badly, but he didn’t.","could have p.p. (14주차 복습): 할 수 있었지만 하지 않았다 → 창조물의 선한 마음"],["I was good once. Sadness made me evil.","작품의 핵심 주제: 원래 선했지만 슬픔(외로움)이 나를 악하게 만들었다"],["No one can hate me as much as I hate myself.","as much as ~ = ~만큼"]],"tf":[["In the original story, the creature’s name is Frankenstein.","F — 프랑켄슈타인은 만든 사람(빅터)의 이름이다."],["Victor ran away right after the creature came to life.","T"],["The creature learned language by watching a family.","T"],["Victor finished making the female creature.","F — 완성하기 전에 부숴 버렸다."]],"questions":[["How did Victor feel when the creature first opened its eyes?","He was filled with horror and ran away."],["What kind things did the creature do for the De Lacey family?","He stopped taking their food and left firewood at their door."],["Why did the creature’s visit to the cottage fail?","The others came back, were afraid of him, and the son hit him."],["Who is the real “monster” in this story?","(예) Victor, because he left his creation alone. / Society, because everyone rejected the creature."]],"listening":{"shadow":"6","dictation":[["Victor said later, “and my heart was ___ with horror.”","filled"],["Everyone ___ me.","hates"],["The family called him their “good ___.”","spirit"],["The creature could have ___ him badly.","hurt"],["I was good once. ___ made me evil.","Sadness"]]},"grammar":{"title":"If only / 혼합 가정법 — 깊은 후회 표현","explain":["If only + had p.p.: ~하기만 했더라면! (I wish 보다 강한 후회) → If only I had never made him!","가정법 과거완료(13주차): If Victor had cared for him, the creature would have been good.","혼합 가정법: 과거의 일 → 지금의 결과 / If + had p.p., would + 동사원형 (now) → If Victor hadn’t made the creature, his family would still be alive.","시간 표현(now, still, today)이 있으면 혼합 가정법일 가능성이 높아요."],"examples":[["If only I had listened to my parents!","부모님 말씀을 듣기만 했더라면!"],["If Victor had taken responsibility, many people would have lived.","빅터가 책임을 졌더라면 많은 사람이 살았을 텐데."],["If I had studied English earlier, I would be fluent now.","영어를 더 일찍 공부했더라면 지금 유창할 텐데."],["If I hadn’t missed the bus, I would be at home now.","버스를 놓치지 않았더라면 지금 집에 있을 텐데."]],"exercise":[["그를 떠나지만 않았더라면!","If only I hadn’t left him!"],["If the family ___ (not / run) away, the creature would have stayed good.","had not run"],["그 버스를 탔다면 지금 거기 있을 텐데. (혼합)","If I had taken that bus, I would be there now."]]},"expressions":[["be interested in ~","~에 관심이 있다","He was interested in science."],["at once","곧바로","He knew at once."],["turn away from ~","~에게서 등을 돌리다","His friends turned away from him."],["keep one’s word","약속을 지키다","He always keeps his word."]],"speaking":{"retell":["Victor – studied life – created the creature","horror – ran away","William killed – Justine executed","creature’s story – watched the De Lacey family","rejected – war against people – killed William","asked for a companion – Victor destroyed her","revenge – Arctic – the end"],"discuss":["Who is the real monster: Victor, the creature, or society?","The creature says, “Sadness made me evil.” Do you agree that our situation shapes who we become?","What does Frankenstein teach us about modern science, such as AI?"],"model":["What does Frankenstein teach us about modern science like AI?","I think the main lesson is responsibility. Victor was brilliant, but he only thought about whether he could create life, not what he would do afterwards. When the result was not what he expected, he ran away. Today, companies are making powerful AI very quickly. If creators don’t take responsibility, we might face unexpected problems, just like Victor."],"roleplay":"A: 빅터 / B: 창조물 (산속의 만남). 창조물은 동반자를 만들어 달라고 설득하고, 빅터는 거절의 이유를 말해 보세요. If only 와 가정법을 사용하세요."},"writing":{"task":"의견 에세이: “Who is the real monster in Frankenstein?” (가정법 2번, If only 1번 이상, 220단어)","hints":["주장(내 생각) 한 문장","이유 1 + 본문 근거","이유 2 + 본문 근거","반대 의견 인정 (Although ~, …)","마지막: 주장 다시 정리 + 오늘날의 의미"],"model":["Many people call the creature in Frankenstein a “monster.” However, after reading the story, I believe that Victor Frankenstein is the real monster.","First, Victor leaves his creation alone at the very moment it is born. Instead of caring for it, he runs away “filled with horror.” A newborn creature needs help, just like a baby. If Victor had stayed and taught him, the creature would not have been so lost and lonely.","Second, the creature is good at first. He secretly brings firewood to a poor family, saves a girl from a river, and teaches himself to read. As he says, “I was good once. Sadness made me evil.” It was the cruelty of people, starting with his own creator, that changed him.","Although the creature kills people, and nothing can excuse that, we must ask why he became violent. Victor, on the other hand, hides the truth again and again. Because of his silence, an innocent servant dies.","In conclusion, the real monster is not the one with the ugly face, but the one who runs away from responsibility. If only Victor had shown a little love, his family might still be alive today."]},"quote":["“I was benevolent and good; misery made me a fiend.” (Mary Shelley)","나는 선하고 착했다. 비참함이 나를 악마로 만들었다."]},{"week":24,"title":"야성의 부름","en":"The Call of the Wild","author":"Jack London (잭 런던)","year":"1903","genre":"모험 소설 (Adventure Novel)","intro":"미국 작가 잭 런던의 소설입니다. 캘리포니아의 편안한 집에서 살던 개 벅이 납치되어 캐나다 북쪽 골드러시 지역의 썰매 개가 됩니다. 혹독한 환경에서 살아남으며 벅은 점점 자기 안의 “야성”을 깨닫게 돼요. 6개월 과정의 마지막 작품으로, “진짜 나를 찾는 여정”을 생각해 봅니다.","characters":[["Buck (벅)","세인트버나드와 셰퍼드 사이에서 태어난 큰 개"],["Manuel (마누엘)","도박 빚 때문에 벅을 판 정원사"],["Spitz (스피츠)","썰매 팀의 사나운 대장 개"],["John Thornton (존 손턴)","벅이 진심으로 사랑하게 된 주인"]],"warmup":[["How do difficult situations change people?","어려운 환경은 사람을 어떻게 바꿀까요?"],["Have you ever felt a “call” to do something new with your life?","삶에서 새로운 것을 하라는 “부름”을 느낀 적 있나요?"]],"vocab":[["dog","개","Buck was a big, strong dog."],["gold","금","Men found gold in the north."],["sell","팔다 (sold)","Manuel sold Buck."],["sled","썰매","He had to pull a heavy sled."],["snow","눈","The snow was deep."],["club","몽둥이","The man had a club."],["law","법칙","Buck learned the law of the club."],["fight","싸움; 싸우다","Buck and Spitz had a fight."],["leader","대장, 리더","Buck became the leader."],["wolf","늑대 (pl. wolves)","He ran with the wolves."],["howl","울부짖다","He howled at the moon."],["instinct","본능","His old instincts woke up."],["love","사랑","He felt true love for Thornton."],["save","구하다","Buck saved Thornton’s life."],["wild","야생의; 야생","He answered the call of the wild."]],"story":["Buck didn’t read the newspapers, or he would have known that trouble was coming. Men had found gold in the cold Northland of Canada, and thousands of people were rushing there. These men needed dogs — big, strong dogs with thick fur to pull sleds through the snow.","Buck lived in a big house in sunny California. It belonged to Judge Miller. Buck was four years old, and his life was like a king’s. His father was a huge St. Bernard, and his mother was a Scotch shepherd. He weighed sixty-four kilograms. He swam, hunted, played with the Judge’s grandchildren, and lay by the warm fire in the evenings.","But Manuel, one of the gardener’s helpers, loved gambling, and he needed money. One night, he took Buck to a small train station and sold him to a stranger. They put a rope around Buck’s neck. When Buck tried to fight, they pulled the rope so tight that he couldn’t breathe. For two days and nights, he traveled in a cage on a train with no food or water. He became wild with anger.","In Seattle, a man in a red sweater opened the cage. He was holding a club. Buck jumped at him again and again, and again and again the club hit him. At last, Buck couldn’t get up. He had been beaten, but he was not broken. He learned a lesson that he never forgot: a man with a club was a master who must be obeyed. This was the first law of the wild.","Buck was sold to two mail carriers and taken north to the frozen Yukon. On his first day, he saw a friendly dog named Curly go up to another dog to say hello. The other dog attacked her, and in seconds, thirty or forty dogs surrounded her and killed her. Buck learned the second law: there was no fair play. If you fell down, it was the end. He decided that he would never fall down.","He was put in a harness and learned to pull a sled. He learned fast. He learned to sleep in a hole in the snow, to steal food when he was hungry, and to eat quickly before other dogs took his share. His muscles became as hard as iron. More than that, old instincts that had slept for a long time began to wake up inside him. He seemed to remember the wild dogs of long ago that hunted together in the forest. On cold, quiet nights, he pointed his nose at the stars and howled like a wolf.","The lead dog, Spitz, was a cruel and experienced fighter, and he hated Buck. One night, under the moonlight, the two dogs finally fought. The other dogs made a circle and waited. Spitz was skillful, but Buck was clever as well as strong. He pretended to attack Spitz’s shoulder, then went low and bit his front leg. Soon Spitz fell, and the circle closed in. Buck became the new leader, and he was the best lead dog the drivers had ever seen.","Later, Buck was sold to three foolish people who knew nothing about the North. They put too much on the sled, wasted food, and beat the hungry dogs. When they reached the camp of a man named John Thornton, Buck was so weak that he refused to get up, even when they hit him. The ice on the river was melting, and Buck felt the danger. Thornton was angry at their cruelty, and he cut Buck free. The others laughed and drove on across the river. A few minutes later, the ice broke, and the sled, the people, and the dogs all disappeared into the cold water.","John Thornton took care of Buck until he was healthy again. For the first time, Buck felt real love. Thornton talked to him like a friend and called him wonderful names. Buck lay at his feet for hours, just watching his face. He saved Thornton’s life twice. Once, to win a bet for Thornton, he pulled a sled with almost five hundred kilograms of flour, something no dog had ever done before. But even while he loved Thornton, Buck heard a strange call from deep in the forest — a wild call that made him restless.","Thornton and his partners traveled far to look for gold. While the men worked, Buck went into the forest for days at a time. He met a wild wolf and ran beside it like a brother. But each time, his love for Thornton brought him back to the camp. Then one day, when he came back, the camp had been destroyed. A group of attackers had come, and John Thornton was dead. Buck’s sadness was terrible. With a great roar, he attacked the attackers, and they ran away in fear.","That night, while Buck sat by the pool where Thornton had died, he heard the call more clearly than ever. A pack of wolves came into the open space. When they attacked him, he fought them one by one until they stopped. Then the wolf he had met before came forward, and they touched noses. The old wolves howled, and Buck sat down and howled with them. His last tie to humans was broken. He ran into the forest with the pack, side by side with his wild brother. For years after that, people told stories about a giant “Ghost Dog” that ran at the front of the wolf pack. But every summer, he came back to the place where John Thornton had died, and he sat there alone for a long time, howling a long, sad song."],"ko":["벅은 신문을 읽지 않았다. 읽었다면 문제가 다가오고 있다는 걸 알았을 것이다. 사람들이 캐나다의 추운 북쪽 땅에서 금을 발견했고, 수천 명이 그곳으로 몰려가고 있었다. 이 사람들에게는 개가 필요했다. 눈 속에서 썰매를 끌 수 있는, 털이 두껍고 크고 힘센 개 말이다.","벅은 햇살 가득한 캘리포니아의 큰 집에 살았다. 그 집은 밀러 판사의 것이었다. 벅은 네 살이었고, 그의 삶은 왕과 같았다. 아버지는 거대한 세인트버나드였고 어머니는 스코틀랜드 셰퍼드였다. 몸무게는 64킬로그램이었다. 그는 헤엄치고, 사냥하고, 판사의 손주들과 놀았으며, 저녁이면 따뜻한 난롯가에 누워 있었다.","그런데 정원사의 조수 중 한 명인 마누엘은 도박을 좋아했고, 돈이 필요했다. 어느 날 밤, 그는 벅을 작은 기차역으로 데려가 낯선 사람에게 팔아 버렸다. 사람들은 벅의 목에 밧줄을 감았다. 벅이 저항하자 그들은 밧줄을 너무 세게 당겨 벅이 숨을 쉴 수 없게 했다. 이틀 밤낮 동안 벅은 먹이도 물도 없이 기차 안 우리에 갇혀 이동했다. 그는 분노로 사나워졌다.","시애틀에서 빨간 스웨터를 입은 남자가 우리를 열었다. 그는 몽둥이를 들고 있었다. 벅은 몇 번이고 그에게 달려들었고, 그때마다 몽둥이가 벅을 내리쳤다. 마침내 벅은 일어설 수 없었다. 그는 맞았지만, 꺾이지는 않았다. 그는 결코 잊지 못할 교훈을 얻었다. 몽둥이를 든 사람은 복종해야 하는 주인이라는 것. 그것이 야생의 첫 번째 법칙이었다.","벅은 우편배달부 두 명에게 팔려 얼어붙은 유콘 북쪽으로 갔다. 첫날, 그는 컬리라는 다정한 개가 다른 개에게 인사하러 다가가는 것을 보았다. 그 개는 컬리를 공격했고, 몇 초 만에 서른에서 마흔 마리의 개가 컬리를 둘러싸고 죽여 버렸다. 벅은 두 번째 법칙을 배웠다. 공정한 싸움은 없다는 것. 쓰러지면 그걸로 끝이었다. 벅은 절대 쓰러지지 않겠다고 결심했다.","벅은 마구를 차고 썰매 끄는 법을 배웠다. 그는 빨리 배웠다. 눈 구덩이 속에서 자는 법, 배고플 때 먹이를 훔치는 법, 다른 개들이 자기 몫을 빼앗기 전에 빨리 먹는 법을 배웠다. 그의 근육은 쇠처럼 단단해졌다. 그보다 더한 것은, 오랫동안 잠들어 있던 오래된 본능이 그의 안에서 깨어나기 시작했다는 것이다. 그는 아주 먼 옛날 숲에서 함께 사냥하던 야생 개들을 기억하는 것 같았다. 춥고 고요한 밤이면 그는 별을 향해 코를 들고 늑대처럼 울부짖었다.","대장 개 스피츠는 잔인하고 노련한 싸움꾼이었고, 벅을 미워했다. 어느 날 밤, 달빛 아래에서 두 개는 마침내 싸웠다. 다른 개들은 둥글게 원을 만들고 기다렸다. 스피츠는 기술이 좋았지만, 벅은 힘이 셀 뿐 아니라 영리했다. 그는 스피츠의 어깨를 공격하는 척하다가, 낮게 파고들어 앞다리를 물었다. 곧 스피츠가 쓰러졌고, 원이 좁혀 들었다. 벅은 새로운 대장이 되었고, 썰매꾼들이 지금까지 본 최고의 대장 개가 되었다.","나중에 벅은 북쪽에 대해 아무것도 모르는 어리석은 세 사람에게 팔렸다. 그들은 썰매에 짐을 너무 많이 싣고, 먹이를 낭비하고, 굶주린 개들을 때렸다. 존 손턴이라는 남자의 야영지에 도착했을 때, 벅은 너무 약해져서 맞아도 일어나기를 거부했다. 강의 얼음이 녹고 있었고, 벅은 위험을 느꼈다. 손턴은 그들의 잔인함에 화가 나서 벅을 풀어 주었다. 나머지 사람들은 비웃으며 강을 건너갔다. 몇 분 뒤 얼음이 깨졌고, 썰매와 사람들과 개들은 모두 차가운 물속으로 사라졌다.","존 손턴은 벅이 다시 건강해질 때까지 돌봐 주었다. 처음으로 벅은 진짜 사랑을 느꼈다. 손턴은 친구처럼 벅에게 이야기했고 멋진 이름으로 불러 주었다. 벅은 몇 시간이고 그의 발치에 누워 그의 얼굴만 바라보았다. 벅은 손턴의 목숨을 두 번 구했다. 한번은 손턴이 내기에서 이기도록, 밀가루 거의 500킬로그램을 실은 썰매를 끌었다. 어떤 개도 해낸 적 없는 일이었다. 하지만 손턴을 사랑하는 동안에도, 벅은 숲속 깊은 곳에서 들려오는 이상한 부름을 들었다. 그를 들뜨게 하는 야성의 부름이었다.","손턴과 동료들은 금을 찾아 멀리 여행했다. 사람들이 일하는 동안 벅은 며칠씩 숲으로 들어갔다. 그는 야생 늑대 한 마리를 만나 형제처럼 나란히 달렸다. 하지만 매번 손턴에 대한 사랑이 그를 야영지로 돌아오게 했다. 그러던 어느 날, 돌아와 보니 야영지가 부서져 있었다. 습격자들이 쳐들어왔고, 존 손턴은 죽었다. 벅의 슬픔은 끔찍했다. 그는 크게 포효하며 습격자들에게 달려들었고, 그들은 겁에 질려 달아났다.","그날 밤, 손턴이 죽은 연못가에 앉아 있던 벅은 그 어느 때보다 분명하게 그 부름을 들었다. 늑대 무리가 빈터로 들어왔다. 늑대들이 공격하자 벅은 그들이 멈출 때까지 한 마리씩 상대했다. 그러자 전에 만났던 늑대가 앞으로 나왔고, 둘은 코를 맞댔다. 늙은 늑대들이 울부짖었고, 벅도 앉아서 함께 울부짖었다. 인간과의 마지막 연결이 끊어졌다. 그는 야생의 형제와 나란히 늑대 무리와 함께 숲으로 달려갔다. 그 후 몇 년 동안 사람들은 늑대 무리의 맨 앞을 달리는 거대한 “유령 개” 이야기를 했다. 하지만 매년 여름이면 그는 존 손턴이 죽은 곳으로 돌아와, 오랫동안 홀로 앉아 길고 슬픈 노래를 부르듯 울부짖었다."],"gloss":[["rush","몰려가다"],["fur","털"],["judge","판사"],["cage","우리"],["obey","복종하다"],["mail carrier","우편배달부"],["harness","마구 (썰매 줄)"],["share","몫"],["skillful","기술이 좋은"],["bet","내기"],["restless","들뜬, 가만히 있지 못하는"],["tie","연결, 유대"]],"keySentences":[["Buck didn’t read the newspapers, or he would have known that trouble was coming.","유명한 첫 문장. or = 그렇지 않았다면 + 가정법 과거완료"],["He had been beaten, but he was not broken.","“그는 맞았지만, 꺾이지는 않았다” — 수동태 두 개로 벅의 강한 정신을 표현"],["Buck was clever as well as strong.","A as well as B = B뿐만 아니라 A도"],["His last tie to humans was broken.","인간과의 마지막 연결이 끊어졌다 — 벅이 완전히 야생으로 돌아가는 순간"]],"tf":[["Buck was born in the wild Northland.","F — 캘리포니아의 판사 집에서 편하게 살았다."],["Manuel sold Buck because he needed money for gambling.","T"],["Buck won the fight with Spitz and became the leader.","T"],["After Thornton died, Buck went back to live with people.","F — 늑대 무리와 함께 야생으로 갔다."]],"questions":[["Why did people need dogs like Buck?","Because of the gold rush. They needed big, strong dogs with thick fur to pull sleds."],["What two laws did Buck learn in the North?","A man with a club must be obeyed. / There is no fair play — if you fall, it’s the end."],["How was Thornton different from Buck’s other masters?","He loved Buck and treated him like a friend, not with fear."],["Is the ending happy or sad? Why?","(예) Both. Buck is free and finds his true self, but he still misses Thornton."]],"listening":{"shadow":"4","dictation":[["These men ___ dogs — big, strong dogs with thick fur to pull sleds through the snow.","needed"],["He had been beaten, but he was not ___.","broken"],["Buck learned the second law: there was no fair ___.","play"],["Buck was clever as well as ___.","strong"],["His last tie to humans was ___.","broken"]]},"grammar":{"title":"6개월 문법 총정리 — 작품 속 핵심 문장 24","explain":["아래 표는 24주 동안 작품 속에서 배운 핵심 문법입니다. 예문을 소리 내어 읽고, 같은 문법으로 나만의 문장을 하나씩 만들어 보세요.","헷갈리는 항목은 해당 주차의 작품으로 돌아가 본문에서 다시 찾아보세요. 이야기 속에서 다시 보면 훨씬 오래 기억됩니다."],"table":{"h":["주","문법","작품 속 예문"],"r":[["1","과거진행 vs 과거","A Grasshopper was singing when he saw an Ant."],["2","pretend to / feel like","They pretended to make cloth."],["3","I wish","I wish you were far away."],["4","비교급 and 비교급","The sea became darker and darker."],["5","관계대명사","a palace where nobody was ever sad"],["6","used to","The children used to play there."],["7","지각동사","She saw a star fall."],["8","간접화법","The Fairy asked where the money was."],["9","추측 must / might","You must be mad."],["10","가정법 과거","If I had a brain, I could think."],["11","분사구문","Hearing it, Hook fell to his knees."],["12","과거완료","Ben Gunn had found the treasure."],["13","가정법 과거완료","If he hadn’t sold the watch, he could have used the chain."],["14","should / could have p.p.","He could have stayed inside."],["15","It ~ that 강조 / what","It was her pride that ruined her."],["16","논리 연결어","Therefore, he must have been digging."],["17","-ed / -ing 형용사","Life with Anne was never boring."],["18","사역동사","The garden made Colin feel alive."],["19","비교와 대조","Meg was gentle, whereas Jo was wild."],["20","unless / as long as","Unless the future changes, the child will die."],["21","정중한 표현","I’m afraid I can’t accept."],["22","양보 표현","Even though it was dangerous, he drank it."],["23","If only / 혼합 가정법","If only Victor had shown a little love!"],["24","종합","He had been beaten, but he was not broken."]]},"examples":[["Buck had been beaten, but he was not broken.","벅은 맞았지만 꺾이지 않았다. (과거완료 수동 + 대조)"],["If Manuel hadn’t gambled, Buck would still live in California.","마누엘이 도박하지 않았다면 벅은 아직 캘리포니아에 살 텐데. (혼합 가정법)"],["Pointing his nose at the stars, he howled like a wolf.","별을 향해 코를 들고 그는 늑대처럼 울부짖었다. (분사구문)"],["It was love that brought him back to the camp every time.","매번 그를 야영지로 돌아오게 한 건 바로 사랑이었다. (강조)"]],"exercise":[["Buck ___ (live) in California before he ___ (be) sold.","had lived / was"],["___ (feel) the call of the wild, Buck ran into the forest. (분사구문)","Feeling"],["If Thornton ___ (not / save) Buck, Buck would have died.","had not saved"],["Although he loved Thornton, he ___ (still / hear) the call.","still heard"]]},"expressions":[["belong to ~","~의 것이다","This bag belongs to my sister."],["as well as","~뿐만 아니라","She speaks Chinese as well as English."],["for the first time","처음으로","For the first time, Buck felt real love."],["side by side","나란히","They walked side by side."]],"speaking":{"retell":["Buck – a king’s life in California","Manuel sold him – the man with the club","the North – Curly – no fair play","sled dog – old instincts – howled","fight with Spitz – leader","foolish owners – Thornton saved him – true love","Thornton died – joined the wolves – the Ghost Dog"],"discuss":["Is Buck’s return to the wild a happy ending or a sad ending?","How have difficult experiences changed you?","Looking back on the 24 stories, which character changed the most? Which story will you remember?"],"model":["Which story will you remember most?","I will remember The Last Leaf the most. At first, I thought it was just a sad story about a sick girl. But Mr. Behrman moved me. Everyone thought he was a failure, but he made a masterpiece that saved a life. Also, reading 24 classic stories in English has made me much more confident. Six months ago, I couldn’t have imagined reading Frankenstein in English!"],"roleplay":"A: 마지막 밤 숲가의 벅 (생각을 말로 표현) / B: 그를 부르는 늑대. 벅이 왜 인간 세계를 떠나는지 대화로 표현해 보세요."},"writing":{"task":"최종 과제 — 북 리뷰(서평): 24편 중 가장 인상 깊은 작품 (230~260단어)","hints":["1. 소개: 제목, 작가, 연도, 한 줄 소개","2. 줄거리: 결말은 말하지 않고 4~5문장","3. 분석: 주제와 인물 + 인상 깊은 문장 인용","4. 평가: 좋은 점과 아쉬운 점 (Although ~)","5. 추천: 누구에게 추천하는지, 별점"],"model":["Book Review: The Call of the Wild by Jack London (1903) ★★★★★","The Call of the Wild is a short but powerful adventure story about a dog named Buck. He is taken from a comfortable home in California and forced to work as a sled dog during the Gold Rush in northern Canada.","At the beginning, Buck lives like a king. However, after a gardener sells him, he is sent to the frozen North. There, he must learn the hard laws of the wild to survive. He fights for leadership, suffers under cruel owners, and finally finds true love with a man named John Thornton. But all the while, a strange call from the forest grows louder.","The main theme of the novel is the conflict between civilization and nature. Buck slowly discovers the wild instincts that had been sleeping inside him. One line shows his character perfectly: “He had been beaten, but he was not broken.” London’s descriptions of the snow, the silence, and the wolves are so vivid that I felt cold while reading.","Although some scenes of violence are difficult to read, they show how hard the world can be, and they make Buck’s love for Thornton even more touching. My only criticism is that most of the human characters are rather simple.","I would highly recommend this book to anyone who loves adventure, animals, or stories about finding one’s true self. It is also a great choice for English learners, because it is short and full of clear, strong sentences."]},"quote":["“He had been beaten (he knew that); but he was not broken.” (Jack London)","그는 맞았다(그는 그걸 알았다). 하지만 꺾이지는 않았다."]}],"review":{"vocab":[["prejudice","편견"],["judge","판단하다"],["respect","존경하다"],["confession","고백"],["creature","창조물"],["responsible","책임 있는"],["revenge","복수"],["instinct","본능"],["wild","야생의"],["leader","대장, 리더"]],"grammar":[["I’m ___ I can’t come to the meeting. (정중한 거절)","afraid"],["___ the rain, we went out. (despite / although)","Despite"],["If Victor had cared, his family ___ (be) alive now.","would be"],["If only I ___ (listen) to you!","had listened"],["___ (point) his nose at the stars, Buck howled.","Pointing"]],"project":{"title":"6개월 최종 프로젝트 — 나만의 짧은 이야기 쓰기","steps":["400~600단어 분량의 짧은 이야기를 영어로 쓰세요. (동화, 미스터리, 성장 이야기 등 자유)","24편에서 배운 구조 활용: 배경 → 사건 → 갈등 → 반전 또는 변화 → 결말","최소 8가지 문법 사용 (가정법, 분사구문, 과거완료, 강조 구문 등)","대사, 오감 묘사, 인물의 감정 변화 포함","완성한 이야기를 5분 동안 낭독해 녹음하세요. 1주차 녹음과 비교해 보세요!"]}}}]</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const UNITS = []; DATA.forEach(m => m.units.forEach(u => { u.month = m.month; UNITS.push(u); }));
const MCOL = ['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m5)','var(--m6)'];
const STEPS = [
  ['read','읽기','📖'],['vocab','단어','🃏'],['quiz','독해','✅'],['listen','듣기','🎧'],
  ['grammar','문법','✏️'],['speak','말하기','🗣️'],['write','쓰기','📝']];
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('#app');

/* ---------- state ---------- */
const LS = 'classic-english-v1';
let S = { done:{}, known:{}, unknown:{}, drafts:{}, quiz:{}, settings:{rate:0.9, fs:18}, last:null, ts:0 };
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
let db = null, uid = null, saveTimer = null, saving = false, pending = false;
function persist(){
  S.ts = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
  if (!db || !uid) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(remoteSave, 1500);
}
async function remoteSave(){
  if (saving){ pending = true; return; }
  saving = true;
  try {
    const { drafts, ...rest } = S;
    await db.doc('data/users/'+uid+'/progress').set(JSON.parse(JSON.stringify(rest)));
    await db.doc('data/users/'+uid+'/drafts').set({ drafts, ts:S.ts });
  } catch(e){ /* keep local copy */ }
  saving = false;
  if (pending){ pending = false; remoteSave(); }
}
(async function connect(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!d || !u) return;
    const id = await u.id(); if (!id) return;
    db = d; uid = id;
    const [p, dr] = await Promise.all([db.doc('data/users/'+uid+'/progress').get(), db.doc('data/users/'+uid+'/drafts').get()]);
    if (p.exists){
      const r = p.data() || {};
      for (const k of ['done','known','unknown','quiz']) S[k] = Object.assign({}, r[k]||{}, S[k]||{});
      if ((r.ts||0) > (S.ts||0)){ if (r.settings) S.settings = r.settings; if (r.last) S.last = r.last; }
    }
    if (dr.exists){ const r = dr.data()||{}; S.drafts = Object.assign({}, r.drafts||{}, S.drafts||{}); }
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
    persist(); render(true);
    toast('진도가 계정에 저장됩니다');
  } catch(e){}
})();

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
const isDone = (w,k) => !!S.done['w'+w+'_'+k];
function setDone(w,k,v){ S.done['w'+w+'_'+k] = v; if(!v) delete S.done['w'+w+'_'+k]; persist(); }
const unitPct = w => STEPS.filter(s=>isDone(w,s[0])).length / STEPS.length;
const totalPct = () => UNITS.reduce((a,u)=>a+unitPct(u.week),0)/UNITS.length;

/* ---------- speech ---------- */
const synth = window.speechSynthesis;
let voice = null, speakToken = 0;
function pickVoice(){
  if (!synth) return;
  const vs = synth.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  const pref = ['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Daniel','Google UK English Female'];
  voice = pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean) || vs.find(v=>/en-US/i.test(v.lang)) || vs[0] || null;
}
if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function stopSpeak(){ speakToken++; if (synth) synth.cancel(); document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking')); }
function speak(text, opt={}){
  if (!synth){ toast('이 기기에서는 음성 읽기를 지원하지 않아요'); return Promise.resolve(); }
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(text.replace(/[“”]/g,'"').replace(/’/g,"'").replace(/___/g,'blank'));
    if (voice) u.voice = voice; u.lang = voice ? voice.lang : 'en-US';
    u.rate = opt.rate || S.settings.rate; u.onend = res; u.onerror = res;
    synth.speak(u);
  });
}
async function speakSeq(items){ // items: [{text, el}]
  stopSpeak(); const tok = speakToken;
  for (const it of items){
    if (tok !== speakToken) return;
    if (it.el){ it.el.classList.add('speaking'); it.el.scrollIntoView({block:'center',behavior:'smooth'}); }
    await speak(it.text);
    if (it.el) it.el.classList.remove('speaking');
  }
}
const norm = s => String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”".,!?;:()]/g,'').replace(/\s+/g,' ').trim();
function checkAns(input, ans){ const a = String(ans).split(' / ').map(norm); const v = norm(input); return v && a.some(x => x===v || x.replace(/'ll\b/,' will')===v); }

/* ---------- router ---------- */
let view = { name:'home', month:1, week:null, step:'read', fcIndex:0, fcMode:'card', fcFlip:false, showKo:false };
function go(v){ stopSpeak(); Object.assign(view, v); if (view.name==='unit'){ S.last = view.week; persist(); try{ history.replaceState(null,'','#w'+view.week); }catch(e){} } else { try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} } render(); window.scrollTo(0,0); }
(function initHash(){ const m = /^#w(\d+)$/.exec(location.hash||''); if (m){ const w=+m[1]; const u=UNITS.find(x=>x.week===w); if(u){ view.name='unit'; view.week=w; view.month=u.month; } } else if (S.last){ const u=UNITS.find(x=>x.week===S.last); if(u) view.month=u.month; } })();

/* ---------- render ---------- */
function render(soft){
  const y = window.scrollY;
  if (view.name==='home') app.innerHTML = homeView();
  else if (view.name==='unit') app.innerHTML = unitView();
  else if (view.name==='review') app.innerHTML = reviewView();
  else if (view.name==='words') app.innerHTML = wordsView();
  else if (view.name==='stats') app.innerHTML = statsView();
  if (soft) window.scrollTo(0,y);
  const tabsel = app.querySelector('.tab[aria-selected="true"]'); if (tabsel) tabsel.scrollIntoView({inline:'center',block:'nearest'});
}
function topbar(title, back, extra=''){
  return `<header class="top"><div class="bar">${back?`<button class="iconbtn" data-act="back" aria-label="뒤로">←</button>`:''}<h1>${title}</h1>${extra}</div></header>`;
}
function bottomnav(cur){
  const it = [['home','📚','책장'],['words','🃏','단어장'],['stats','📈','진도']];
  return `<nav class="nav"><div class="in">${it.map(([k,i,l])=>`<button data-act="nav" data-to="${k}" ${cur===k?'aria-current="page"':''}><span>${i}</span><span>${l}</span></button>`).join('')}</div></nav>`;
}
function homeView(){
  const m = DATA[view.month-1];
  const pct = Math.round(totalPct()*100);
  const next = UNITS.find(u=>unitPct(u.week)<1) || UNITS[UNITS.length-1];
  const resumeW = S.last ? UNITS.find(u=>u.week===S.last) : next;
  return topbar('명작 영어 클래스') + `<main class="wrap">
  <section class="hero">
    <div><div class="eyebrow">6개월 중급 과정 · 명작 24편</div><h2>오늘도 한 페이지씩.</h2></div>
    <div class="fc-row small"><span>전체 진도</span><b>${pct}%</b></div>
    <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <button class="resume" data-act="open" data-w="${resumeW.week}">
      <div class="cv" style="--c:${MCOL[resumeW.month-1]}"></div>
      <div style="min-width:0"><span class="eyebrow">${S.last?'이어서 공부하기':'시작하기'} · Week ${resumeW.week}</span><b>${esc(resumeW.en)}</b><span class="small muted">${esc(resumeW.title)} · ${Math.round(unitPct(resumeW.week)*100)}% 완료</span></div>
    </button>
  </section>
  <div class="monthsel" role="group" aria-label="월 선택">${DATA.map(x=>`<button data-act="month" data-m="${x.month}" aria-pressed="${x.month===view.month}">${x.month}개월</button>`).join('')}</div>
  <div class="monthhead"><span class="eyebrow">${m.month}개월 차 · ${esc(m.level)}</span><h3>${esc(m.title.split('—')[0].trim())}</h3><p class="small muted" style="margin:0">${esc(m.title.split('—')[1]||'')}</p></div>
  <div class="shelf">${m.units.map(u=>coverTile(u)).join('')}
    <button class="reviewbtn" data-act="review" data-m="${m.month}"><b>${m.month}개월 차 마무리</b><br><span class="small muted">어휘 퀴즈 · 문법 테스트 · 월말 프로젝트</span></button>
  </div>
  <h3 style="font-size:17px;margin:26px 0 10px">전체 작품 목록</h3>
  <div class="list">${UNITS.map(u=>`<button class="row" style="border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;width:100%" data-act="open" data-w="${u.week}"><div style="min-width:0"><span class="sub">${u.month}개월 · Week ${u.week}</span><br><b>${esc(u.en)}</b> <span class="small">${esc(u.title)}</span></div><span class="small muted">${Math.round(unitPct(u.week)*100)}%</span></button>`).join('')}</div>
  </main>` + bottomnav('home');
}
function coverTile(u){
  return `<button class="cover" style="--c:${MCOL[u.month-1]}" data-act="open" data-w="${u.week}">
    <span class="wk">Week ${u.week}</span><span class="ti">${esc(u.en)}</span><span class="ko">${esc(u.title)}</span>
    <span class="dots" aria-label="${Math.round(unitPct(u.week)*100)}% 완료">${STEPS.map(s=>`<i class="${isDone(u.week,s[0])?'on':''}"></i>`).join('')}</span></button>`;
}
function curUnit(){ return UNITS.find(u=>u.week===view.week); }
function unitView(){
  const u = curUnit(); const c = MCOL[u.month-1];
  const tabs = `<div class="tabs" role="tablist">${STEPS.map(([k,l,i])=>`<button class="tab" role="tab" data-act="step" data-s="${k}" aria-selected="${view.step===k}"><span>${i}</span>${l}${isDone(u.week,k)?'<span class="chk">●</span>':''}</button>`).join('')}</div>`;
  const head = `<header class="top"><div class="bar"><button class="iconbtn" data-act="nav" data-to="home" aria-label="책장으로">←</button><h1>W${u.week} · ${esc(u.en)}</h1><span class="small muted">${Math.round(unitPct(u.week)*100)}%</span></div>${tabs}</header>`;
  const body = ({read:readStep,vocab:vocabStep,quiz:quizStep,listen:listenStep,grammar:grammarStep,speak:speakStep,write:writeStep})[view.step](u);
  const done = isDone(u.week,view.step);
  const idx = STEPS.findIndex(s=>s[0]===view.step);
  const nextS = STEPS[idx+1];
  return head + `<main class="wrap" style="--c:${c}"><div class="sec">${body}
    <div class="stepdone"><button class="btn ${done?'done':'primary'}" data-act="toggleDone">${done?'✓ 이 단계 완료됨':'이 단계 완료하기'}</button></div>
    ${nextS?`<div class="stepdone"><button class="btn" data-act="step" data-s="${nextS[0]}">다음: ${nextS[2]} ${nextS[1]} →</button></div>`:''}
  </div></main>`;
}
function readStep(u){
  const fs = S.settings.fs;
  return `<div class="card"><div class="meta">${esc(u.author)} · ${esc(u.year)} · ${esc(u.genre)}</div><h3 style="margin-top:6px">${esc(u.title)}</h3><p style="margin:0">${esc(u.intro)}</p></div>
  <details><summary>등장인물</summary><ul class="chars">${u.characters.map(c=>`<li><b>${esc(c[0])}</b><span>${esc(c[1])}</span></li>`).join('')}</ul></details>
  <details><summary>읽기 전 생각해 보기</summary><ul class="clean">${u.warmup.map(w=>`<li><span style="font-family:var(--serif)">${esc(w[0])}</span><br><span class="small muted">${esc(w[1])}</span></li>`).join('')}</ul></details>
  <div class="toolbar">
    <button class="btn primary" data-act="playAll">▶ 전체 듣기</button><button class="btn" data-act="stop">■ 정지</button>
    <div class="seg" role="group" aria-label="읽기 속도">${[0.7,0.9,1.0].map(r=>`<button data-act="rate" data-r="${r}" aria-pressed="${S.settings.rate===r}">${r}x</button>`).join('')}</div>
  </div>
  <div class="toolbar"><button class="btn" data-act="toggleKoAll">${view.showKo?'해석 모두 숨기기':'해석 모두 보기'}</button>
    <div class="seg" role="group" aria-label="글자 크기"><button data-act="fs" data-d="-1">가−</button><button data-act="fs" data-d="1">가+</button></div></div>
  <article class="story" style="--fs:${fs}px"><h2>${esc(u.en)}</h2><div class="by">retold in easy English · ${esc(u.author.split(' (')[0])}</div>
  ${u.story.map((p,i)=>`<p class="para" id="p${i}"><span class="n">${i+1}</span>${esc(p)}${view.showKo?`<span class="ko">${esc(u.ko[i])}</span>`:''}<span class="acts"><button class="mini" data-act="playP" data-i="${i}">🔊 듣기</button>${view.showKo?'':`<button class="mini" data-act="koP" data-i="${i}">해석</button>`}</span></p>`).join('')}
  </article>
  <div class="card"><h3>본문 속 단어</h3><div class="gloss">${u.gloss.map(g=>`<span><b>${esc(g[0])}</b>${esc(g[1])}</span>`).join('')}</div></div>
  <div class="card"><h3>핵심 문장 해설</h3><div class="ks">${u.keySentences.map(k=>`<div><p class="en">${esc(k[0])} <button class="mini" data-act="say" data-t="${esc(k[0])}">🔊</button></p><p class="ex">${esc(k[1])}</p></div>`).join('')}</div></div>
  <div class="card"><div class="eyebrow">오늘의 명문장 · 원작에서</div><p class="quote" style="margin:8px 0 4px">${esc(u.quote[0])}</p><p class="small muted" style="margin:0">${esc(u.quote[1])}</p></div>`;
}
function vocabStep(u){
  const v = u.vocab; const i = Math.min(view.fcIndex, v.length-1); const w = v[i];
  const key = w[0]; const st = S.known[key] ? 'ok' : S.unknown[key] ? 'bad' : '';
  const knownN = v.filter(x=>S.known[x[0]]).length;
  const modeSel = `<div class="seg" role="group"><button data-act="fcMode" data-m="card" aria-pressed="${view.fcMode==='card'}">카드</button><button data-act="fcMode" data-m="list" aria-pressed="${view.fcMode==='list'}">목록</button></div>`;
  if (view.fcMode==='list'){

/* ---------- events ---------- */
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act; const u = view.name==='unit' ? curUnit() : null;
  switch(a){
    case 'nav': go({name:b.dataset.to}); break;
    case 'back': go({name:'home'}); break;
    case 'month': view.month = +b.dataset.m; if (b.dataset.home) go({name:'home'}); else render(true); break;
    case 'open': go({name:'unit', week:+b.dataset.w, month:UNITS.find(x=>x.week===+b.dataset.w).month, step:'read', fcIndex:0, fcFlip:false, showKo:false}); break;
    case 'review': go({name:'review', month:+b.dataset.m}); break;
    case 'step': stopSpeak(); view.step = b.dataset.s; view.fcFlip=false; render(); window.scrollTo(0,0); break;
    case 'toggleDone': { const v = !isDone(u.week, view.step); setDone(u.week, view.step, v); toast(v?'완료로 표시했어요':'완료 표시를 지웠어요'); render(true); break; }
    case 'playAll': { const ps=[...document.querySelectorAll('.story .para')]; speakSeq(u.story.map((t,i)=>({text:t, el:ps[i]}))); break; }
    case 'playP': { const i=+b.dataset.i; speakSeq([{text:u.story[i], el:document.getElementById('p'+i)}]); break; }
    case 'stop': stopSpeak(); break;
    case 'koP': { const p = document.getElementById('p'+b.dataset.i); if (!p.querySelector('.ko')){ const s=document.createElement('span'); s.className='ko'; s.textContent=u.ko[+b.dataset.i]; p.insertBefore(s, p.querySelector('.acts')); b.remove(); } break; }
    case 'toggleKoAll': view.showKo = !view.showKo; render(true); break;
    case 'rate': S.settings.rate = +b.dataset.r; persist(); render(true); break;
    case 'fs': S.settings.fs = Math.max(15, Math.min(24, S.settings.fs + (+b.dataset.d))); persist(); render(true); break;
    case 'say': speakSeq([{text:b.dataset.t}]); break;
    case 'sayslow': stopSpeak(); speak(b.dataset.t, {rate:0.6}); break;
    case 'flip': view.fcFlip = !view.fcFlip; b.classList.toggle('flipped'); if (view.fcFlip){ const w=u.vocab[view.fcIndex]; speakSeq([{text:w[0].split(' (')[0]}]); } break;
    case 'fcNext': view.fcIndex = Math.min(u.vocab.length-1, view.fcIndex+1); view.fcFlip=false; render(true); break;
    case 'fcPrev': view.fcIndex = Math.max(0, view.fcIndex-1); view.fcFlip=false; render(true); break;
    case 'fcMode': view.fcMode = b.dataset.m; render(true); break;
    case 'mark': { const w = u.vocab[view.fcIndex][0]; if (b.dataset.k==='known'){ S.known[w]=1; delete S.unknown[w]; } else { S.unknown[w]=1; delete S.known[w]; } persist();
      if (view.fcIndex < u.vocab.length-1){ view.fcIndex++; view.fcFlip=false; } else { toast('마지막 단어예요'); if (u.vocab.every(x=>S.known[x[0]]||S.unknown[x[0]])) setDone(u.week,'vocab',true); }
      render(true); break; }
    case 'tf': { const k='w'+u.week; S.quiz[k]=S.quiz[k]||{}; S.quiz[k]['tf'+b.dataset.i]=b.dataset.o; persist(); render(true); break; }
    case 'resetQuiz': { const k='w'+u.week; if(S.quiz[k]) Object.keys(S.quiz[k]).filter(x=>x.startsWith('tf')).forEach(x=>delete S.quiz[k][x]); persist(); render(true); break; }
    case 'dict': { const i=+b.dataset.i; const v=document.getElementById('dict-'+u.week+'-'+i).value; const k='w'+u.week; S.quiz[k]=S.quiz[k]||{}; S.quiz[k]['d'+i]=checkAns(v,u.listening.dictation[i][1])?'ok':'bad'; persist(); render(true); break; }
    case 'shadow': { const i=+b.dataset.i; const el=document.getElementById('sh'); const sents=u.story[i].replace(/([.!?”])\s+/g,'$1\n').split('\n'); (async()=>{ stopSpeak(); const tok=speakToken; el.classList.add('speaking'); for(const s of sents){ if(tok!==speakToken) break; await speak(s); await new Promise(r=>setTimeout(r, Math.min(4500, 900+s.length*45))); } el.classList.remove('speaking'); })(); break; }
    case 'gram': { const i=+b.dataset.i; const v=document.getElementById('gr-'+u.week+'-'+i).value; const k='w'+u.week; S.quiz[k]=S.quiz[k]||{}; S.quiz[k]['g'+i] = b.dataset.short==='1' ? (checkAns(v,u.grammar.exercise[i][1])?'ok':'bad') : 'show'; persist(); render(true); break; }
    case 'mc': { const m=view.month; const k='m'+m; S.quiz[k]=S.quiz[k]||{}; S.quiz[k]['v'+b.dataset.i]=b.dataset.o; persist(); render(true); break; }
    case 'resetReview': { const k='m'+view.month; if(S.quiz[k]) Object.keys(S.quiz[k]).filter(x=>x.startsWith('v')).forEach(x=>delete S.quiz[k][x]); persist(); render(true); break; }
    case 'rgram': { const m=DATA[view.month-1]; const i=+b.dataset.i; const v=document.getElementById('rg-'+m.month+'-'+i).value; const k='m'+m.month; S.quiz[k]=S.quiz[k]||{}; S.quiz[k]['g'+i]=checkAns(v,m.review.grammar[i][1])?'ok':'bad'; persist(); render(true); break; }
    case 'learned': S.known[b.dataset.k]=1; delete S.unknown[b.dataset.k]; persist(); render(true); break;
    case 'backup': { try { const blob = new Blob([JSON.stringify(S)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'myeongjak-english-backup-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); toast('백업 파일을 저장했어요'); } catch(e){ toast('저장하지 못했어요'); } break; }
    case 'sayList': { const all = UNITS.flatMap(u=>u.vocab).filter(v=>S.unknown[v[0]]&&!S.known[v[0]]); speakSeq(all.map(v=>({text:v[0].split(' (')[0]+'. '+v[2]}))); break; }
  }
});
app.addEventListener('keydown', e=>{ if ((e.key==='Enter'||e.key===' ') && e.target.matches('.flash')){ e.preventDefault(); e.target.click(); } if (e.key==='Enter' && e.target.matches('input[type=text]')){ const b=e.target.parentElement.querySelector('button'); if(b) b.click(); } });
app.addEventListener('input', e=>{
  const el = e.target; if (!el.dataset.draft) return;
  S.drafts[el.dataset.draft] = el.value; persist();
  if (el.dataset.count){ const w=$('#wc'); if(w) w.textContent = (el.value.match(/[A-Za-z’']+/g)||[]).length+'단어'; }
});
app.addEventListener('change', e=>{
  if (e.target.id !== 'restore' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || typeof d !== 'object' || !d.done) throw 0;
    for (const k of ['done','known','unknown','quiz','drafts']) S[k] = Object.assign({}, S[k]||{}, d[k]||{});
    if (d.settings) S.settings = d.settings; if (d.last) S.last = d.last; persist(); render(true); toast('백업을 불러왔어요');
  } catch(err){ toast('백업 파일이 아니에요. 다른 파일을 골라 주세요'); } };
  r.readAsText(e.target.files[0]);
});
render();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
