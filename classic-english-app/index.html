"grammar":{"title":"간접화법 — 다른 사람의 말 전하기 (said / told / asked)","explain":["직접화법: “I lost it,” said Pinocchio. → 간접화법: Pinocchio said (that) he had lost it.","시제를 한 단계 과거로: am → was / lose → lost / lost → had lost / will → would / can → could","대명사도 바뀌어요: I → he/she, my → his/her","질문: asked if ~ (예/아니오 질문) / asked + where·what ~ → She asked where the money was.","명령·부탁: told / asked + 사람 + to 동사 → Geppetto told him to go to school."],"examples":[["“I will be good.” → Pinocchio promised that he would be good.","피노키오는 착해지겠다고 약속했다."],["“Where is the money?” → The Fairy asked where the money was.","요정은 돈이 어디 있는지 물었다."],["“Are you okay?” → She asked if I was okay.","그녀는 내가 괜찮은지 물었다."],["“Study hard.” → My mom told me to study hard.","엄마는 나에게 열심히 공부하라고 하셨다."]],"exercise":[["“I am tired,” she said.","She said (that) she was tired."],["“Do you like Toy Land?” Lampwick asked Pinocchio.","Lampwick asked Pinocchio if he liked Toy Land."],["“Don’t lie,” the Fairy said to him.","The Fairy told him not to lie."]]},"expressions":[["on one’s way to ~","~로 가는 길에","I met her on my way to work."],["for a while","한동안","He was good for a while."],["say no","거절하다","It’s hard to say no to my friends."],["look for","~을 찾다","I’m looking for my keys."]],"speaking":{"retell":["Geppetto – talking puppet","sold his coat – book → Pinocchio sold it","Blue Fairy – lies – long nose","Lampwick – Toy Land – donkey","shark – found Geppetto – escaped","worked, studied, helped the Fairy","became a real boy"],"discuss":["What is the biggest lesson Pinocchio learned?","What are the “Toy Lands” in modern life?","Are “white lies” (선의의 거짓말) okay?"],"model":["What are the “Toy Lands” in modern life?","I think smartphones and online games are modern Toy Lands. At first, they are fun, and we think, “Just one more video.” But hours pass very quickly, like Pinocchio’s five months. Fun is not bad, but we need to know when to stop."],"roleplay":"A: 장난감 나라에 가자는 램프윅 / B: 피노키오. 이번에는 피노키오가 거절하고 친구도 설득해 보세요. 그리고 그 대화를 간접화법으로 다른 사람에게 전해 보세요."},"writing":{"task":"2개월 차 마무리 — “내가 했던 거짓말” 경험 쓰기 (간접화법 3번 이상, 120~150단어)","hints":["언제, 누구에게, 왜 거짓말을 했는지","상대가 한 말을 간접화법으로 (She asked if ~ / I said that ~)","그 경험에서 배운 것"],"model":["When I was ten, I broke my mother’s favorite cup. I was scared, so I told her that the cat had broken it. She looked at me for a long time and asked if I was sure. I said that I was sure, but my face turned red.","That evening, my little sister told my mother that she had seen me break the cup. My mother wasn’t angry. She just said that she was sad because I didn’t tell the truth. I felt terrible.","Since then, I have tried to tell the truth, even when it is hard. Like Pinocchio, I learned that a lie grows bigger and bigger until everyone can see it."]},"quote":["“Lies, my boy, are found out very quickly.” (Carlo Collodi)","“얘야, 거짓말은 아주 금방 들통난단다.”"]}],"review":{"vocab":[["statue","동상"],["precious","소중한"],["selfish","이기적인"],["bloom","꽃이 피다"],["bare feet","맨발"],["disappear","사라지다"],["promise","약속하다"],["swallow","삼키다; 제비"],["blind","눈이 먼"],["take care of","~을 돌보다"]],"grammar":[["There is a girl ___ is crying. (관계대명사)","who"],["The children ___ to play in the garden. (~하곤 했다)","used"],["I’m used to ___ (wake) up early.","waking"],["I heard someone ___ (call) my name.","call / calling"],["“I am hungry,” he said. → He said that ___.","he was hungry"]],"project":{"title":"2개월 차 프로젝트 — 인물 소개 (Character Profile)","steps":["네 작품 중 가장 인상 깊은 인물 한 명을 고르세요.","그 인물의 성격을 나타내는 형용사 3개와 근거가 되는 장면을 쓰세요.","이야기 속에서 인물이 어떻게 변했는지 Before → After 로 쓰세요.","그 인물에게 하고 싶은 말을 3문장으로 쓰세요.","1분 30초 동안 인물 소개를 녹음하세요."]}}},{"month":3,"title":"판타지와 모험 — 상상의 세계로","level":"B1 (지문 580~610단어)","intro":"세 번째 달에는 영어권 아이들이 가장 사랑하는 판타지·모험 고전을 읽습니다. 모두 긴 소설이라 핵심 장면을 골라 쉬운 영어로 다시 썼어요. 추측 표현(must/might), 가정법, 분사구문, 과거완료처럼 소설에서 자주 만나는 문법을 익힙니다.","skill":"읽기 전략: 모르는 단어는 앞뒤 문장을 보고 뜻을 먼저 추측한 다음, 사전으로 확인하세요.","units":[{"week":9,"title":"이상한 나라의 앨리스","en":"Alice’s Adventures in Wonderland","author":"Lewis Carroll (루이스 캐럴)","year":"1865","genre":"판타지 소설 (Fantasy)","intro":"영국 작가 루이스 캐럴의 판타지 소설입니다. 토끼굴에 빠진 앨리스가 몸이 커졌다 작아졌다 하며 이상한 인물들을 만납니다. 말장난과 엉뚱한 대화가 가득한 작품으로, 이 단원에서는 토끼굴, 체셔 고양이, 미친 다과회 장면을 읽습니다.","characters":[["Alice (앨리스)","호기심 많은 일곱 살 소녀"],["The White Rabbit (흰 토끼)","시계를 보며 늘 늦었다고 서두르는 토끼"],["The Cheshire Cat (체셔 고양이)","몸은 사라지고 웃음만 남는 고양이"],["The Hatter (모자 장수)","끝나지 않는 다과회를 여는 사람"]],"warmup":[["Do you remember a strange dream? Tell me about it.","기억나는 이상한 꿈이 있나요?"],["Were you a curious child?","어릴 때 호기심이 많았나요?"]],"vocab":[["bored","지루한","Alice was bored by the river."],["rabbit","토끼","A white rabbit ran past her."],["pocket","주머니","He took a watch out of his pocket."],["follow","따라가다","Alice followed the rabbit."],["hole","구멍, 굴","She fell down a rabbit hole."],["fall","떨어지다 (fell – fallen)","She fell for a long time."],["tiny","아주 작은","She found a tiny key."],["bottle","병","The bottle said “DRINK ME.”"],["grow","자라다, 커지다","She grew very tall."],["grin","활짝 웃다; 웃음","The cat grinned at her."],["mad","미친","We’re all mad here."],["riddle","수수께끼","The Hatter asked a riddle."],["rude","무례한","That’s very rude!"],["queen","여왕","The Queen shouted angrily."],["wake up","잠에서 깨다 (woke)","Alice woke up by the river."]],"story":["Alice was sitting by the river with her sister, and she was very bored. Her sister was reading a book, but it had no pictures. “What is the use of a book without pictures?” thought Alice.","Suddenly, a White Rabbit with pink eyes ran past her. “Oh dear! Oh dear! I’m going to be late!” said the Rabbit. Then it took a watch out of its pocket! Alice jumped up. She had never seen a rabbit with a pocket or a watch. She ran after it and saw it jump down a big rabbit hole. Without thinking, Alice jumped in, too.","She fell down, down, down. It was a very deep hole, and she fell for a long time. “I must be near the center of the earth,” she thought. At last, she landed on some dry leaves. She wasn’t hurt at all.","She was in a long hall with many locked doors. On a small glass table, there was a tiny golden key and a bottle. On the bottle were the words “DRINK ME.” She drank it, and she became very small — only 25 centimeters tall! Then she ate a little cake that said “EAT ME,” and she grew so tall that her head hit the ceiling. “Curiouser and curiouser!” cried Alice. She was so surprised that she forgot her English. “Who in the world am I?” she wondered.","Later, in the woods, she saw a big cat sitting in a tree. It had a huge grin. “Which way should I go?” asked Alice. “That depends on where you want to go,” said the Cat. “I don’t really care where,” said Alice. “Then it doesn’t matter which way you go,” said the Cat. “But I don’t want to go among mad people,” said Alice. “Oh, you can’t help that,” said the Cat. “We’re all mad here. I’m mad. You’re mad.” “How do you know I’m mad?” asked Alice. “You must be,” said the Cat, “or you wouldn’t be here.” Then the Cat slowly disappeared, starting with its tail. The last thing to go was its grin.","Next, Alice found a strange tea party under a tree. The Hatter and the March Hare were sitting at a long table. “No room! No room!” they shouted. “There’s plenty of room!” said Alice, and she sat down. “Your hair needs cutting,” said the Hatter. “That’s very rude,” said Alice. The Hatter didn’t answer. Instead, he asked a riddle: “Why is a raven like a writing desk?” Alice thought hard, but later she asked for the answer. “I have no idea,” said the Hatter. It was always six o’clock at their party, so it was always tea time. “This is the stupidest tea party in my life!” said Alice, and she walked away.","After more strange adventures, Alice came to a garden where the Queen of Hearts was playing a game. The Queen was very angry all the time. “Off with her head!” she shouted at everyone. When the Queen shouted at Alice, Alice was not afraid. She had grown to her normal size again. “You’re nothing but a pack of cards!” she said. At that moment, all the cards flew up into the air and came down on her.","Alice screamed — and opened her eyes. She was lying by the river with her head in her sister’s lap. Some leaves were falling on her face. “Wake up, Alice!” said her sister. “What a long sleep you’ve had!” “Oh, I had such a strange dream!” said Alice."],"ko":["앨리스는 언니와 함께 강가에 앉아 있었는데, 무척 지루했다. 언니는 책을 읽고 있었지만, 그 책에는 그림이 하나도 없었다. “그림 없는 책이 무슨 소용이람?” 앨리스는 생각했다.","갑자기 분홍 눈을 한 흰 토끼가 앨리스 옆을 달려 지나갔다. “이런! 이런! 늦겠어!” 토끼가 말했다. 그러더니 주머니에서 시계를 꺼냈다! 앨리스는 벌떡 일어났다. 주머니가 있거나 시계를 가진 토끼는 본 적이 없었다. 앨리스는 토끼를 쫓아 달려갔고, 토끼가 커다란 토끼굴로 뛰어드는 것을 보았다. 앨리스는 아무 생각 없이 같이 뛰어들었다.","앨리스는 아래로, 아래로, 아래로 떨어졌다. 아주 깊은 굴이라 오랫동안 떨어졌다. “지구 한가운데 가까이 온 게 틀림없어.” 앨리스는 생각했다. 마침내 앨리스는 마른 나뭇잎 더미 위에 떨어졌다. 다친 곳은 하나도 없었다.","앨리스는 잠긴 문이 많은 긴 복도에 있었다. 작은 유리 탁자 위에 아주 작은 금 열쇠와 병 하나가 있었다. 병에는 “나를 마셔요”라고 쓰여 있었다. 앨리스가 그것을 마시자 몸이 아주 작아졌다. 겨우 25센티미터였다! 그다음 “나를 먹어요”라고 쓰인 작은 케이크를 먹자, 이번엔 너무 커져서 머리가 천장에 부딪혔다. “점점 더 이상해져!” 앨리스가 외쳤다. 너무 놀라서 말이 엉망이 되어 버렸다. “세상에, 나는 누구지?” 앨리스는 궁금했다.","나중에 숲속에서 앨리스는 나무에 앉아 있는 커다란 고양이를 보았다. 고양이는 입이 찢어지게 웃고 있었다. “어느 길로 가야 하니?” 앨리스가 물었다. “그건 네가 어디로 가고 싶은지에 달렸지.” 고양이가 말했다. “어디든 별로 상관없어.” 앨리스가 말했다. “그럼 어느 길로 가든 상관없지.” 고양이가 말했다. “하지만 미친 사람들 사이엔 가고 싶지 않아.” 앨리스가 말했다. “아, 그건 어쩔 수 없어.” 고양이가 말했다. “여긴 다 미쳤거든. 나도 미쳤고, 너도 미쳤어.” “내가 미쳤는지 어떻게 알아?” 앨리스가 물었다. “틀림없이 미쳤지.” 고양이가 말했다. “안 그러면 여기 있지 않을 테니까.” 그러고는 고양이가 꼬리부터 천천히 사라졌다. 마지막까지 남은 것은 웃음이었다.","다음으로 앨리스는 나무 아래에서 이상한 다과회를 발견했다. 모자 장수와 3월 토끼가 긴 식탁에 앉아 있었다. “자리 없어! 자리 없어!” 그들이 소리쳤다. “자리 많은데!” 앨리스는 이렇게 말하고 앉았다. “너 머리 좀 잘라야겠다.” 모자 장수가 말했다. “그건 정말 무례해.” 앨리스가 말했다. 모자 장수는 대답하지 않았다. 대신 수수께끼를 냈다. “까마귀와 책상이 닮은 점은?” 앨리스는 열심히 생각했지만, 나중에 답을 물어보았다. “나도 몰라.” 모자 장수가 말했다. 그들의 다과회는 언제나 6시라서 언제나 차 마실 시간이었다. “내 인생에서 제일 바보 같은 다과회야!” 앨리스는 이렇게 말하고 떠났다.","이상한 모험을 더 겪은 뒤, 앨리스는 하트 여왕이 게임을 하고 있는 정원에 왔다. 여왕은 항상 화가 나 있었다. “저자의 목을 베어라!” 여왕은 모두에게 소리쳤다. 여왕이 앨리스에게 소리쳤을 때, 앨리스는 무섭지 않았다. 앨리스는 다시 원래 크기로 돌아와 있었다. “당신들은 카드 한 벌일 뿐이야!” 앨리스가 말했다. 그 순간 카드들이 모두 공중으로 날아올랐다가 앨리스 위로 쏟아졌다.","앨리스는 비명을 질렀다. 그리고 눈을 떴다. 앨리스는 언니 무릎에 머리를 베고 강가에 누워 있었다. 나뭇잎 몇 장이 얼굴에 떨어지고 있었다. “일어나, 앨리스!” 언니가 말했다. “정말 오래 잤구나!” “아, 너무 이상한 꿈을 꿨어!” 앨리스가 말했다."],"gloss":[["without thinking","아무 생각 없이"],["ceiling","천장"],["That depends on ~","그건 ~에 달려 있다"],["plenty of","많은"],["raven","까마귀"],["a pack of cards","카드 한 벌"],["lap","무릎"]],"keySentences":[["“I must be near the center of the earth.”","must be = ~임에 틀림없다 (강한 추측)"],["“Curiouser and curiouser!”","원래 more and more curious 가 맞지만, 너무 놀란 앨리스가 틀린 영어를 써요. 작가의 유머예요."],["“You must be, or you wouldn’t be here.”","or = 그렇지 않으면 / wouldn’t be = ~하지 않을 것이다 (가정)"],["You’re nothing but a pack of cards!","nothing but ~ = 단지 ~일 뿐"]],"tf":[["Alice’s sister was reading a book with pictures.","F — 그림이 없는 책이었다."],["The White Rabbit had a watch.","T"],["The Cheshire Cat said only the Hatter was mad.","F — 모두 미쳤다고 했다."],["The whole adventure was a dream.","T"]],"questions":[["Why did Alice follow the White Rabbit?","Because she had never seen a rabbit with a pocket or a watch. She was curious."],["What happened when she drank from the bottle?","She became very small, only 25 centimeters tall."],["What was strange about the tea party?","It was always six o’clock, so it was always tea time. The riddle had no answer."],["Why do you think adults also enjoy this book?","(예) It is funny and full of clever word games and imagination."]],"listening":{"shadow":"5","dictation":[["She had never ___ a rabbit with a pocket.","seen"],["I ___ be near the center of the earth.","must"],["That ___ on where you want to go.","depends"],["We’re all ___ here.","mad"],["What a long ___ you’ve had!","sleep"]]},"grammar":{"title":"추측의 조동사 must / might / can’t","explain":["must be: ~임에 틀림없다 (약 90% 확신) → You must be tired.","might / may / could be: ~일지도 모른다 (약 50%) → It might rain later.","can’t be: ~일 리가 없다 → That can’t be true!","과거의 일 추측: must have p.p. (~였음에 틀림없다), might have p.p. (~였을지도 모른다) → It must have been a dream."],"examples":[["She’s yawning. She must be sleepy.","하품을 하네. 졸린 게 틀림없어."],["He isn’t answering. He might be busy.","전화를 안 받네. 바쁜가 봐."],["That can’t be Tom. He’s in Japan.","저 사람이 톰일 리 없어. 그는 일본에 있어."],["The road is wet. It must have rained.","길이 젖어 있네. 비가 왔던 게 틀림없어."]],"exercise":[["그건 꿈이었던 게 틀림없어.","It must have been a dream."],["고양이가 말을 할 리가 없어.","A cat can’t talk."],["Alice looks pale. She ___ be sick. (~일지도)","might (may)"]]},"expressions":[["run after ~","~을 쫓아가다","The dog ran after the ball."],["That depends on ~","그건 ~에 달려 있다","“Are you coming?” “That depends on the weather.”"],["have no idea","전혀 모르다","I have no idea where he is."],["nothing but ~","단지 ~일 뿐","He eats nothing but bread."]],"speaking":{"retell":["bored by the river – White Rabbit with a watch","fell down the rabbit hole","DRINK ME – small / EAT ME – tall","Cheshire Cat – “We’re all mad here.”","tea party – riddle with no answer","Queen of Hearts – pack of cards","woke up – a dream"],"discuss":["The Cat says, “If you don’t know where you want to go, any road is fine.” What does this mean for our lives?","Which character would you like to have tea with? Why?","Do adults lose their curiosity? How can we keep it?"],"model":["What does the Cat’s answer mean for our lives?","I think it means we need a goal first. Many people ask, “Should I change jobs or study something new?” But the right answer depends on where they want to go in life. If you don’t have a goal, every road looks the same. So the first question isn’t “Which way?” but “Where?”"],"roleplay":"A: 길을 잃은 앨리스 / B: 체셔 고양이. 앨리스가 길을 묻고, 고양이는 엉뚱하지만 생각할 거리가 있는 대답을 해 보세요."},"writing":{"task":"“나의 이상한 나라” — 꿈속 이상한 장소에 간 이야기 (must / might / can’t 를 3번 이상, 130~150단어)","hints":["어떻게 그곳에 갔는지","이상한 규칙이 있는 장소, 이상한 인물 한 명과의 대화","마지막에 잠에서 깨기"],"model":["One rainy Sunday, I was lying on the sofa with my phone. Suddenly, the screen began to shine, and I was pulled inside it!","I landed in a strange city. The buildings were giant smiling faces, and the trees had heart-shaped leaves. “This must be a dream,” I thought.","A tall man in a hat came to me. “You’re late for the party!” he said. He took me to a long table. Hundreds of people were looking at their phones. They were laughing, but nobody was talking. “They might look happy,” I thought, “but they can’t be really enjoying the party.” When I put my phone down and said hello, everyone shouted, “She looked up! She must be mad!”","Then I heard my mother’s voice: “Wake up! Dinner’s ready.” I was on the sofa again. I left my phone there and went to dinner."]},"quote":["“Who in the world am I? Ah, that’s the great puzzle!” (Lewis Carroll)","“세상에, 나는 누구지? 아, 그게 바로 큰 수수께끼야!”"]},{"week":10,"title":"오즈의 마법사","en":"The Wonderful Wizard of Oz","author":"L. Frank Baum (L. 프랭크 바움)","year":"1900","genre":"판타지 소설 (Fantasy)","intro":"미국 작가 바움의 판타지 소설입니다. 회오리바람에 날려 오즈의 나라에 간 도로시가 뇌가 없는 허수아비, 심장이 없는 양철 나무꾼, 용기 없는 사자와 함께 마법사를 찾아갑니다. “찾던 것은 이미 우리 안에 있다”는 메시지를 전해요.","characters":[["Dorothy (도로시)","캔자스에서 온 소녀"],["Toto (토토)","도로시의 작은 검은 개"],["The Scarecrow (허수아비)","뇌를 원하는 허수아비"],["The Tin Man (양철 나무꾼)","심장을 원하는 양철 사람"],["The Lion (사자)","용기를 원하는 겁쟁이 사자"],["The Wizard (마법사)","사실은 평범한 남자"]],"warmup":[["If you could ask a wizard for one thing, what would you ask for?","마법사에게 하나를 부탁할 수 있다면?"],["What does “home” mean to you?","당신에게 “집”은 어떤 의미인가요?"]],"vocab":[["wind","바람","A strong wind came."],["land","땅; 착륙하다","The house landed in Oz."],["witch","마녀","The house fell on a bad witch."],["shoes","신발","She gave Dorothy silver shoes."],["road","길","Follow the yellow brick road."],["scarecrow","허수아비","The Scarecrow wanted a brain."],["brain","뇌, 머리","If I had a brain, I could think."],["tin","양철","The Tin Man was made of tin."],["heart","심장, 마음","He wanted a heart."],["lion","사자","The Lion was afraid of everything."],["brave","용감한","He wanted to be brave."],["courage","용기","True courage is facing danger."],["wizard","마법사","They went to see the Wizard."],["melt","녹다","The witch melted away."],["ordinary","평범한","He was an ordinary man."]],"story":["Dorothy lived on a farm in Kansas with her Uncle Henry, her Aunt Em, and her little black dog, Toto. Everything around the farm was gray — the grass, the sky, and even Uncle Henry and Aunt Em, who never laughed. Only Toto made Dorothy laugh.","One day, a terrible wind came. The house shook, rose into the air, and flew for hours. When it finally landed, Dorothy opened the door. She saw beautiful flowers, tall trees, and a shining river. She was in the Land of Oz! The house had landed on a bad witch and killed her. A good witch gave Dorothy the bad witch’s silver shoes. “If you want to go home,” she said, “go to the Emerald City and ask the great Wizard of Oz. Just follow the yellow brick road.”","On the way, Dorothy met a Scarecrow in a field. “If I had a brain,” he said sadly, “I could think like a real person.” “Come with me,” said Dorothy. “The Wizard might give you a brain.” Next, in the forest, they found a man made of tin. He couldn’t move because rain had made him rusty. Dorothy put oil on his arms and legs, and he could move again. “I want to ask the Wizard for a heart,” said the Tin Man. “Without a heart, I can’t love anyone.”","Suddenly, a big Lion jumped out and tried to bite Toto. Dorothy hit him on the nose. “Shame on you! You’re so big, and Toto is so small!” The Lion began to cry. “I know,” he said. “I’m a coward. If I were brave, I would be happy.” So the Lion joined them, too.","The journey was long and dangerous. But each time, the friends helped one another. The Scarecrow had clever ideas. The Tin Man cried when he stepped on a little bug. And the Lion, though he shook with fear, always fought to protect his friends.","At last, they reached the Emerald City, where everything was green. The Wizard said, “First, you must kill the Wicked Witch of the West.” The witch caught them, and she tried to steal Dorothy’s silver shoe. Dorothy was so angry that she threw a bucket of water on her. To everyone’s surprise, the witch melted away!","When they went back to the Wizard, Toto knocked over a screen in the corner. Behind it stood a little old man. “I’m not a great wizard,” he said. “I’m just an ordinary man from Nebraska. I came here in a balloon many years ago.” The friends were shocked.","But the Wizard smiled. “You don’t need my help,” he said. To the Scarecrow: “Who had all the clever ideas on the road? You have a good brain already.” To the Lion: “True courage is facing danger when you are afraid. You did that many times.” To the Tin Man: “You cried for a little bug. You have a kind heart.” Then he gave them a few gifts to make them feel confident, and all three were happy.","Then a good witch told Dorothy a secret. “Your silver shoes can take you anywhere. Just click your heels together three times.” Dorothy hugged her friends goodbye, picked up Toto, and clicked her heels three times. “Take me home to Aunt Em!” In a moment, she was rolling on the grass in Kansas. Aunt Em ran to her and held her tight. “Where have you been?” she cried. “In the Land of Oz,” said Dorothy. “And Aunt Em, I’m so glad to be home again!”"],"ko":["도로시는 캔자스의 농장에서 헨리 삼촌, 엠 이모, 그리고 작은 검은 개 토토와 함께 살았다. 농장 주변은 모든 것이 회색이었다. 풀도, 하늘도, 심지어 한 번도 웃지 않는 헨리 삼촌과 엠 이모까지도. 도로시를 웃게 하는 것은 토토뿐이었다.","어느 날, 무시무시한 바람이 불어왔다. 집이 흔들리더니 공중으로 떠올라 몇 시간 동안 날아갔다. 마침내 집이 땅에 내려앉자 도로시는 문을 열었다. 아름다운 꽃, 키 큰 나무, 반짝이는 강이 보였다. 오즈의 나라에 온 것이다! 집은 나쁜 마녀 위에 떨어져 마녀를 죽였다. 착한 마녀가 도로시에게 나쁜 마녀의 은 구두를 주었다. “집에 가고 싶다면 에메랄드 시로 가서 위대한 오즈의 마법사에게 부탁하렴. 노란 벽돌 길만 따라가면 된단다.”","가는 길에 도로시는 들판에서 허수아비를 만났다. “내게 뇌가 있다면,” 허수아비가 슬프게 말했다. “진짜 사람처럼 생각할 수 있을 텐데.” “나랑 같이 가자.” 도로시가 말했다. “마법사가 뇌를 줄지도 몰라.” 다음으로 숲속에서 그들은 양철로 된 남자를 발견했다. 비 때문에 녹이 슬어 움직일 수 없었다. 도로시가 팔다리에 기름을 발라 주자 그는 다시 움직일 수 있었다. “마법사에게 심장을 달라고 하고 싶어.” 양철 나무꾼이 말했다. “심장이 없으면 아무도 사랑할 수 없거든.”","갑자기 커다란 사자가 뛰어나와 토토를 물려고 했다. 도로시는 사자의 코를 때렸다. “부끄러운 줄 알아! 넌 이렇게 크고 토토는 이렇게 작은데!” 사자는 울기 시작했다. “나도 알아.” 사자가 말했다. “나는 겁쟁이야. 내가 용감하다면 행복할 텐데.” 그래서 사자도 함께하게 되었다.","여행은 길고 위험했다. 하지만 매번 친구들은 서로 도왔다. 허수아비는 똑똑한 아이디어를 냈다. 양철 나무꾼은 작은 벌레를 밟았을 때 울었다. 그리고 사자는 두려움에 떨면서도 언제나 친구들을 지키기 위해 싸웠다.","마침내 그들은 모든 것이 초록색인 에메랄드 시에 도착했다. 마법사가 말했다. “먼저 서쪽의 사악한 마녀를 없애야 한다.” 마녀는 그들을 붙잡았고, 도로시의 은 구두를 훔치려 했다. 도로시는 너무 화가 나서 마녀에게 양동이의 물을 끼얹었다. 모두가 놀랍게도 마녀가 녹아 없어졌다!","그들이 마법사에게 돌아갔을 때, 토토가 구석에 있던 칸막이를 넘어뜨렸다. 그 뒤에는 작은 노인이 서 있었다. “나는 위대한 마법사가 아니란다.” 그가 말했다. “네브래스카에서 온 평범한 남자일 뿐이야. 오래전에 기구를 타고 여기 왔지.” 친구들은 충격을 받았다.","하지만 마법사는 미소 지었다. “너희는 내 도움이 필요 없단다.” 그가 말했다. 허수아비에게: “길에서 똑똑한 아이디어를 낸 게 누구였지? 넌 이미 좋은 머리를 가지고 있어.” 사자에게: “진정한 용기란 두려울 때 위험에 맞서는 거야. 넌 여러 번 그렇게 했지.” 양철 나무꾼에게: “넌 작은 벌레 때문에 울었어. 넌 따뜻한 마음을 가지고 있어.” 그리고 그는 자신감을 갖도록 작은 선물을 몇 가지 주었고, 셋은 모두 행복해했다.","그때 착한 마녀가 도로시에게 비밀을 알려 주었다. “네 은 구두는 너를 어디든 데려다줄 수 있단다. 뒤꿈치를 세 번 부딪치기만 하면 돼.” 도로시는 친구들과 작별 포옹을 하고, 토토를 안고, 뒤꿈치를 세 번 부딪쳤다. “엠 이모가 있는 집으로 데려다줘!” 순식간에 도로시는 캔자스의 풀밭 위를 구르고 있었다. 엠 이모가 달려와 도로시를 꼭 안았다. “어디 있었니?” 이모가 외쳤다. “오즈의 나라에요.” 도로시가 말했다. “그리고 엠 이모, 다시 집에 와서 정말 기뻐요!”"],"gloss":[["shake – shook","흔들리다"],["rusty","녹슨"],["Shame on you!","부끄러운 줄 알아!"],["coward","겁쟁이"],["wicked","사악한"],["bucket","양동이"],["knock over","넘어뜨리다"],["heel","뒤꿈치"]],"keySentences":[["If I had a brain, I could think like a real person.","가정법 과거: If + 과거형, could + 동사원형 → 지금 사실이 아닌 상상"],["If I were brave, I would be happy.","가정법에서 be동사는 주어와 상관없이 were 를 써요"],["True courage is facing danger when you are afraid.","동명사 facing 이 보어: “진정한 용기란 ~하는 것이다”"],["To everyone’s surprise, the witch melted away!","To one’s surprise (4주차 복습) → 모두가 놀랍게도"]],"tf":[["Dorothy’s farm in Kansas was colorful.","F — 모든 것이 회색이었다."],["The Tin Man couldn’t move because he was rusty.","T"],["The Wizard was really a great wizard.","F — 평범한 남자였다."],["Dorothy went home with her silver shoes.","T"]],"questions":[["What did each friend want?","Scarecrow: a brain / Tin Man: a heart / Lion: courage / Dorothy: to go home"],["How did Dorothy kill the Wicked Witch of the West?","She threw a bucket of water on her, and the witch melted."],["How did the Wizard show that they already had what they wanted?","The Scarecrow had clever ideas, the Lion faced danger, and the Tin Man cried for a bug."],["What is the main message of the story?","(예) What we want is often already inside us. / There’s no place like home."]],"listening":{"shadow":"8","dictation":[["“If I had a brain,” he said sadly, “I ___ think like a real person.”","could"],["If I ___ brave, I would be happy.","were"],["But each time, the friends helped one ___.","another"],["I’m just an ___ man from Nebraska.","ordinary"],["True courage is ___ danger when you are afraid.","facing"]]},"grammar":{"title":"가정법 과거 — If + 과거형, would / could + 동사원형","explain":["지금 사실과 반대되는 상상을 말할 때 써요. If I had a brain, I could think. (실제로는 뇌가 없음)","be동사는 주로 were → If I were rich, I would travel.","would = ~할 텐데 / could = ~할 수 있을 텐데","조언할 때: If I were you, I would ~ (내가 너라면 ~할 거야)"],"examples":[["If I had a heart, I could love.","심장이 있다면 사랑할 수 있을 텐데."],["If I were you, I would ask the Wizard.","내가 너라면 마법사에게 물어볼 거야."],["If I lived near the sea, I would swim every day.","바닷가에 산다면 매일 수영할 텐데."],["What would you do if you met a lion?","사자를 만나면 어떻게 할 거예요?"]],"exercise":[["내가 마법을 쓸 수 있다면 세계 여행을 할 텐데.","If I could use magic, I would travel around the world."],["If he ___ (be) braver, he wouldn’t cry.","were"],["If I ___ (have) more time, I ___ (read) more books.","had / would read"]]},"expressions":[["on the way","가는 길에","I bought coffee on the way."],["one another","서로","The friends helped one another."],["in a moment","순식간에, 곧","I’ll be back in a moment."],["There’s no place like home.","집만 한 곳은 없다","After the long trip, I knew there’s no place like home."]],"speaking":{"retell":["gray Kansas – terrible wind – Land of Oz","silver shoes – yellow brick road","Scarecrow (brain), Tin Man (heart), Lion (courage)","helped one another","Wicked Witch – water – melted","Wizard – an ordinary man – “You already have it.”","clicked her heels – home"],"discuss":["Which is most important to you: a brain, a heart, courage, or home?","The Wizard tricked everyone, but he still helped them. Is that okay?","Talk about a time when you found you were braver or smarter than you thought."],"model":["Which is most important to you?","For me, it’s courage. I think I have a good brain and a warm heart, but I often miss chances because I’m afraid. For example, I wanted to study abroad when I was young, but I was scared. If I were braver, I would try more new things. Learning English is one of my brave steps!"],"roleplay":"A: 칸막이 뒤에서 들킨 마법사 / B: 화가 난 허수아비 또는 사자. 마법사는 사과하고 진짜 “선물”이 무엇인지 설명해 보세요."},"writing":{"task":"“If I Met the Wizard” — 마법사에게 무엇을 부탁할지 쓰기 (가정법 과거 3번 이상, 130~150단어)","hints":["If I met the Wizard, I would ask for ~ because ~.","그것이 있으면 삶이 어떻게 달라질지","마법사의 대답: 이미 가지고 있는 이유"],"model":["If I met the Wizard of Oz, I would ask him for confidence. I know a lot of English words, but when I speak in front of people, my mind goes blank. If I had more confidence, I could speak freely at work. I could also make friends from other countries.","Maybe the Wizard would smile and say, “You don’t need my magic. Remember last month? A tourist was lost at the subway station, and you helped her in English. You were nervous, but you did it. That was confidence.”","I think he would be right. We often wait for someone to give us what we need, but we are usually stronger than we think."]},"quote":["“There is no place like home.” (L. Frank Baum)","집 같은 곳은 어디에도 없다."]},{"week":11,"title":"피터 팬","en":"Peter Pan","author":"J. M. Barrie (J. M. 배리)","year":"1911","genre":"판타지 소설 (Fantasy)","intro":"스코틀랜드 작가 배리의 작품으로, 어른이 되지 않는 소년 피터 팬과 웬디 남매가 네버랜드에서 모험을 하는 이야기입니다. 신나는 모험 이야기이면서 “어른이 된다는 것”에 대해 생각하게 해요.","characters":[["Peter Pan (피터 팬)","어른이 되기를 거부하는 날아다니는 소년"],["Wendy (웬디)","동생들을 돌보는 첫째 딸"],["Tinker Bell (팅커벨)","질투 많은 작은 요정"],["Captain Hook (후크 선장)","악어에게 손을 잃은 해적 선장"],["The Lost Boys (길 잃은 소년들)","네버랜드에 사는 소년들"]],"warmup":[["Would you like to stay a child forever? Why or why not?","영원히 아이로 남고 싶나요?"],["What is the best thing about being an adult?","어른이 되어서 가장 좋은 점은?"]],"vocab":[["grow up","어른이 되다","I don’t want to grow up."],["window","창문","He flew in through the window."],["shadow","그림자","Peter lost his shadow."],["sew","꿰매다","Wendy sewed it back on."],["fly","날다 (flew – flown)","They flew to Neverland."],["fairy dust","요정 가루","With fairy dust, they could fly."],["island","섬","Neverland is a magic island."],["pirate","해적","Captain Hook was a pirate."],["hook","갈고리","He had a hook instead of a hand."],["crocodile","악어","A crocodile followed him."],["clock","시계","The crocodile swallowed a clock."],["ship","배","They were taken to the pirate ship."],["tie up","묶다","The boys were tied up."],["fight","싸움; 싸우다 (fought)","Peter fought Captain Hook."],["forget","잊다 (forgot)","Peter often forgot."]],"story":["All children, except one, grow up. That one is Peter Pan.","The Darling family lived in London. Wendy, the oldest child, had two little brothers, John and Michael. Their nurse was a big dog named Nana. One night, when their parents were out, a strange boy flew in through the window. He was wearing clothes made of leaves. He was looking for his shadow. Nana had caught it in the window a week before.","Wendy woke up. The boy had found his shadow, but he couldn’t put it back on. He was sitting on the floor, crying. “Why are you crying?” Wendy asked kindly. “My name is Peter Pan, and my shadow won’t stick,” he said. So Wendy took out a needle and sewed the shadow back onto his feet. Peter was very happy.","Peter told Wendy that he lived in Neverland with the Lost Boys. “I ran away the day I was born,” he said, “because I heard my parents talking about my future as a man. I never want to grow up. I want to be a little boy and have fun forever.” He needed a mother to tell stories to the Lost Boys, and Wendy loved telling stories. With a little fairy dust from Tinker Bell, Wendy, John, and Michael flew out of the window with Peter. “Second star to the right,” said Peter, “and straight on till morning!”","Neverland was full of adventures. There were mermaids in the lagoon, wild animals in the forest, and, of course, pirates. The worst pirate was Captain Hook. In a fight, Peter had cut off Hook’s right hand and thrown it to a crocodile. The crocodile liked the taste so much that it followed Hook everywhere, hoping to eat the rest of him. Luckily for Hook, the crocodile had also swallowed a clock, so he could always hear it coming: tick, tock, tick, tock.","Wendy lived with the Lost Boys in a house under the ground. She cooked for them and told them stories every night. But as time went by, John and Michael started to forget their real home. Wendy decided that they had to go back to London.","On the night they planned to leave, Captain Hook caught Wendy and all the boys and took them to his ship. The boys were tied up, and Hook ordered them to walk the plank into the sea. Just then, they heard a sound: tick, tock, tick, tock. Hearing it, Hook fell to his knees, shaking with fear. But it wasn’t the crocodile. It was Peter, copying the sound of the clock! Peter flew onto the ship, and a great fight began. In the end, Hook fell into the sea, where the crocodile was waiting with its mouth wide open.","Wendy, her brothers, and all the Lost Boys flew back to London. The window was still open, and their mother was sitting next to it, waiting. When she saw her children, she hugged them for a long, long time. The Darlings adopted all the Lost Boys, too.","“Peter, stay with us,” said Mrs. Darling. “Will you send me to school?” he asked. “Yes.” “And then to an office? And soon I will be a man?” “Yes, very soon.” “No!” said Peter. “Nobody will make me a man!” So he flew back to Neverland alone. He promised to visit Wendy every spring, but he often forgot. Wendy grew up, and years later she had a daughter named Jane. One night, Peter came back and took Jane to Neverland. And so it will go on, as long as children are happy and innocent."],"ko":["모든 아이는 자란다. 단 한 명만 빼고. 그 한 명이 바로 피터 팬이다.","달링 가족은 런던에 살았다. 첫째 웬디에게는 존과 마이클이라는 남동생 둘이 있었다. 아이들을 돌보는 유모는 나나라는 큰 개였다. 어느 날 밤, 부모님이 외출한 사이에 이상한 소년이 창문으로 날아 들어왔다. 소년은 나뭇잎으로 만든 옷을 입고 있었다. 소년은 자기 그림자를 찾고 있었다. 일주일 전에 나나가 창문에서 그림자를 붙잡았던 것이다.","웬디가 잠에서 깼다. 소년은 그림자를 찾았지만 다시 붙일 수가 없었다. 소년은 바닥에 앉아 울고 있었다. “왜 울고 있니?” 웬디가 다정하게 물었다. “내 이름은 피터 팬인데, 그림자가 안 붙어.” 소년이 말했다. 그래서 웬디는 바늘을 꺼내 그림자를 소년의 발에 꿰매 주었다. 피터는 무척 기뻐했다.","피터는 웬디에게 자신이 네버랜드에서 길 잃은 소년들과 산다고 말했다. “나는 태어난 날 도망쳤어.” 피터가 말했다. “부모님이 내가 어른이 되면 어떻게 될지 이야기하는 걸 들었거든. 난 절대 어른이 되고 싶지 않아. 영원히 어린 소년으로 재미있게 살고 싶어.” 피터에게는 길 잃은 소년들에게 이야기를 들려줄 엄마가 필요했고, 웬디는 이야기하는 것을 좋아했다. 팅커벨의 요정 가루를 조금 묻히자, 웬디와 존과 마이클은 피터와 함께 창밖으로 날아갔다. “오른쪽 두 번째 별로,” 피터가 말했다. “그리고 아침까지 쭉!”","네버랜드는 모험으로 가득했다. 석호에는 인어가, 숲에는 야생동물이, 그리고 물론 해적도 있었다. 가장 나쁜 해적은 후크 선장이었다. 한 싸움에서 피터는 후크의 오른손을 잘라 악어에게 던져 버렸다. 악어는 그 맛이 너무 좋아서 나머지도 먹으려고 후크를 어디든 따라다녔다. 다행히 악어가 시계도 삼켰기 때문에, 후크는 언제나 악어가 오는 소리를 들을 수 있었다. 째깍, 째깍, 째깍, 째깍.","웬디는 길 잃은 소년들과 함께 땅속 집에서 살았다. 웬디는 그들을 위해 요리하고 매일 밤 이야기를 들려주었다. 하지만 시간이 흐르면서 존과 마이클은 진짜 집을 잊기 시작했다. 웬디는 런던으로 돌아가야 한다고 결심했다.","떠나기로 한 날 밤, 후크 선장이 웬디와 소년들을 모두 붙잡아 자기 배로 데려갔다. 소년들은 묶였고, 후크는 그들에게 널빤지 위를 걸어 바다로 떨어지라고 명령했다. 바로 그때 소리가 들렸다. 째깍, 째깍, 째깍, 째깍. 그 소리를 듣자 후크는 두려움에 떨며 무릎을 꿇었다. 하지만 그건 악어가 아니었다. 시계 소리를 흉내 낸 피터였다! 피터가 배 위로 날아왔고, 큰 싸움이 벌어졌다. 결국 후크는 바다에 빠졌고, 그곳에서는 악어가 입을 크게 벌린 채 기다리고 있었다.","웬디와 동생들, 그리고 길 잃은 소년들은 모두 런던으로 날아 돌아왔다. 창문은 여전히 열려 있었고, 엄마는 그 옆에 앉아 기다리고 있었다. 아이들을 본 엄마는 아주아주 오랫동안 아이들을 안아 주었다. 달링 가족은 길 잃은 소년들도 모두 입양했다.","“피터, 우리와 함께 살자.” 달링 부인이 말했다. “저를 학교에 보낼 건가요?” 피터가 물었다. “그래.” “그다음엔 회사에요? 그리고 곧 어른이 되나요?” “그래, 아주 곧.” “싫어요!” 피터가 말했다. “아무도 저를 어른으로 만들 수 없어요!” 그래서 피터는 혼자 네버랜드로 날아갔다. 피터는 매년 봄에 웬디를 찾아오겠다고 약속했지만 자주 잊어버렸다. 웬디는 어른이 되었고, 여러 해 뒤 제인이라는 딸을 낳았다. 어느 날 밤, 피터가 다시 와서 제인을 네버랜드로 데려갔다. 그리고 아이들이 행복하고 순수한 한, 이 일은 계속될 것이다."],"gloss":[["except","~을 제외하고"],["needle","바늘"],["stick","붙다"],["mermaid","인어"],["walk the plank","(해적의 처형) 널빤지를 걸어 바다로 떨어지다"],["adopt","입양하다"],["innocent","순수한"]],"keySentences":[["All children, except one, grow up.","소설의 유명한 첫 문장. except = ~을 제외하고"],["…it followed Hook everywhere, hoping to eat the rest of him.","분사구문 hoping ~ = and it hoped ~ (~하기를 바라며)"],["Hearing it, Hook fell to his knees, shaking with fear.","분사구문 두 개: Hearing it = When he heard it / shaking = and he was shaking"],["And so it will go on, as long as children are happy and innocent.","as long as ~ = ~하는 한"]],"tf":[["Peter Pan was looking for his shadow.","T"],["Peter put his shadow back on with soap.","F — 웬디가 꿰매 주었다."],["Captain Hook was afraid of the ticking sound.","T"],["Peter stayed in London and went to school.","F — 네버랜드로 돌아갔다."]],"questions":[["Why did Peter run away when he was born?","He heard his parents talking about his future as a man. He didn’t want to grow up."],["Why did Peter need Wendy?","He needed a mother to tell stories to the Lost Boys."],["Why was the crocodile following Hook?","It had eaten Hook’s hand and wanted to eat the rest of him."],["Is the ending happy or sad? Why?","(예) Both. The children go home, but Peter is alone and forgets Wendy."]],"listening":{"shadow":"7","dictation":[["All children, ___ one, grow up.","except"],["“My name is Peter Pan, and my shadow won’t ___,” he said.","stick"],["I never want to grow ___.","up"],["___ it, Hook fell to his knees.","Hearing"],["Nobody will ___ me a man!","make"]]},"grammar":{"title":"분사구문 (기초) — ~ing 로 문장을 짧고 생생하게","explain":["두 동작이 동시에 일어날 때, 두 번째 동작을 ~ing 로 붙일 수 있어요. → He walked home. He was singing. → He walked home, singing.","“~할 때, ~해서”를 짧게: When he heard the clock, Hook fell. → Hearing the clock, Hook fell.","주로 글(소설)에서 많이 쓰고, 말할 때는 when / because 를 더 많이 써요.","문장 앞이나 뒤에 콤마(,)와 함께 써요."],"examples":[["Smiling, Wendy opened the window.","웃으면서 웬디는 창문을 열었다."],["Peter flew away, laughing loudly.","피터는 크게 웃으며 날아갔다."],["Feeling tired, I went to bed early.","피곤해서 나는 일찍 잤다."],["She sat by the window, waiting for her children.","그녀는 아이들을 기다리며 창가에 앉아 있었다."]],"exercise":[["When she saw her children, Mrs. Darling cried. (분사구문으로)","Seeing her children, Mrs. Darling cried."],["She walked home. She was singing a song. (한 문장으로)","She walked home, singing a song."],["Because I felt hungry, I ate a sandwich. (분사구문으로)","Feeling hungry, I ate a sandwich."]]},"expressions":[["run away","도망치다","The cat ran away from the dog."],["as time went by","시간이 흐르면서","As time went by, we became close friends."],["fall to one’s knees","무릎을 꿇다","He fell to his knees and cried."],["as long as ~","~하는 한","You can stay as long as you like."]],"speaking":{"retell":["Darling family – Nana – the nursery","Peter – lost shadow – Wendy sewed it","fairy dust – flew to Neverland","Lost Boys – Wendy as mother","Captain Hook – crocodile – clock","caught – walk the plank – Peter saved them","home – Peter didn’t want to grow up"],"discuss":["Why doesn’t Peter want to grow up? Do you understand him?","What do we lose when we grow up? What do we get?","If you could visit Neverland for one day, what would you do?"],"model":["What do we lose and get when we grow up?","When we grow up, we lose some imagination. As a child, I could play with a stick for hours and believe it was a sword. Now I worry about work and money. But we also get a lot. We can make our own choices and take care of the people we love. So I think growing up is worth it."],"roleplay":"A: 피터 팬 / B: 어른이 된 웬디. 피터는 왜 약속을 지키지 않았냐고 서운해하고, 웬디는 어른이 되는 것의 좋은 점을 설명해 보세요."},"writing":{"task":"장면 다시 쓰기: 후크 선장 배 위의 싸움 장면 (분사구문 3번 이상, 130~150단어)","hints":["소리(tick-tock), 움직임, 감정 묘사","Hearing ~, / ~, shaking with fear / ~, laughing","대사 2개 이상"],"model":["The night was dark, and the pirate ship moved slowly on the black water. Tied up with ropes, the Lost Boys sat on the floor, shaking with fear. Wendy stood straight, trying not to cry.","“Walk the plank!” shouted Captain Hook, waving his iron hook. Then they heard a sound: tick, tock, tick, tock. Hearing it, Hook turned white. He fell to his knees, covering his ears. “The crocodile is here!”","But it was Peter Pan! Flying over the ship, he landed on the floor. “It’s me, Hook!” he laughed. Cutting the ropes one by one, he set the boys free. In the end, Hook stood alone at the edge of the ship. Looking down, he saw the crocodile waiting for him."]},"quote":["“All children, except one, grow up.” (J. M. Barrie)","모든 아이는 자란다. 단 한 명만 빼고."]},{"week":12,"title":"보물섬","en":"Treasure Island","author":"Robert Louis Stevenson (로버트 루이스 스티븐슨)","year":"1883","genre":"모험 소설 (Adventure Novel)","intro":"스코틀랜드 작가 스티븐슨의 해적 모험 소설입니다. 여관집 소년 짐 호킨스가 보물 지도를 손에 넣고 보물섬으로 떠나는데, 배의 요리사인 외다리 실버가 사실은 해적 두목이었어요. 앵무새, 보물 지도, 외다리 해적 같은 “해적 이미지”를 만든 작품입니다.","characters":[["Jim Hawkins (짐 호킨스)","이야기를 들려주는 용감한 소년"],["Billy Bones (빌리 본즈)","여관에 머물던 늙은 선원"],["Long John Silver (롱 존 실버)","친절한 척하는 외다리 요리사이자 해적 두목"],["Dr. Livesey (리브시 박사)","짐을 돕는 의사"],["Ben Gunn (벤 건)","섬에 3년 동안 혼자 남겨졌던 사람"]],"warmup":[["What do you think of when you hear the word “pirate”?","“해적” 하면 무엇이 떠오르나요?"],["Have you ever trusted someone and then been disappointed?","믿었던 사람에게 실망한 적이 있나요?"]],"vocab":[["inn","여관","Jim’s family had an inn."],["sailor","선원","An old sailor came to stay."],["scar","흉터","He had a scar on his face."],["map","지도","Jim found a treasure map."],["treasure","보물","The treasure was on an island."],["island","섬","They sailed to the island."],["cook","요리사","Silver was the ship’s cook."],["parrot","앵무새","His parrot talked a lot."],["barrel","통","Jim hid in an apple barrel."],["plan","계획(하다)","The pirates planned to kill them."],["hide","숨다 (hid – hidden)","They hid in an old fort."],["dig","파다 (dug – dug)","They dug for the treasure."],["empty","텅 빈","The hole was empty."],["cave","동굴","The gold was in a cave."],["escape","탈출하다","Silver escaped with some gold."]],"story":["My name is Jim Hawkins, and I want to tell you the story of Treasure Island. It begins at my parents’ inn by the sea in England.","One day, an old sailor with a scar on his face came to stay. His name was Billy Bones. He sat by the fire, drank a lot of rum, and sang a strange song: “Fifteen men on a dead man’s chest — Yo-ho-ho, and a bottle of rum!” He paid me a silver coin every month to watch for “a sailor with one leg.” I dreamed about that one-legged man every night.","That winter, Billy Bones died suddenly. Before other pirates came to the inn, my mother and I opened his sea chest. Under some old clothes, I found a packet of papers. Later, my friends Dr. Livesey and Squire Trelawney opened it. Inside was a map of an island with three red crosses. Next to one cross, someone had written: “Most of the treasure is here.” It was the treasure of Captain Flint, the most terrible pirate in history!","The Squire bought a ship and hired a captain. In the port of Bristol, he met a tall, friendly man with one leg. His name was Long John Silver. Silver knew many sailors, so he helped find a crew, and he became the ship’s cook. I liked him right away. He was clever and kind to me, and he had a parrot that shouted, “Pieces of eight! Pieces of eight!” I never thought he could be the one-legged sailor that Billy Bones had been afraid of.","The trip went well until the night before we reached the island. I was hungry, so I climbed into a big apple barrel on the ship. While I was sitting inside, I heard Silver talking. “I sailed with Captain Flint,” he said. My heart stopped. Most of the crew had been Flint’s pirates! They were planning to kill us after they found the treasure. I was so scared that I could hardly breathe.","When I got out, I told the doctor, the Squire, and the captain everything. There were only a few of us and nineteen pirates, so we had to be smart. On the island, I ran into the forest alone. There I met a strange wild man named Ben Gunn. He had been left alone on the island three years before. “I’m rich,” he told me with a strange smile. I didn’t understand him then.","Soon the fighting began. Our group hid in an old wooden fort on the island, and the pirates attacked again and again. Later, the doctor did something strange: he gave Silver the treasure map. Now the pirates went treasure hunting and took me with them on a rope. But when they reached the red cross, they found only a big empty hole. The treasure was gone!","The angry pirates turned on Silver. Just then, shots came from the trees. The doctor, Ben Gunn, and my friends had been waiting there. Ben Gunn had found the treasure long before and moved it to his cave. That was why he had said, “I’m rich.” And that was why the doctor had given away the map — it was useless!","We put the gold on the ship and sailed home. Silver came with us, but one night at a port in South America, he escaped with a bag of gold. I was almost glad. We all got a share of the treasure, but I will never go back to that island. Even now, in my worst dreams, I can still hear Silver’s parrot shouting, “Pieces of eight! Pieces of eight!”"],"ko":["내 이름은 짐 호킨스다. 보물섬 이야기를 들려주려고 한다. 이야기는 영국 바닷가에 있는 우리 부모님의 여관에서 시작된다.","어느 날, 얼굴에 흉터가 있는 늙은 선원이 묵으러 왔다. 그의 이름은 빌리 본즈였다. 그는 난롯가에 앉아 럼주를 잔뜩 마시며 이상한 노래를 불렀다. “죽은 자의 궤짝 위에 열다섯 사내 — 요호호, 럼주 한 병!” 그는 “다리가 하나인 선원”을 지켜보라며 매달 내게 은화 한 닢을 주었다. 나는 매일 밤 그 외다리 남자 꿈을 꾸었다.","그해 겨울, 빌리 본즈가 갑자기 죽었다. 다른 해적들이 여관에 오기 전에, 어머니와 나는 그의 선원 궤짝을 열었다. 낡은 옷 아래에서 나는 서류 꾸러미를 발견했다. 나중에 내 친구 리브시 박사와 트렐로니 지주가 그것을 열었다. 안에는 빨간 X 표시가 세 개 있는 섬 지도가 들어 있었다. X 표시 하나 옆에는 누군가 “보물 대부분이 여기 있음”이라고 써 놓았다. 역사상 가장 무서운 해적, 플린트 선장의 보물이었다!","지주는 배를 사고 선장을 고용했다. 브리스틀 항구에서 그는 다리가 하나인 키 크고 친절한 남자를 만났다. 그의 이름은 롱 존 실버였다. 실버는 선원을 많이 알고 있어서 선원 모으는 것을 도왔고, 배의 요리사가 되었다. 나는 금세 그가 좋아졌다. 그는 똑똑하고 나에게 친절했으며, “에잇 피스 은화! 에잇 피스 은화!”라고 외치는 앵무새를 키웠다. 나는 그가 빌리 본즈가 두려워하던 그 외다리 선원일 수 있다고는 생각도 못 했다.","섬에 도착하기 전날 밤까지 여행은 순조로웠다. 나는 배가 고파서 배 위의 큰 사과 통 안으로 들어갔다. 통 안에 앉아 있는데 실버가 이야기하는 소리가 들렸다. “난 플린트 선장과 함께 항해했지.” 그가 말했다. 심장이 멎는 것 같았다. 선원 대부분이 플린트의 해적이었던 것이다! 그들은 보물을 찾은 뒤 우리를 죽일 계획을 세우고 있었다. 나는 너무 무서워서 숨도 제대로 쉴 수 없었다.","통에서 나오자 나는 박사와 지주와 선장에게 모든 것을 이야기했다. 우리는 몇 명뿐이었고 해적은 열아홉 명이었으므로, 우리는 머리를 써야 했다. 섬에서 나는 혼자 숲속으로 달려갔다. 그곳에서 벤 건이라는 이상한 야인을 만났다. 그는 3년 전에 섬에 혼자 남겨졌다고 했다. “난 부자야.” 그가 이상한 미소를 지으며 말했다. 그때는 무슨 말인지 몰랐다.","곧 싸움이 시작되었다. 우리 일행은 섬에 있는 낡은 나무 요새에 숨었고, 해적들은 몇 번이고 공격해 왔다. 나중에 박사는 이상한 행동을 했다. 실버에게 보물 지도를 준 것이다. 이제 해적들은 나를 밧줄에 묶어 끌고 보물을 찾으러 갔다. 하지만 빨간 X 표시에 도착했을 때, 그들이 발견한 것은 텅 빈 커다란 구덩이뿐이었다. 보물이 사라진 것이다!","화가 난 해적들이 실버에게 덤벼들었다. 바로 그때 나무 사이에서 총소리가 났다. 박사와 벤 건과 내 친구들이 거기서 기다리고 있었던 것이다. 벤 건은 오래전에 보물을 찾아 자기 동굴로 옮겨 두었다. 그래서 그가 “난 부자야”라고 말했던 것이다. 그리고 그래서 박사가 지도를 넘겨주었던 것이다. 지도는 쓸모가 없었으니까!","우리는 금을 배에 싣고 집으로 항해했다. 실버도 함께 갔지만, 남아메리카의 한 항구에서 어느 날 밤 금 한 자루를 가지고 달아났다. 나는 오히려 다행이라고 느꼈다. 우리는 모두 보물을 나눠 가졌지만, 나는 그 섬에 절대 다시 가지 않을 것이다. 지금도 가장 무서운 꿈속에서는 “에잇 피스 은화! 에잇 피스 은화!” 하고 외치는 실버의 앵무새 소리가 들린다."],"gloss":[["rum","럼주"],["sea chest","선원의 궤짝"],["squire","지주 (시골 신사)"],["crew","선원들"],["pieces of eight","옛 스페인 은화"],["fort","요새"],["turn on","~에게 덤벼들다"],["share","몫"]],"keySentences":[["I never thought he could be the one-legged sailor that Billy Bones had been afraid of.","관계대명사 that + 과거완료 had been: 빌리 본즈가 그전에 두려워하던"],["Most of the crew had been Flint’s pirates!","과거완료: 그 이전부터 이미 해적이었다는 반전"],["He had been left alone on the island three years before.","과거완료 수동태 had been + p.p.: 그보다 더 이전에 남겨졌다"],["Ben Gunn had found the treasure long before.","과거완료: 해적들이 도착하기 훨씬 전에 이미 찾아 두었다"]],"tf":[["Jim found the treasure map in Billy Bones’s sea chest.","T"],["Long John Silver was an honest cook.","F — 사실은 플린트 선장의 해적이었다."],["Jim heard the pirates’ plan from inside an apple barrel.","T"],["The pirates found the treasure at the red cross.","F — 구덩이는 텅 비어 있었다."]],"questions":[["Why did Billy Bones pay Jim every month?","To watch for a sailor with one leg."],["How did Jim learn Silver’s secret?","He was hiding in an apple barrel and heard Silver talking."],["Why did the doctor give Silver the map?","Because the map was useless. Ben Gunn had already moved the treasure."],["How would you describe Long John Silver?","(예) He is clever and friendly on the outside, but dangerous. He always protects himself."]],"listening":{"shadow":"5","dictation":[["One day, an old sailor with a ___ on his face came to stay.","scar"],["Most of the ___ had been Flint’s pirates!","crew"],["I was so scared that I could ___ breathe.","hardly"],["But when they reached the red cross, they found only a big ___ hole.","empty"],["Ben Gunn ___ found the treasure long before.","had"]]},"grammar":{"title":"과거완료 had + p.p. — “그보다 더 전에”","explain":["과거의 어떤 시점보다 더 먼저 일어난 일을 말할 때 써요.","When they reached the cross, the treasure had gone. (도착했을 때 이미 사라진 상태)","이야기에서 “사실은 이랬다”는 반전을 알려 줄 때 자주 써요. → Ben Gunn had found the treasure long before.","before / after 로 순서가 분명하면 과거형만 써도 괜찮아요. → After he died, we opened the chest."],"examples":[["When I got to the station, the train had already left.","역에 도착했을 때 기차는 이미 떠났다."],["I had never seen the sea before I was ten.","나는 열 살 전에는 바다를 본 적이 없었다."],["She realized she had left her phone at home.","그녀는 휴대폰을 집에 두고 왔다는 걸 깨달았다."],["They had eaten dinner when I arrived.","내가 도착했을 때 그들은 저녁을 다 먹은 상태였다."]],"exercise":[["When Jim came back, Billy Bones (already / die).","had already died"],["I (never / eat) Mexican food before I went to Mexico.","had never eaten"],["영화가 이미 시작한 뒤였다. (When we arrived, …)","When we arrived, the movie had already started."]]},"expressions":[["right away","곧바로","I liked him right away."],["watch for ~","~이 오는지 지켜보다","Watch for cars when you cross the street."],["That was why ~","그래서 ~였던 것이다","He was sick. That was why he didn’t come."],["turn on ~","~에게 덤벼들다","The dogs turned on each other."]],"speaking":{"retell":["inn – Billy Bones – “a sailor with one leg”","Billy Bones died – sea chest – treasure map","ship – Long John Silver – parrot","apple barrel – heard the plan","island – Ben Gunn – fighting at the fort","empty hole – Ben Gunn had moved the gold","home – Silver escaped – bad dreams"],"discuss":["Is Long John Silver a bad man or a good man? Why?","Jim takes many risks alone. Is he brave or foolish?","If you found a treasure map, what would you do?"],"model":["Is Long John Silver a bad man or a good man?","I think he’s a bad man, but a very interesting one. He lies to everyone and plans to kill the captain. But he is also kind to Jim, and he protects him from the other pirates. He always chooses the side that helps him. In real life, people are not 100 percent good or bad, so he feels real."],"roleplay":"A: 사과 통에서 계획을 엿듣고 나온 짐 / B: 리브시 박사. 짐이 들은 내용을 전하고, 둘이 함께 대책을 세워 보세요."},"writing":{"task":"3개월 차 마무리 — 짐 호킨스의 항해 일지 3일 분량 (과거완료 3번 이상, 150~180단어)","hints":["Day 1 / Day 2 / Day 3 형식","그날 있었던 일 + 그 전에 이미 있었던 일 + 내 감정","마지막 날은 반전(보물이 이미 사라졌다)"],"model":["Ship’s Log — Jim Hawkins","Day 1: We sailed from Bristol this morning. Long John Silver cooked a wonderful dinner. I had never met such a friendly sailor before. His parrot shouted “Pieces of eight!” all evening.","Day 2: Tonight I learned a terrible secret. I had climbed into the apple barrel to get a snack, and I heard Silver talking. He had sailed with Captain Flint! Most of the crew had been pirates, too. My hands are still shaking. Tomorrow I will tell the doctor everything.","Day 3: Today the pirates took me to the red cross. We had walked for hours in the heat. But when we got there, someone had already dug up the treasure! Then my friends came and saved me. Ben Gunn had moved the gold to his cave months ago. I have never been so happy to see an empty hole!"]},"quote":["“Fifteen men on the dead man’s chest — Yo-ho-ho, and a bottle of rum!” (R. L. Stevenson)","“죽은 자의 궤짝 위에 열다섯 사내 — 요호호, 럼주 한 병!”"]}],"review":{"vocab":[["curious","호기심 많은"],["riddle","수수께끼"],["courage","용기"],["ordinary","평범한"],["shadow","그림자"],["pirate","해적"],["treasure","보물"],["empty","텅 빈"],["escape","탈출하다"],["brave","용감한"]],"grammar":[["It ___ be a dream. (틀림없다)","must"],["If I ___ (have) a brain, I could think.","had"],["___ (hear) the clock, Hook fell to his knees.","Hearing"],["When they arrived, the treasure ___ (already / go).","had already gone"],["He ___ be busy. He isn’t answering. (~일지도)","might / may"]],"project":{"title":"3개월 차 프로젝트 — 책 소개 영상 (Book Trailer)","steps":["네 작품 중 하나를 골라 1분짜리 “책 소개 영상” 대본을 쓰세요.","첫 문장: 질문이나 놀라운 사실로 관심 끌기","배경과 인물 소개 (결말은 말하지 않기)","추천 이유 2가지","대본을 보지 않고 녹음 또는 녹화하세요."]}}},{"month":4,"title":"세계 단편소설 — 반전 결말 읽기","level":"B1 (지문 620~770단어)","intro":"네 번째 달에는 반전으로 유명한 세계 단편소설을 읽습니다. O. 헨리, 모파상, 코난 도일의 작품은 짧지만 구성이 탄탄해서 “이야기의 구조”를 배우기에 좋아요. 결말을 예측하며 읽고, 가정법 과거완료와 후회 표현으로 깊이 있는 의견을 말하고 써 봅니다.","skill":"읽기 전략: 마지막 두 문단을 읽기 전에 멈추고, 결말을 예측해 보세요. 그다음 실제 결말과 비교하세요.","units":[{"week":13,"title":"크리스마스 선물","en":"The Gift of the Magi","author":"O. Henry (O. 헨리)","year":"1905","genre":"단편소설 (Short Story)","intro":"미국 단편소설의 대가 O. 헨리의 대표작입니다. 가난한 부부 짐과 델라가 서로에게 크리스마스 선물을 사기 위해 가장 소중한 것을 팔지만… 결말의 반전으로 유명해요. 제목의 Magi(매자이)는 아기 예수에게 선물을 가져온 동방박사들을 뜻합니다.","characters":[["Della (델라)","아름다운 긴 머리를 가진 아내"],["Jim (짐)","할아버지에게 물려받은 금시계를 가진 남편"],["Madame Sofronie (소프로니 부인)","머리카락을 사는 가게 주인"]],"warmup":[["What is the best gift you have ever received?","받은 선물 중 최고의 선물은?"],["Is the price of a gift important?","선물의 가격이 중요할까요?"]],"vocab":[["dollar / cent","달러 / 센트","She had one dollar and eighty-seven cents."],["save","(돈을) 모으다","She had saved for months."],["present","선물","She wanted to buy him a present."],["treasure","보물, 소중한 것","They had two treasures."],["gold watch","금시계","Jim had a gold watch."],["hair","머리카락","Her hair was long and beautiful."],["knee","무릎","Her hair reached below her knees."],["sell","팔다 (sold)","She sold her hair."],["chain","줄","She bought a watch chain."],["comb","빗","He bought her beautiful combs."],["stare","빤히 쳐다보다","Jim stared at her."],["grow back","다시 자라다","My hair will grow back."],["foolish","어리석은","They were two foolish young people."],["wise","현명한","They were the wisest of all."],["give up","포기하다, 내주다","They gave up their treasures."]],"story":["One dollar and eighty-seven cents. That was all. Della counted it three times. One dollar and eighty-seven cents. And the next day was Christmas.","Della and her husband, Jim, lived in a small, cheap apartment in New York. Jim earned only twenty dollars a week. They didn’t have much money, but they loved each other very much. Della had been saving every penny for months to buy Jim a Christmas present, and $1.87 was all she had. She sat down on the old sofa and cried.","After a while, she stood up and looked in the mirror. Suddenly, her eyes were shining. Quickly, she let down her hair.","Della and Jim had two treasures. One was Jim’s gold watch. It had been his grandfather’s and his father’s. The other was Della’s hair. It was brown, shining, and very long — it fell below her knees like a beautiful brown waterfall.","Della put on her old coat and hat and ran out into the street. She stopped at a shop with a sign: “Madame Sofronie. Hair of All Kinds.” “Will you buy my hair?” asked Della. Madame Sofronie lifted the long, beautiful hair. “Twenty dollars,” she said. “Give it to me quickly,” said Della.","For the next two hours, she looked in every shop for Jim’s present. At last, she found it: a simple, beautiful watch chain. It was perfect for Jim’s gold watch. Jim loved his watch, but he used an old leather strap instead of a chain, so he sometimes looked at it secretly. With this chain, he could check the time proudly anywhere. It cost twenty-one dollars. Della hurried home with the chain and 87 cents.","At home, she looked at her short hair in the mirror. “Please, God,” she whispered, “make him think I’m still pretty.” At seven o’clock, she heard Jim on the stairs. The door opened, and Jim came in. He stopped and stared at Della. She couldn’t understand the look in his eyes. It wasn’t anger or surprise. He just stared.","“Jim, darling,” she cried, “don’t look at me like that. I sold my hair because I wanted to give you a Christmas present. It will grow back! My hair grows really fast. Say ‘Merry Christmas,’ and let’s be happy.” “You cut off your hair?” Jim said slowly. “Do you still love me without my hair?” asked Della.","Jim hugged her. “Nothing could make me love you less, Della,” he said. Then he took a small package out of his pocket. “But if you open this, you will understand why I was so surprised.”","Della opened it and screamed with joy — and then began to cry. Inside were the combs — a set of beautiful combs with jewels. She had wanted them for a long time when she saw them in a shop window. Now they were hers, but the hair that should wear them was gone. She held them to her heart and said, “My hair grows so fast, Jim!”","Then she remembered. She gave him the watch chain. “Isn’t it beautiful? I looked all over town for it. Give me your watch. I want to see how it looks.” Jim sat down on the sofa and smiled. “Della,” he said, “let’s put our presents away for a while. They’re too nice to use right now. I sold my watch to buy your combs.”","The Magi were wise men who brought gifts to the baby Jesus. They started the custom of giving Christmas presents. Here I have told you the story of two foolish young people who gave up the greatest treasures of their house for each other. But of all the people who give gifts, these two were the wisest. They are the Magi."],"ko":["1달러 87센트. 그게 전부였다. 델라는 세 번이나 세어 보았다. 1달러 87센트. 그리고 다음 날은 크리스마스였다.","델라와 남편 짐은 뉴욕의 작고 값싼 아파트에 살았다. 짐은 일주일에 20달러밖에 벌지 못했다. 그들은 돈은 많지 않았지만 서로를 무척 사랑했다. 델라는 짐에게 크리스마스 선물을 사 주려고 몇 달 동안 한 푼 한 푼 모았는데, 가진 것은 1달러 87센트가 전부였다. 델라는 낡은 소파에 앉아 울었다.","잠시 후 델라는 일어나 거울을 보았다. 갑자기 그녀의 눈이 반짝였다. 델라는 재빨리 머리를 풀어 내렸다.","델라와 짐에게는 보물이 두 개 있었다. 하나는 짐의 금시계였다. 할아버지와 아버지가 쓰던 시계였다. 다른 하나는 델라의 머리카락이었다. 갈색에 윤기가 흐르고 아주 길어서, 아름다운 갈색 폭포처럼 무릎 아래까지 내려왔다.","델라는 낡은 코트와 모자를 걸치고 거리로 뛰어나갔다. 그녀는 “소프로니 부인. 각종 머리카락 취급.”이라는 간판이 있는 가게 앞에 멈췄다. “제 머리카락을 사시겠어요?” 델라가 물었다. 소프로니 부인은 길고 아름다운 머리카락을 들어 올렸다. “20달러요.” 부인이 말했다. “빨리 주세요.” 델라가 말했다.","그 후 두 시간 동안, 델라는 짐의 선물을 찾아 모든 가게를 둘러보았다. 마침내 찾았다. 단순하고 아름다운 시곗줄이었다. 짐의 금시계에 딱 맞았다. 짐은 시계를 무척 아꼈지만, 줄 대신 낡은 가죽끈을 쓰고 있어서 가끔 몰래 시계를 보곤 했다. 이 줄이 있으면 짐은 어디서든 당당하게 시간을 확인할 수 있을 것이다. 가격은 21달러였다. 델라는 시곗줄과 87센트를 들고 서둘러 집으로 갔다.","집에서 델라는 거울 속 짧은 머리를 보았다. “하느님,” 그녀가 속삭였다. “그이가 제가 아직도 예쁘다고 생각하게 해 주세요.” 7시에 계단을 올라오는 짐의 발소리가 들렸다. 문이 열리고 짐이 들어왔다. 그는 멈춰 서서 델라를 빤히 쳐다보았다. 델라는 그 눈빛을 이해할 수 없었다. 화난 것도, 놀란 것도 아니었다. 그는 그저 쳐다보기만 했다.","“짐, 여보,” 델라가 외쳤다. “그렇게 보지 말아요. 당신에게 크리스마스 선물을 주고 싶어서 머리카락을 팔았어요. 다시 자랄 거예요! 내 머리는 정말 빨리 자라요. ‘메리 크리스마스’라고 말해 줘요. 우리 행복하게 보내요.” “머리카락을 잘랐다고?” 짐이 천천히 말했다. “머리카락이 없어도 날 사랑하죠?” 델라가 물었다.","짐은 델라를 안아 주었다. “그 무엇도 당신에 대한 내 사랑을 줄어들게 할 수는 없어, 델라.” 그가 말했다. 그러고는 주머니에서 작은 꾸러미를 꺼냈다. “하지만 이걸 열어 보면 내가 왜 그렇게 놀랐는지 알게 될 거야.”","델라는 꾸러미를 열고 기뻐서 소리를 질렀다. 그리고 곧 울기 시작했다. 안에는 빗이 들어 있었다. 보석이 박힌 아름다운 빗 세트였다. 가게 진열창에서 본 뒤로 오랫동안 갖고 싶었던 빗이었다. 이제 빗은 그녀의 것이 되었지만, 그 빗을 꽂아야 할 머리카락은 사라지고 없었다. 델라는 빗을 가슴에 꼭 안고 말했다. “내 머리는 정말 빨리 자라요, 짐!”","그때 델라는 생각이 났다. 그녀는 짐에게 시곗줄을 건넸다. “예쁘지 않아요? 온 시내를 다 뒤져서 찾았어요. 시계 줘 봐요. 어떻게 보이는지 보고 싶어요.” 짐은 소파에 앉아 미소 지었다. “델라,” 그가 말했다. “우리 선물은 당분간 넣어 두자. 지금 쓰기엔 너무 좋은 것들이야. 나는 당신 빗을 사려고 시계를 팔았거든.”","동방박사들은 아기 예수에게 선물을 가져온 현명한 사람들이었다. 그들이 크리스마스 선물을 주는 풍습을 시작했다. 나는 여기서 서로를 위해 집안의 가장 큰 보물을 내준 어리석은 두 젊은이의 이야기를 들려주었다. 하지만 선물을 주는 모든 사람 중에서 이 두 사람이 가장 현명했다. 그들이 바로 동방박사다."],"gloss":[["penny","1센트 동전"],["let down","(머리를) 풀어 내리다"],["waterfall","폭포"],["leather strap","가죽끈"],["secretly","몰래"],["package","꾸러미"],["custom","풍습"]],"keySentences":[["Della had been saving every penny for months.","과거완료진행 had been ~ing: 그 시점까지 몇 달 동안 계속 모아 왔다"],["Nothing could make me love you less.","“그 무엇도 내가 당신을 덜 사랑하게 만들 수 없어” — make + 사람 + 동사원형"],["…but the hair that should wear them was gone.","“그 빗을 꽂아야 할 머리카락은 사라졌다” — 작품의 아이러니"],["Of all the people who give gifts, these two were the wisest.","역설: 어리석어 보이는 두 사람이 사실 가장 현명하다"]],"tf":[["Della had $1.87 for Christmas.","T"],["Jim’s watch had belonged to his grandfather.","T"],["Jim was angry because Della cut her hair.","F — 자신이 빗을 사 왔기 때문에 멍해졌다."],["Jim sold his watch to buy the combs.","T"]],"questions":[["What were the two treasures of Della and Jim?","Jim’s gold watch and Della’s long hair."],["How did Della get the money for the present?","She sold her hair for twenty dollars."],["Why couldn’t they use their presents?","Della had no long hair for the combs, and Jim had no watch for the chain."],["Why does the writer call them “the wisest”?","(예) Because they gave with true love. Love is more important than the gifts."]],"listening":{"shadow":"8","dictation":[["Della had been ___ every penny for months.","saving"],["It was brown, shining, and very long — it fell below her ___ like a beautiful brown waterfall.","knees"],["It will grow ___!","back"],["Nothing could make me love you ___.","less"],["I sold my ___ to buy your combs.","watch"]]},"grammar":{"title":"가정법 과거완료 — If + had p.p., would have p.p.","explain":["지나간 과거와 반대되는 상상(“그때 ~했다면 …했을 텐데”)을 말할 때 써요.","If Della had known about the combs, she wouldn’t have sold her hair. (실제로는 몰라서 팔았음)","would have p.p. = ~했을 텐데 / could have p.p. = ~할 수 있었을 텐데","가정법 과거(지금 반대)와 비교: If I had money, I would buy it. (지금) / If I had had money, I would have bought it. (과거)"],"examples":[["If Jim had told Della, she would have kept her hair.","짐이 말했더라면 델라는 머리카락을 지켰을 텐데."],["If I had studied harder, I could have passed the test.","더 열심히 공부했다면 시험에 붙을 수 있었을 텐데."],["If we hadn’t missed the bus, we would have arrived on time.","버스를 놓치지 않았다면 제시간에 도착했을 텐데."],["If I had known you were sick, I would have visited you.","아픈 줄 알았다면 병문안 갔을 텐데."]],"exercise":[["짐이 시계를 팔지 않았다면, 그 줄을 쓸 수 있었을 텐데.","If Jim hadn’t sold his watch, he could have used the chain."],["If I ___ (leave) earlier, I wouldn’t ___ (be) late.","had left / have been"],["어제 비가 오지 않았다면 우리는 소풍을 갔을 텐데.","If it hadn’t rained yesterday, we would have gone on a picnic."]]},"expressions":[["after a while","잠시 후","After a while, the rain stopped."],["instead of ~","~ 대신에","I drank tea instead of coffee."],["each other","서로","They love each other."],["put ~ away","~을 치우다, 넣어 두다","Put your phone away during dinner."]],"speaking":{"retell":["Della – $1.87 – Christmas Eve","two treasures: watch & hair","sold her hair – $20 – watch chain","Jim came home – stared","combs – but no long hair","Jim sold his watch","the writer: they are the wisest"],"discuss":["Were Della and Jim foolish or wise?","If you were Della or Jim, would you do the same thing?","What makes a gift truly valuable?"],"model":["Were Della and Jim foolish or wise?","At first, they look foolish, because they can’t use their gifts. But I agree with the writer that they were wise. The real gift wasn’t the chain or the combs. It was the proof that each one loved the other more than anything. If they hadn’t done this, they wouldn’t have known how deep their love was."],"roleplay":"A: 델라 / B: 짐. 결말 다음 날 아침, 서로의 선택에 대해 이야기하며 내년 크리스마스 계획을 세워 보세요."},"writing":{"task":"“다르게 했다면?” — 델라나 짐의 입장에서 그날을 돌아보는 글 (가정법 과거완료 3번 이상, 150단어)","hints":["If I had ~, I would have ~.","그래도 후회하지 않는 이유","지금의 마음"],"model":["Looking back on that Christmas, I sometimes wonder about other choices.","If I had talked to Jim before selling my hair, he would have told me about the combs. Then I wouldn’t have sold my hair, and he wouldn’t have sold his grandfather’s watch. We could have bought something small and useful, like gloves for him.","But would that be better? I don’t think so. When Jim showed me the combs, I understood that he had given up his most precious thing for me. If we hadn’t made those “foolish” choices, I would never have known how much he loved me.","My hair is long again now, and I wear the combs every Sunday. It was the best Christmas of my life."]},"quote":["“Of all who give gifts, these two were the wisest.” (O. Henry)","선물을 주는 모든 사람 중에서 이 두 사람이 가장 현명했다."]},{"week":14,"title":"마지막 잎새","en":"The Last Leaf","author":"O. Henry (O. 헨리)","year":"1907","genre":"단편소설 (Short Story)","intro":"폐렴에 걸려 “담쟁이 잎이 모두 떨어지면 나도 죽을 거야”라고 믿는 젊은 화가 존시, 그리고 평생 걸작을 꿈꾸던 늙은 화가 버먼의 이야기입니다. 희망의 힘과 이름 없는 희생에 대한 감동적인 작품이에요.","characters":[["Johnsy (존시)","폐렴에 걸린 젊은 화가"],["Sue (수)","존시의 친구이자 룸메이트"],["Mr. Behrman (버먼 씨)","아래층에 사는 늙은 화가"],["The doctor (의사)","“살고 싶은 마음”이 가장 중요하다고 말하는 의사"]],"warmup":[["Can hope help sick people get better?","희망이 아픈 사람을 낫게 할 수 있을까요?"],["What is a “masterpiece”?","“걸작”이란 무엇일까요?"]],"vocab":[["artist","화가, 예술가","Sue and Johnsy were artists."],["pneumonia","폐렴","Johnsy caught pneumonia."],["chance","가능성","She has one chance in ten."],["medicine","약","Medicine can’t help her much."],["count","세다","She was counting the leaves."],["ivy","담쟁이덩굴","An old ivy grew on the wall."],["leaf","잎 (pl. leaves)","The leaves were falling."],["wall","벽","The ivy climbed the brick wall."],["masterpiece","걸작","He always talked about his masterpiece."],["storm","폭풍","A storm blew all night."],["wind","바람","The wind was very strong."],["ladder","사다리","They found a ladder."],["paint","그리다; 물감","He painted the leaf."],["get well","회복하다","I want to get well."],["die of ~","~으로 죽다","He died of pneumonia."]],"story":["Sue and Johnsy were two young artists. They lived and worked together in a small apartment at the top of an old building in New York.","In November, a cold, invisible stranger visited the city. The doctors called it Pneumonia. It touched many people with its icy fingers, and Johnsy was one of them. She lay in her bed, hardly moving, and looked out of the window at the brick wall of the next building.","One morning, the doctor spoke to Sue in the hallway. “She has one chance in ten,” he said. “And that chance is her wish to live. She has decided that she will not get better. Medicine can’t help someone who has already given up.”","When the doctor left, Sue cried. Then she went into Johnsy’s room with a happy face. Johnsy was looking out of the window and counting. “Twelve,” she said. A little later: “eleven… ten… nine… eight… seven.”","Sue looked out. What was she counting? There was only an old ivy plant on the brick wall. The cold autumn wind had blown most of its leaves away. “What are you counting, dear?” asked Sue. “Six,” said Johnsy quietly. “They’re falling faster now. Three days ago, there were almost a hundred. Now it’s easy to count. There goes another one. Only five left.” “Five what?” “Leaves on the ivy. When the last one falls, I will die, too. I’ve known it for three days.” “That’s nonsense!” said Sue. “What do old leaves have to do with getting well?”","Old Mr. Behrman lived on the first floor of the building. He was over sixty and had a long beard. He had been a painter for forty years, but he had never been successful. He always talked about the masterpiece that he was going to paint someday, but he had never even started it. He was a grumpy old man, but he cared about the two young women upstairs. When Sue told him about Johnsy and the leaves, he shouted, “What? Does anyone really die because leaves fall from an old plant? How foolish!”","That night, a terrible storm came. The rain and snow fell, and a strong wind blew all night. In the morning, Johnsy said weakly, “Open the curtain. I want to see.” Sue opened it sadly. But look! After all the wind and rain, there was still one leaf on the ivy. It was dark green near the stem and yellow at the edges, and it hung bravely from its branch.","“It’s the last one,” said Johnsy. “I thought it would fall during the night. It will fall today, and I will die at the same time.” But the day passed, and the leaf was still there. That night, the wind blew again, and the rain beat against the windows. The next morning, Johnsy asked Sue to open the curtain again. The leaf was still there.","Johnsy looked at it for a long time. Then she called Sue. “I’ve been a bad girl, Sudie,” she said. “Something made that last leaf stay there to show me how wrong I was. It’s wrong to want to die. Bring me some soup now. And someday, I hope to paint the Bay of Naples.”","In the afternoon, the doctor came. “She has a good chance now,” he said. “Now I must see another patient downstairs. His name is Behrman. He has pneumonia, too. He is old and weak, and there is no hope for him.” The next day, the doctor said, “Johnsy is out of danger. You’ve won.”","That afternoon, Sue sat on Johnsy’s bed and put her arm around her. “I have something to tell you,” she said. “Mr. Behrman died of pneumonia today in the hospital. He was sick for only two days. On the first morning, they found him in his room. His shoes and clothes were wet and icy cold. Nobody knew where he had been on that terrible night. Then they found a lamp, a ladder, some brushes, and some green and yellow paint. Look out the window, dear, at the last leaf on the wall. Didn’t you wonder why it never moved in the wind? Oh, darling, it’s Behrman’s masterpiece. He painted it there on the night that the last leaf fell.”"],"ko":["수와 존시는 두 젊은 화가였다. 그들은 뉴욕의 오래된 건물 꼭대기에 있는 작은 아파트에서 함께 살며 일했다.","11월에, 차갑고 보이지 않는 손님이 도시를 찾아왔다. 의사들은 그것을 폐렴이라고 불렀다. 그것은 얼음 같은 손가락으로 많은 사람을 건드렸고, 존시도 그중 하나였다. 존시는 침대에 누워 거의 움직이지 못한 채 창밖으로 옆 건물의 벽돌 벽만 바라보았다.","어느 날 아침, 의사가 복도에서 수에게 말했다. “살 가능성은 열에 하나입니다.” 그가 말했다. “그리고 그 가능성은 살고 싶은 마음에 달려 있어요. 그녀는 낫지 않을 거라고 마음먹었어요. 이미 포기한 사람에게는 약도 별 도움이 안 됩니다.”","의사가 떠나자 수는 울었다. 그러고는 밝은 얼굴로 존시의 방에 들어갔다. 존시는 창밖을 보며 무언가를 세고 있었다. “열둘.” 존시가 말했다. 조금 뒤엔 “열하나… 열… 아홉… 여덟… 일곱.”","수가 창밖을 내다보았다. 무엇을 세고 있는 걸까? 벽돌 벽에는 오래된 담쟁이덩굴 하나뿐이었다. 차가운 가을바람이 잎을 대부분 날려 버린 상태였다. “뭘 세고 있니?” 수가 물었다. “여섯.” 존시가 조용히 말했다. “이제 더 빨리 떨어지고 있어. 사흘 전엔 거의 백 개였는데. 이젠 세기 쉬워. 또 하나 떨어진다. 이제 다섯 개 남았어.” “다섯 개 뭐?” “담쟁이 잎. 마지막 잎이 떨어지면 나도 죽을 거야. 사흘 전부터 알고 있었어.” “말도 안 돼!” 수가 말했다. “오래된 잎이 네가 낫는 것과 무슨 상관이야?”","늙은 버먼 씨는 그 건물 1층에 살았다. 그는 예순이 넘었고 긴 수염이 있었다. 그는 40년 동안 화가로 살았지만 한 번도 성공하지 못했다. 그는 언젠가 그릴 걸작에 대해 늘 이야기했지만, 아직 시작조차 하지 않았다. 그는 툴툴거리는 노인이었지만, 위층의 두 젊은 여자를 아꼈다. 수가 존시와 잎 이야기를 하자 그는 소리쳤다. “뭐라고? 오래된 식물에서 잎이 떨어진다고 정말 죽는 사람이 있나? 어리석기는!”","그날 밤, 무시무시한 폭풍이 왔다. 비와 눈이 내렸고, 밤새 강한 바람이 불었다. 아침에 존시가 힘없이 말했다. “커튼 열어 줘. 보고 싶어.” 수는 슬픈 마음으로 커튼을 열었다. 그런데 보라! 그 모든 바람과 비가 지난 뒤에도 담쟁이에는 여전히 잎 하나가 붙어 있었다. 잎자루 쪽은 짙은 초록색이고 가장자리는 노랗게 변한 그 잎은 가지에 용감하게 매달려 있었다.","“마지막 잎이네.” 존시가 말했다. “밤사이에 떨어질 줄 알았는데. 오늘은 떨어질 거고, 나도 그때 죽을 거야.” 하지만 하루가 지나도 잎은 그대로 있었다. 그날 밤 또 바람이 불었고, 비가 창문을 두드렸다. 다음 날 아침, 존시는 다시 커튼을 열어 달라고 했다. 잎은 여전히 거기 있었다.","존시는 오랫동안 그 잎을 바라보았다. 그리고 수를 불렀다. “내가 나빴어, 수디.” 존시가 말했다. “무언가가 저 마지막 잎을 남겨서 내가 얼마나 잘못했는지 보여 준 거야. 죽고 싶어 하는 건 잘못이야. 이제 수프 좀 가져다줘. 그리고 언젠가 나폴리 만을 그리고 싶어.”","오후에 의사가 왔다. “이제 가능성이 높아졌어요.” 그가 말했다. “이제 아래층의 다른 환자를 봐야 합니다. 이름이 버먼이에요. 그 사람도 폐렴에 걸렸어요. 늙고 약해서 희망이 없습니다.” 다음 날 의사가 말했다. “존시는 이제 위험에서 벗어났어요. 당신이 이겼어요.”","그날 오후, 수는 존시의 침대에 앉아 존시를 팔로 감싸 안았다. “할 이야기가 있어.” 수가 말했다. “버먼 씨가 오늘 병원에서 폐렴으로 돌아가셨어. 이틀밖에 아프지 않으셨대. 첫날 아침에 사람들이 방에서 그분을 발견했대. 신발과 옷이 젖어서 얼음처럼 차가웠대. 그 끔찍한 밤에 그분이 어디 계셨는지 아무도 몰랐어. 그러다 사람들이 등불 하나, 사다리 하나, 붓 몇 개, 그리고 초록색과 노란색 물감을 발견했대. 창밖을 봐, 벽에 있는 마지막 잎새를. 바람이 불어도 왜 한 번도 흔들리지 않는지 궁금하지 않았니? 아, 얘야, 그게 버먼 씨의 걸작이야. 마지막 잎이 떨어진 그 밤에 그분이 거기 그리신 거야.”"],"gloss":[["invisible","보이지 않는"],["icy","얼음같이 차가운"],["hallway","복도"],["nonsense","말도 안 되는 소리"],["grumpy","툴툴거리는"],["stem","잎자루, 줄기"],["out of danger","위험에서 벗어난"]],"keySentences":[["Medicine can’t help someone who has already given up.","관계대명사 who + 현재완료: “이미 포기한 사람”"],["What do old leaves have to do with getting well?","have to do with ~ = ~와 관계가 있다. “잎이 낫는 것과 무슨 상관이야?”"],["He had been a painter for forty years, but he had never been successful.","과거완료로 버먼의 긴 실패의 시간을 보여 줘요"],["Didn’t you wonder why it never moved in the wind?","부정 의문문 + 간접의문문 (why it never moved) — 반전의 열쇠"]],"tf":[["Johnsy thought she would die when the last leaf fell.","T"],["The doctor said medicine was the most important thing.","F — 살고 싶은 마음이 가장 중요하다고 했다."],["Mr. Behrman had painted many famous pictures.","F — 한 번도 성공하지 못했다."],["The last leaf was a painting.","T"]],"questions":[["What was Johnsy counting?","The leaves on the ivy outside her window."],["What did the doctor say about Johnsy’s chance?","She had one chance in ten, and it depended on her wish to live."],["What did people find near Mr. Behrman?","A lamp, a ladder, brushes, and green and yellow paint."],["Why is the leaf called Behrman’s “masterpiece”?","(예) Because it saved a life. It was the greatest work of his life."]],"listening":{"shadow":"7","dictation":[["She has one ___ in ten.","chance"],["When the last one falls, I will ___, too.","die"],["He had been a painter for forty years, but he had never been ___.","successful"],["It’s wrong to ___ to die.","want"],["Oh, darling, it’s Behrman’s ___.","masterpiece"]]},"grammar":{"title":"후회와 아쉬움 — should have / could have / might have p.p.","explain":["should have p.p.: ~했어야 했는데 (안 했음) → I should have called you.","shouldn’t have p.p.: ~하지 말았어야 했는데 (했음) → I shouldn’t have eaten so much.","could have p.p.: ~할 수도 있었는데 (안 했음) → He could have stayed inside.","might have p.p.: ~했을지도 모른다 (추측) → She might have died.","말할 때는 should’ve [슈드브], could’ve [쿠드브]로 줄여 발음해요."],"examples":[["Johnsy should have taken care of herself.","존시는 몸을 돌봤어야 했다."],["Behrman could have stayed in his warm room.","버먼은 따뜻한 방에 있을 수도 있었다."],["I shouldn’t have said that.","그 말을 하지 말걸."],["You could have told me earlier!","좀 더 일찍 말해 줄 수도 있었잖아!"]],"exercise":[["나는 그 책을 더 일찍 읽었어야 했다.","I should have read the book earlier."],["그는 그 말을 하지 말았어야 했다.","He shouldn’t have said that."],["그 잎이 없었다면 존시는 죽었을지도 모른다.","Without the leaf, Johnsy might have died."]]},"expressions":[["give up","포기하다","Don’t give up!"],["have to do with ~","~와 관계가 있다","My job has to do with computers."],["care about ~","~을 아끼다, 신경 쓰다","He really cares about his students."],["out of danger","위험에서 벗어난","The patient is out of danger now."]],"speaking":{"retell":["Sue & Johnsy – young artists","pneumonia – one chance in ten","counting leaves – “When the last one falls…”","Mr. Behrman – old painter – never successful","storm – the last leaf stayed","Johnsy wanted to live again","Behrman died – the leaf was his masterpiece"],"discuss":["Do you think a positive mind can help people get well?","Was Mr. Behrman a failure or a success as an artist?","Who has quietly helped you in your life?"],"model":["Was Mr. Behrman a failure or a success?","Most people would say he was a failure, because he never became famous. But I think he was a great success in the end. Art should move people’s hearts, and his last leaf saved a life. He could have stayed in his warm room, but he went out into the storm. That leaf was more powerful than any painting in a museum."],"roleplay":"A: 회복한 존시 / B: 수. 버먼 씨의 이야기를 들은 직후의 대화. should have / could have 를 사용해 마음을 표현해 보세요."},"writing":{"task":"존시가 버먼 씨에게 쓰는 감사 편지 (should have / could have 를 2번 이상, 130~150단어)","hints":["Dear Mr. Behrman, 으로 시작","그분에 대해 몰랐던 것, 아쉬운 점","그분이 남긴 것과 앞으로의 다짐"],"model":["Dear Mr. Behrman,","I am writing this letter, but I know you can’t read it. I am so sorry. I should have visited you more often, and I should have listened to your stories about art.","Two weeks ago, I was very sick, and I had given up on life. I believed I would die when the last leaf fell. On the stormiest night of the year, you climbed a ladder and painted a leaf for me. You could have stayed in your warm room, but you didn’t. Because of you, I am alive today.","You always talked about your masterpiece. Now I know you finally painted it. Every picture I paint from now on will be for you.","Thank you,","Johnsy"]},"quote":["“It’s Behrman’s masterpiece — he painted it there the night that the last leaf fell.” (O. Henry)","“그게 버먼 씨의 걸작이야. 마지막 잎이 떨어진 그 밤에 그분이 거기 그리신 거야.”"]},{"week":15,"title":"목걸이","en":"The Necklace","author":"Guy de Maupassant (기 드 모파상)","year":"1884","genre":"단편소설 (Short Story)","intro":"프랑스 작가 모파상의 대표 단편입니다. 화려한 삶을 꿈꾸던 마틸드는 파티에 가려고 친구에게 다이아몬드 목걸이를 빌렸다가 잃어버리고, 그 값을 갚느라 10년 동안 고생합니다. 체면과 솔직하지 못함이 가져온 비극을 날카로운 반전으로 보여 줘요.","characters":[["Mathilde (마틸드)","가난한 삶에 불만인 아름다운 여인"],["Mr. Loisel (루아젤 씨)","아내를 기쁘게 해 주려는 평범한 공무원 남편"],["Madame Forestier (포레스티에 부인)","목걸이를 빌려준 부자 친구"]],"warmup":[["Do you care a lot about what other people think of you?","남의 시선을 많이 신경 쓰나요?"],["Have you ever borrowed something and lost it?","빌린 물건을 잃어버린 적이 있나요?"]],"vocab":[["necklace","목걸이","She borrowed a diamond necklace."],["diamond","다이아몬드","It looked like real diamonds."],["invitation","초대장","He brought home an invitation."],["party","파티","It was a big party."],["dress","드레스","She bought a new dress."],["jewelry","보석류","I have no jewelry."],["borrow","빌리다","She borrowed it from her friend."],["lend","빌려주다 (lent)","Can you lend me your necklace?"],["lose","잃어버리다 (lost)","She lost the necklace."],["search","찾다, 수색하다","They searched everywhere."],["replace","대신 사다, 대체하다","They had to replace it."],["debt","빚","It took ten years to pay the debt."],["hard","힘든, 열심히","Their life became very hard."],["fake","가짜의","The necklace was fake."],["worth","~의 가치가 있는","It was worth only 500 francs."]],"story":["Mathilde was a pretty and charming young woman, but she was born into a poor family. She had no money, so she married a clerk who worked at the Ministry of Education.","Mathilde was always unhappy. She felt that she was born for a rich life. She hated her small apartment, the old chairs, and the ugly curtains. She dreamed of big rooms, elegant dinners, and beautiful dresses. She had no nice dresses and no jewelry, and those were the only things she loved.","One evening, her husband came home with a big smile. “Look! I have something for you,” he said. It was an invitation to an important party at the Ministry. But Mathilde threw it on the table angrily. “What can I wear to a party like that?” she said, and she started to cry. Her husband had saved four hundred francs to buy a hunting gun. Instead, he gave the money to Mathilde, and she bought a beautiful dress.","But as the party got closer, she was still sad. “I don’t have any jewelry,” she said. “I will look so poor.” “Go and see your friend Madame Forestier,” said her husband. “Ask her to lend you some jewelry.” The next day, Mathilde visited her rich friend. Madame Forestier opened a large box and said, “Choose anything you like.” Mathilde saw a beautiful diamond necklace, and her heart began to beat fast. “Can you lend me this one?” “Of course,” said her friend.","On the night of the party, Mathilde was a great success. She was the most beautiful woman there. All the men wanted to dance with her. She danced happily all night, forgetting everything.","They left at four in the morning. At home, she stood in front of the mirror to look at herself once more. Suddenly she screamed. The necklace was gone! They searched her dress, her coat, and every pocket. Her husband walked back along the streets. He went to the police and put an advertisement in the newspaper. But they didn’t find it.","After a week, they had lost all hope. “We must buy a new necklace,” said her husband. In a shop, they found a diamond necklace that looked exactly the same. It cost thirty-six thousand francs. Her husband had eighteen thousand francs from his father. He borrowed the rest from many people. He made promises he could hardly keep, and he risked his whole future. Then Mathilde took the new necklace to Madame Forestier, who said coldly, “You should have returned it sooner.” She didn’t open the box. If she had noticed the change, what would she have thought?","Now Mathilde learned what a poor life really was. They sent away their servant and moved to a tiny room under the roof. Mathilde did all the hard housework herself. She washed dirty dishes and carried water up the stairs. At the market, she argued over every penny. Her husband worked in the evenings and late at night, too.","This life continued for ten years. At the end of ten years, they had paid back all the money. Mathilde looked old now. Her hands were red and rough, and her hair was messy. Sometimes, when she was alone, she sat by the window and thought about that wonderful party long ago. What would have happened if she hadn’t lost the necklace? Who knows? Life is so strange! A very small thing can ruin you or save you.","One Sunday, Mathilde was taking a walk in the park when she saw Madame Forestier. She was still young and beautiful. Mathilde decided to tell her everything. “Good morning, Jeanne.” Her friend didn’t recognize her. “I’m sorry, I don’t know you.” “It’s me, Mathilde.” “Oh, my poor Mathilde! You’ve changed so much!” “Yes, I’ve had some very hard years — and all because of you!” “Because of me? What do you mean?”","“Do you remember the diamond necklace you lent me for the party? I lost it.” “But you gave it back to me.” “I gave you another one that looked the same. It took us ten years to pay for it. It wasn’t easy for us, because we had nothing. But it’s finished now, and I’m very glad.” Madame Forestier stopped walking. “You bought a diamond necklace to replace mine?” “Yes. You didn’t notice, did you? They looked exactly the same.” And Mathilde smiled with a proud and simple joy.","Madame Forestier took both of her hands. “Oh, my poor Mathilde! Mine was fake. It was worth five hundred francs at the most!”"],"ko":["마틸드는 예쁘고 매력적인 젊은 여자였지만, 가난한 집안에서 태어났다. 돈이 없었던 그녀는 교육부에서 일하는 사무원과 결혼했다.","마틸드는 늘 불행했다. 자신은 부유한 삶을 위해 태어났다고 느꼈다. 그녀는 작은 아파트와 낡은 의자, 못생긴 커튼이 싫었다. 넓은 방, 우아한 저녁 식사, 아름다운 드레스를 꿈꾸었다. 그녀에게는 멋진 드레스도 보석도 없었는데, 그것들이야말로 그녀가 사랑하는 유일한 것이었다.","어느 저녁, 남편이 활짝 웃으며 집에 왔다. “이것 봐! 당신에게 줄 게 있어.” 그가 말했다. 교육부에서 열리는 중요한 파티의 초대장이었다. 하지만 마틸드는 화를 내며 초대장을 식탁에 던졌다. “그런 파티에 뭘 입고 가요?” 그녀는 이렇게 말하고 울기 시작했다. 남편은 사냥총을 사려고 400프랑을 모아 두었었다. 그는 대신 그 돈을 마틸드에게 주었고, 그녀는 아름다운 드레스를 샀다.","하지만 파티가 다가오는데도 그녀는 여전히 슬펐다. “보석이 하나도 없어요.” 그녀가 말했다. “너무 가난해 보일 거예요.” “친구 포레스티에 부인을 찾아가 봐.” 남편이 말했다. “보석을 좀 빌려 달라고 해.” 다음 날 마틸드는 부자 친구를 찾아갔다. 포레스티에 부인은 커다란 상자를 열며 말했다. “마음에 드는 걸 골라.” 마틸드는 아름다운 다이아몬드 목걸이를 보았고, 심장이 빠르게 뛰기 시작했다. “이걸 빌려줄 수 있니?” “물론이지.” 친구가 말했다.","파티 날 밤, 마틸드는 대성공이었다. 그녀는 그곳에서 가장 아름다운 여자였다. 모든 남자가 그녀와 춤추고 싶어 했다. 그녀는 모든 것을 잊고 밤새 즐겁게 춤추었다.","그들은 새벽 4시에 파티장을 나섰다. 집에서 마틸드는 자기 모습을 한 번 더 보려고 거울 앞에 섰다. 갑자기 그녀가 비명을 질렀다. 목걸이가 없어진 것이다! 그들은 드레스, 코트, 모든 주머니를 뒤졌다. 남편은 걸어왔던 길을 되짚어 갔다. 경찰서에도 가고 신문에 광고도 냈다. 하지만 찾지 못했다.","일주일 뒤, 그들은 모든 희망을 잃었다. “새 목걸이를 사야 해.” 남편이 말했다. 한 가게에서 그들은 똑같아 보이는 다이아몬드 목걸이를 발견했다. 가격은 3만 6천 프랑이었다. 남편에게는 아버지에게 받은 1만 8천 프랑이 있었다. 나머지는 여러 사람에게 빌렸다. 거의 지킬 수 없는 약속을 하고, 자신의 미래를 모두 걸었다. 그 후 마틸드가 새 목걸이를 포레스티에 부인에게 가져가자, 부인은 차갑게 말했다. “좀 더 빨리 돌려줬어야지.” 부인은 상자를 열어 보지 않았다. 만약 바뀐 것을 알아챘다면, 부인은 무슨 생각을 했을까?","이제 마틸드는 가난한 삶이 무엇인지 진짜로 알게 되었다. 그들은 하녀를 내보내고 지붕 밑의 아주 작은 방으로 이사했다. 마틸드는 힘든 집안일을 모두 직접 했다. 더러운 그릇을 씻고, 계단으로 물을 날랐다. 시장에서는 한 푼 한 푼을 두고 흥정했다. 남편도 저녁과 밤늦게까지 일했다.","이런 생활이 10년 동안 이어졌다. 10년이 끝날 무렵, 그들은 빚을 모두 갚았다. 마틸드는 이제 늙어 보였다. 손은 빨갛고 거칠었으며, 머리는 헝클어져 있었다. 가끔 혼자 있을 때, 그녀는 창가에 앉아 오래전 그 멋진 파티를 생각했다. 목걸이를 잃어버리지 않았다면 어떻게 되었을까? 누가 알겠는가? 인생은 정말 이상하다! 아주 작은 일이 사람을 망칠 수도, 구할 수도 있다.","어느 일요일, 마틸드는 공원을 산책하다가 포레스티에 부인을 보았다. 부인은 여전히 젊고 아름다웠다. 마틸드는 모든 것을 말하기로 했다. “안녕, 잔.” 친구는 그녀를 알아보지 못했다. “죄송하지만 누구신지 모르겠어요.” “나야, 마틸드.” “어머, 가엾은 마틸드! 정말 많이 변했구나!” “그래, 정말 힘든 세월을 보냈어. 그게 다 너 때문이야!” “나 때문에? 무슨 말이야?”","“파티 때 네가 빌려준 다이아몬드 목걸이 기억나? 내가 그걸 잃어버렸어.” “하지만 돌려줬잖아.” “똑같아 보이는 다른 걸 돌려준 거야. 그 값을 갚느라 10년이 걸렸어. 우린 가진 게 없어서 쉽지 않았지. 하지만 이제 다 끝났고, 정말 기뻐.” 포레스티에 부인은 걸음을 멈췄다. “내 목걸이 대신 다이아몬드 목걸이를 샀다고?” “응. 너 몰랐지? 둘이 똑같아 보였거든.” 그리고 마틸드는 자랑스럽고 순수한 기쁨으로 미소 지었다.","포레스티에 부인은 마틸드의 두 손을 꼭 잡았다. “아, 가엾은 마틸드! 내 건 가짜였어. 기껏해야 500프랑짜리였다고!”"],"gloss":[["charming","매력적인"],["clerk","사무원"],["elegant","우아한"],["franc","프랑 (옛 프랑스 돈)"],["advertisement","광고"],["risk","위태롭게 하다, 걸다"],["rough","거친"],["recognize","알아보다"]],"keySentences":[["She felt that she was born for a rich life.","feel that + 문장 = ~라고 느끼다. 마틸드의 불행이 시작된 생각"],["If she had noticed the change, what would she have thought?","가정법 과거완료 의문문 (13주차 복습)"],["It took us ten years to pay for it.","It takes + 사람 + 시간 + to ~ = ~하는 데 시간이 걸리다"],["A very small thing can ruin you or save you.","작품의 주제: 아주 작은 일이 인생을 망칠 수도, 구할 수도 있다"]],"tf":[["Mathilde was happy with her simple life.","F — 늘 부유한 삶을 꿈꾸며 불행했다."],["Her husband gave her the money he had saved for a gun.","T"],["Madame Forestier opened the box and checked the necklace.","F — 상자를 열어 보지도 않았다."],["The first necklace was made of real diamonds.","F — 가짜였다."]],"questions":[["Why was Mathilde unhappy at the beginning?","She felt she was born for a rich life, but she was poor."],["How did they get the money for the new necklace?","They used 18,000 francs from his father and borrowed the rest."],["How did Mathilde change after ten years?","She looked old, her hands were red and rough, and she worked very hard."],["What could Mathilde have done to avoid this tragedy?","(예) She could have told her friend the truth. Then she would have learned it was fake."]],"listening":{"shadow":"6","dictation":[["She dreamed of big rooms, ___ dinners, and beautiful dresses.","elegant"],["Can you ___ me this one?","lend"],["The necklace
