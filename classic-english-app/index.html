 was ___!","gone"],["It took us ten years to ___ for it.","pay"],["Mine was ___.","fake"]]},"grammar":{"title":"강조하기 — It is ~ that … / what ~","explain":["It is/was + 강조할 말 + that ~: “~한 것은 바로 …이다” → It was her pride that ruined her life.","어떤 부분이든 강조할 수 있어요. → It was at the party that she lost it. (장소 강조)","what = “~한 것” (the thing that) → What she wanted was a rich life.","what 앞에는 명사를 쓰지 않아요. the thing what (X) / what (O)"],"examples":[["It was her pride that ruined her life.","그녀의 삶을 망친 것은 바로 자존심이었다."],["It was only at the end that she learned the truth.","그녀가 진실을 안 것은 바로 마지막이었다."],["What she needed was honesty.","그녀에게 필요했던 것은 정직함이었다."],["I can’t believe what I heard.","내가 들은 것을 믿을 수가 없다."]],"exercise":[["Mathilde borrowed the necklace from her friend. (from her friend 강조)","It was from her friend that Mathilde borrowed the necklace."],["___ she wanted was a beautiful dress. (what / that)","What"],["그녀를 행복하게 한 것은 바로 그 파티였다.","It was the party that made her happy."]]},"expressions":[["dream of ~","~을 꿈꾸다","I dream of living by the sea."],["at the most","기껏해야","It takes ten minutes at the most."],["pay back","(돈을) 갚다","I’ll pay you back tomorrow."],["because of ~","~ 때문에","We stayed home because of the rain."]],"speaking":{"retell":["Mathilde – pretty but poor – unhappy","invitation – new dress – no jewelry","borrowed a diamond necklace","party – success – lost the necklace","bought a new one – big debt","ten hard years","met her friend – the necklace was fake"],"discuss":["Who is responsible for Mathilde’s problems?","Was her ten years of hard work completely wasted?","In the age of social media, are people becoming like Mathilde?"],"model":["Who is responsible for Mathilde’s problems?","I think Mathilde is mainly responsible. It was her pride that stopped her from telling the truth. If she had been honest, her friend would have told her, “Don’t worry, it’s fake.” But her husband also made a mistake. He didn’t say, “Let’s tell the truth.” So I think they were both responsible."],"roleplay":"A: 목걸이를 잃어버린 직후의 마틸드 / B: 남편. 이번엔 둘이 친구에게 솔직하게 말하기로 결정하는 대화를 만들어 보세요."},"writing":{"task":"결말 이후의 이야기: 가짜라는 말을 들은 뒤 두 사람의 대화 (It ~ that 강조를 1번 이상, 150단어)","hints":["마틸드의 첫 반응 (감정 묘사)","포레스티에 부인의 제안은?","마틸드가 깨달은 것"],"model":["For a long time, Mathilde couldn’t speak. Her face turned white. Then she began to laugh — a strange, sad laugh.","“Fake?” she whispered. “Ten years, Jeanne. Ten years of washing dishes and carrying water. For five hundred francs?”","Madame Forestier held her hands. “Why didn’t you tell me? I would have forgiven you right away. Listen — the necklace you gave me is real. It belongs to you. I will sell it and give you the money.”","That evening, Mathilde told her husband everything. He was quiet for a long time, and then he hugged her.","That night, Mathilde realized something. It wasn’t the lost necklace that had ruined her life. It was her fear of looking poor."]},"quote":["“How little it takes to ruin us or to save us!” (Guy de Maupassant)","우리를 망치거나 구하는 데에는 얼마나 작은 것으로 충분한가!"]},{"week":16,"title":"빨간 머리 연맹 (셜록 홈스)","en":"The Red-Headed League","author":"Arthur Conan Doyle (아서 코난 도일)","year":"1891","genre":"추리 소설 (Detective Story)","intro":"명탐정 셜록 홈스 시리즈 중 가장 인기 있는 단편입니다. 빨간 머리라는 이유만으로 쉬운 일에 큰돈을 받던 전당포 주인 윌슨의 이상한 사건을 홈스가 관찰과 추리로 풀어냅니다. 논리적으로 말하고 쓰는 법을 배우기에 완벽한 작품이에요.","characters":[["Sherlock Holmes (셜록 홈스)","런던 베이커가의 천재 탐정"],["Dr. Watson (왓슨 박사)","홈스의 친구이자 이야기를 들려주는 사람"],["Mr. Wilson (윌슨 씨)","빨간 머리의 전당포 주인"],["Vincent Spaulding (빈센트 스폴딩)","윌슨의 조수, 사실은 유명한 범죄자 존 클레이"]],"warmup":[["Do you like detective stories? Which ones?","추리물을 좋아하나요?"],["If a job offer seems “too good to be true,” what should you do?","너무 좋은 조건의 일자리 제안이 오면?"]],"vocab":[["detective","탐정","Sherlock Holmes was a famous detective."],["shop","가게","Mr. Wilson had a small shop."],["assistant","조수","His assistant worked for half pay."],["advertisement","광고","He showed us an advertisement."],["red-headed","빨간 머리의","Only red-headed men could join."],["salary","급여","The salary was four pounds a week."],["copy","베껴 쓰다","He had to copy the encyclopedia."],["basement","지하실","The assistant went to the basement."],["tunnel","터널","They were digging a tunnel."],["bank","은행","The bank was behind the shop."],["clue","단서","The dirty knees were a clue."],["knee","무릎","The knees of his pants were dirty."],["catch","잡다 (caught)","Holmes caught the criminal."],["criminal","범죄자","He was a famous criminal."],["explain","설명하다","Holmes explained everything."]],"story":["One autumn day, I went to visit my friend Sherlock Holmes. He was talking with an old, heavy man with bright red hair. “Watson, you came at the perfect time,” said Holmes. “This is Mr. Wilson. He has a very strange story.”","Holmes looked at Mr. Wilson for a moment. “I can see that you have done hard work with your hands, that you have been to China, and that you have done a lot of writing recently,” he said. Mr. Wilson was amazed. “How did you know?” Holmes smiled. “Your right hand is bigger than your left, so you have used it for hard work. You have a fish tattoo that is only done in China. And your right sleeve is shiny from writing at a desk.”","Then Mr. Wilson told his story. He had a small shop in London. Business was slow, so he had only one assistant, a young man named Vincent Spaulding. Spaulding was happy to work for half pay because he wanted to learn the business. “He’s a good worker,” said Mr. Wilson, “but he loves photography. He’s always going down into the basement to work on his photos.”","Eight weeks before, Spaulding had shown him an advertisement in the newspaper: “THE RED-HEADED LEAGUE: There is a job for a red-headed man. Salary: four pounds a week for very easy work.” Spaulding explained that a rich American with red hair had left his money to help red-headed men. He told Mr. Wilson to apply.","The next morning, the street was full of men with red hair of every kind — orange, brick-red, and gold. But when the manager saw Mr. Wilson’s hair, he gave him the job at once. The work was strange. Mr. Wilson had to stay in an office from ten o’clock to two o’clock every day and copy the encyclopedia by hand. If he left the office even once, he would lose the job. His assistant could watch the shop in the mornings, so he agreed.","For eight weeks, he worked every day and got four gold coins every Saturday. Then, that morning, he had found the office door locked. A small sign said: “THE RED-HEADED LEAGUE IS CLOSED.” Nobody knew anything about the League.","Holmes listened carefully. Then he asked about the assistant. “How long had he worked for you when he showed you the advertisement?” “About a month.” “What does he look like?” “Small and quick, with no beard. He has a white mark on his forehead.” Holmes sat up with excitement. “I thought so,” he said.","After Mr. Wilson left, Holmes and I went to his shop. Holmes hit the ground in front of it with his stick a few times. Then he knocked on the door, and the young assistant opened it. Holmes asked him for directions and looked down for a second. Later, he said, “I only wanted to see the knees of his pants.” Then we walked around the corner to the street behind the shop. Holmes looked carefully at the buildings. One of them was the City and Suburban Bank.","That night, Holmes, a police officer, the bank manager, and I waited quietly in the dark basement of the bank. The manager told us that thirty thousand gold coins from France were kept there. After more than an hour, a light appeared between the stones of the floor. A stone moved, and a young face looked up from a hole. It was Wilson’s assistant! As he climbed out, Holmes jumped forward and caught him. “It’s no use, John Clay,” said Holmes. “You have no chance.” John Clay was one of the most famous criminals in London.","Later, Holmes explained everything to me. “The League was strange from the start. The job was easy and the pay was high, so its only purpose must have been to get Mr. Wilson out of his shop for a few hours every day. The assistant worked for half pay, so he must have had a reason to be there. He spent a lot of time in the basement. Therefore, something was happening there. When I saw the knees of his pants, they were dirty and worn. That means he had been digging. When I saw the bank behind the shop, I knew where the tunnel went.” “And how did you know they would come tonight?” I asked. “They closed the League office, which means the tunnel was finished. Saturday was the best day, because the bank is closed on Sunday. That gave them two days to escape.” “Amazing!” I said. Holmes just yawned. “It saved me from a boring week.”"],"ko":["어느 가을날, 나는 친구 셜록 홈스를 만나러 갔다. 그는 빨간 머리가 선명한 체격이 큰 노신사와 이야기하고 있었다. “왓슨, 딱 좋은 때에 왔군.” 홈스가 말했다. “이쪽은 윌슨 씨야. 아주 이상한 이야기를 가지고 오셨지.”","홈스는 잠시 윌슨 씨를 바라보았다. “손으로 힘든 일을 하신 적이 있고, 중국에 다녀오셨고, 최근에 글을 많이 쓰셨군요.” 그가 말했다. 윌슨 씨는 깜짝 놀랐다. “어떻게 아셨습니까?” 홈스가 미소 지었다. “오른손이 왼손보다 크니 힘든 일에 오른손을 쓰셨겠지요. 중국에서만 하는 물고기 문신이 있고요. 그리고 오른쪽 소매가 책상에서 글을 써서 반들반들합니다.”","그러고 나서 윌슨 씨는 자기 이야기를 했다. 그는 런던에서 작은 가게를 하고 있었다. 장사가 잘 안돼서 조수는 빈센트 스폴딩이라는 젊은이 한 명뿐이었다. 스폴딩은 장사를 배우고 싶다며 기꺼이 월급을 반만 받고 일했다. “일은 잘합니다.” 윌슨 씨가 말했다. “그런데 사진을 너무 좋아해요. 사진 작업을 한다고 늘 지하실로 내려가지요.”","8주 전, 스폴딩은 그에게 신문 광고 하나를 보여 주었다. “빨간 머리 연맹: 빨간 머리 남성을 위한 일자리 있음. 급여: 아주 쉬운 일에 주당 4파운드.” 스폴딩은 빨간 머리를 가진 미국 부자가 빨간 머리 남자들을 돕기 위해 재산을 남겼다고 설명했다. 그는 윌슨 씨에게 지원해 보라고 했다.","다음 날 아침, 거리는 온갖 빨간 머리를 가진 남자들로 가득했다. 주황색, 벽돌색, 금색까지. 하지만 관리자는 윌슨 씨의 머리를 보자마자 바로 그를 채용했다. 일은 이상했다. 윌슨 씨는 매일 10시부터 2시까지 사무실에 있으면서 백과사전을 손으로 베껴 써야 했다. 한 번이라도 사무실을 나가면 일자리를 잃게 되어 있었다. 오전에는 조수가 가게를 볼 수 있었으므로 그는 동의했다.","8주 동안 그는 매일 일했고 매주 토요일에 금화 4개를 받았다. 그런데 그날 아침, 사무실 문이 잠겨 있었다. 작은 안내문에는 이렇게 쓰여 있었다. “빨간 머리 연맹은 문을 닫았음.” 그 연맹에 대해 아는 사람은 아무도 없었다.","홈스는 주의 깊게 들었다. 그리고 조수에 대해 물었다. “그가 광고를 보여 줬을 때, 그는 당신 밑에서 얼마나 일했었나요?” “한 달쯤이요.” “생김새는 어떻습니까?” “작고 날쌔고, 수염이 없어요. 이마에 하얀 자국이 있습니다.” 홈스가 흥분해서 몸을 일으켰다. “그럴 줄 알았어요.” 그가 말했다.","윌슨 씨가 떠난 뒤, 홈스와 나는 그의 가게로 갔다. 홈스는 가게 앞 땅을 지팡이로 몇 번 두드렸다. 그다음 문을 두드리자 젊은 조수가 문을 열었다. 홈스는 그에게 길을 묻고 잠깐 아래를 내려다보았다. 나중에 그가 말했다. “나는 그저 그의 바지 무릎을 보고 싶었을 뿐이야.” 그러고 나서 우리는 모퉁이를 돌아 가게 뒤쪽 거리로 갔다. 홈스는 건물들을 주의 깊게 살폈다. 그중 하나가 시티 앤드 서버번 은행이었다.","그날 밤, 홈스와 경찰관 한 명, 은행 지점장, 그리고 나는 은행의 어두운 지하실에서 조용히 기다렸다. 지점장은 프랑스에서 온 금화 3만 개가 거기 보관되어 있다고 말해 주었다. 한 시간 넘게 지나자, 바닥 돌 사이로 불빛이 나타났다. 돌 하나가 움직이더니 구멍 속에서 젊은 얼굴이 올려다보았다. 윌슨의 조수였다! 그가 기어 올라오자 홈스가 앞으로 뛰어나가 그를 붙잡았다. “소용없어, 존 클레이.” 홈스가 말했다. “넌 기회가 없어.” 존 클레이는 런던에서 가장 유명한 범죄자 중 한 명이었다.","나중에 홈스는 내게 모든 것을 설명해 주었다. “그 연맹은 처음부터 이상했어. 일은 쉽고 급여는 높았지. 그러니 유일한 목적은 매일 몇 시간씩 윌슨 씨를 가게에서 내보내는 것이었음에 틀림없어. 조수는 월급을 반만 받고 일했으니, 거기 있어야 할 이유가 있었음에 틀림없고. 그는 지하실에서 많은 시간을 보냈어. 그러므로 거기서 무슨 일인가 벌어지고 있었던 거지. 그의 바지 무릎을 보니 더럽고 해져 있었어. 그건 그가 땅을 파고 있었다는 뜻이야. 가게 뒤에 있는 은행을 보고 나는 터널이 어디로 가는지 알았지.” “그럼 그들이 오늘 밤에 올 걸 어떻게 알았나?” 내가 물었다. “연맹 사무실을 닫았지. 그건 터널이 완성되었다는 뜻이야. 은행이 일요일에 문을 닫으니 토요일이 가장 좋은 날이었어. 도망칠 시간이 이틀이나 생기니까.” “놀랍군!” 내가 말했다. 홈스는 그저 하품을 했다. “덕분에 지루한 한 주를 면했지.”"],"gloss":[["amazed","깜짝 놀란"],["tattoo","문신"],["sleeve","소매"],["League","연맹"],["apply","지원하다"],["encyclopedia","백과사전"],["forehead","이마"],["purpose","목적"],["worn","해진, 닳은"],["yawn","하품하다"]],"keySentences":[["Spaulding was happy to work for half pay because he wanted to learn the business.","반값에 일한다는 점이 사건의 첫 번째 단서"],["Its only purpose must have been to get Mr. Wilson out of his shop.","must have p.p. = ~이었음에 틀림없다 (홈스의 추리 핵심 표현)"],["Therefore, something was happening there.","Therefore = 그러므로. 앞의 근거에서 결론을 이끌어 내요"],["They closed the League office, which means the tunnel was finished.",", which means ~ = 그건 ~라는 뜻이다 (앞 문장 전체를 받음)"]],"tf":[["Holmes knew Mr. Wilson had been to China because of his tattoo.","T"],["Spaulding worked for a very high salary.","F — 반값에 일했다."],["Mr. Wilson’s job was to copy the encyclopedia.","T"],["The tunnel went to a museum.","F — 은행으로 가는 터널이었다."]],"questions":[["What was strange about the job at the Red-Headed League?","The pay was high for very easy work, and he couldn’t leave the office from ten to two."],["What was the real purpose of the League?","To get Mr. Wilson out of his shop so the assistant could dig a tunnel."],["Why did Holmes look at the assistant’s knees?","To see if they were dirty from digging."],["Why did Holmes think they would come on Saturday night?","The League was closed (tunnel finished), and the bank was closed on Sunday, so they had two days to escape."]],"listening":{"shadow":"5","dictation":[["Watson, you came at the ___ time.","perfect"],["He’s always going down into the ___ to work on his photos.”","basement"],["If he left the office even once, he would ___ the job.","lose"],["The job was easy and the pay was high, so its only purpose must have ___ to get Mr. Wilson out of his shop for a few hours every day.","been"],["___, something was happening there.","Therefore"]]},"grammar":{"title":"논리 연결어 — 이유 · 결과 · 정리","explain":["이유: because / since + 문장, because of + 명사 → Since the pay was high, he took the job.","결과: so / therefore / as a result → He was digging. Therefore, his knees were dirty.","정리: That means ~ / , which means ~ / In other words, ~","추론: must have p.p. (틀림없이 ~했다) / can’t have p.p. (~했을 리 없다)","therefore, however 앞에는 마침표(.)를, 뒤에는 쉼표(,)를 써요."],"examples":[["The assistant worked for half pay. Therefore, he must have had another reason.","조수는 반값에 일했다. 그러므로 다른 이유가 있었음에 틀림없다."],["The game was canceled because of the rain.","경기는 비 때문에 취소되었다."],["His hands are dirty, which means he has been working in the garden.","그의 손이 더럽다. 그건 그가 정원에서 일했다는 뜻이다."],["In other words, the tunnel was finished.","다시 말해, 터널이 완성되었다."]],"exercise":[["He missed the bus. ___, he was late. (그 결과)","As a result / Therefore"],["The flight was delayed ___ the storm. (~ 때문에, 명사 앞)","because of"],["그의 신발이 젖어 있다. 비를 맞고 걸었던 게 틀림없다.","His shoes are wet. He must have walked in the rain."]]},"expressions":[["at the perfect time","딱 좋은 때에","You called at the perfect time."],["ask for directions","길을 묻다","I asked a police officer for directions."],["It’s no use.","소용없다.","It’s no use crying now."],["too good to be true","너무 좋아서 믿기 어려운","That deal sounds too good to be true."]],"speaking":{"retell":["Mr. Wilson – red hair – shop – cheap assistant","advertisement – Red-Headed League – £4 a week","copy the encyclopedia – 10 to 2","League closed – went to Holmes","Holmes: ground, knees, the bank behind the shop","waited in the bank basement – caught John Clay","Holmes explains"],"discuss":["Which clue was the most important? Explain step by step.","Have you ever seen an offer that was “too good to be true”? (스팸, 사기 문자 등)","Which is more important for a detective: observation or imagination?"],"model":["Which clue was the most important?","I think the most important clue was the assistant’s half pay. A smart young man doesn’t work for half pay without a reason. Therefore, he must have wanted something from the shop. His trips to the basement and his dirty knees showed that he was digging. And the bank behind the shop showed where the tunnel went. In other words, each clue was small, but together they told the whole story."],"roleplay":"A: 홈스 / B: 왓슨. 왓슨이 질문하고, 홈스가 논리 연결어(because, therefore, which means, must have)로 사건을 설명해 보세요."},"writing":{"task":"4개월 차 마무리 — 탐정 보고서 쓰기 (논리 연결어 4개 이상, must have 2번 이상, 170~200단어)","hints":["1. The Case (사건 요약)","2. The Clues (단서 3개)","3. The Reasoning (추리)","4. The Result (결과)"],"model":["CASE REPORT: The Red-Headed League — by Sherlock Holmes","1. The Case: Mr. Wilson, a shop owner, got a job at the Red-Headed League. He copied the encyclopedia every day for four pounds a week. After eight weeks, the League suddenly closed.","2. The Clues: First, his assistant worked for half pay. Second, the assistant spent many hours in the basement. Third, the knees of his pants were dirty and worn.","3. The Reasoning: The job was easy, but the pay was high. Therefore, its only purpose must have been to keep Mr. Wilson away from his shop. Since the assistant had shown him the advertisement, he must have planned it. His dirty knees showed that he had been digging. When I found the bank behind the shop, I knew where the tunnel went. The League had closed, which means the tunnel was finished.","4. The Result: On Saturday night, we waited in the bank’s basement. At about one o’clock, John Clay came up through the floor, and the police caught him. The gold is safe."]},"quote":["“It is quite a three-pipe problem.” (Arthur Conan Doyle)","“이건 파이프 담배 세 대는 피워야 할 문제로군.” (깊이 생각해야 하는 어려운 문제)"]}],"review":{"vocab":[["treasure","보물"],["give up","포기하다"],["masterpiece","걸작"],["pneumonia","폐렴"],["borrow","빌리다"],["debt","빚"],["fake","가짜의"],["clue","단서"],["criminal","범죄자"],["salary","급여"]],"grammar":[["If she ___ (tell) the truth, she wouldn’t have suffered.","had told"],["I ___ have called you. (했어야 했는데)","should"],["It was her pride ___ ruined her life.","that"],["___ she wanted was a rich life.","What"],["His knees were dirty. ___, he must have been digging. (그러므로)","Therefore"]],"project":{"title":"4개월 차 프로젝트 — 반전 결말 비교","steps":["「크리스마스 선물」과 「목걸이」의 결말을 비교하세요.","공통점 2가지 (희생, 가난, 반전 등)","차이점 2가지 (사랑 vs 체면, 따뜻함 vs 씁쓸함)","어떤 결말이 더 인상적인지와 이유","200단어로 쓰고 2분 동안 발표하며 녹음하세요."]}}},{"month":5,"title":"성장소설 — 인물의 마음을 읽다","level":"B1+ (지문 690~820단어)","intro":"다섯 번째 달에는 주인공이 변하고 성장하는 고전 소설을 읽습니다. 빨강 머리 앤, 비밀의 화원, 작은 아씨들, 크리스마스 캐럴은 인물의 감정이 풍부하게 그려진 작품이에요. 감정을 표현하는 형용사, 사역동사, 비교·대조 표현, 조건 표현을 익히고 인물에 대한 내 생각을 말하고 씁니다.","skill":"읽기 전략: 인물의 감정이 바뀌는 단어에 표시하며 읽고, 읽은 뒤 감정의 변화를 화살표로 정리해 보세요. (예: lonely → curious → happy)","units":[{"week":17,"title":"빨강 머리 앤","en":"Anne of Green Gables","author":"L. M. Montgomery (L. M. 몽고메리)","year":"1908","genre":"성장소설 (Coming-of-age Novel)","intro":"캐나다 작가 몽고메리의 소설입니다. 남자아이를 입양하려던 매슈와 마릴라 남매에게 실수로 빨강 머리 고아 소녀 앤이 오게 됩니다. 상상력과 수다로 가득한 앤이 초록 지붕 집의 사랑받는 가족이 되어 가는 이야기예요.","characters":[["Anne Shirley (앤 셜리)","상상력이 풍부하고 말이 많은 11살 고아 소녀"],["Matthew (매슈)","수줍음이 많고 다정한 할아버지"],["Marilla (마릴라)","엄격하지만 속정 깊은 매슈의 여동생"],["Diana (다이애나)","앤의 가장 친한 친구"]],"warmup":[["Were you a talkative child or a quiet child?","어릴 때 말이 많았나요, 조용했나요?"],["How important is imagination in life?","삶에서 상상력은 얼마나 중요할까요?"]],"vocab":[["orphan","고아","Anne was an orphan."],["adopt","입양하다","They wanted to adopt a boy."],["farm","농장","They needed help on the farm."],["station","역","Matthew drove to the station."],["freckles","주근깨","Her face was covered with freckles."],["braid","땋은 머리","Her hair was in two braids."],["imagination","상상력","Anne had a wonderful imagination."],["talkative","말이 많은","She was very talkative."],["mistake","실수","There was a mistake."],["disappointed","실망한","Marilla was disappointed."],["burst into tears","울음을 터뜨리다","Anne burst into tears."],["spell","철자를 쓰다","Anne with an E — that’s how I spell it."],["keep","(곁에) 두다, 키우다","We should keep her."],["temper","성질, 화","Anne had a quick temper."],["strict","엄격한","Marilla was strict."]],"story":["Matthew Cuthbert and his sister, Marilla, lived at Green Gables, a farmhouse on Prince Edward Island in Canada. Matthew was sixty years old and very shy. He was afraid of almost all women, except Marilla. Because Matthew was getting older, they decided to adopt a boy from an orphan home to help on the farm.","On the day the boy was supposed to arrive, Matthew drove to the train station. But the only child waiting there was a girl of about eleven. She was wearing a very short, very tight, very ugly dress. Her hair was bright red and in two long braids. Her face was small, thin, and covered with freckles, and she had big eyes that looked green in some light and gray in other light.","When she saw Matthew, she stood up and held out her thin hand. “Are you Mr. Matthew Cuthbert of Green Gables? I’m so glad to see you. I was afraid you weren’t coming. I decided that if you didn’t come tonight, I would climb that big cherry tree and sleep in it. It would be lovely to sleep in a cherry tree in the moonlight, don’t you think?”","Matthew didn’t know what to do. Clearly, there had been a mistake. But he couldn’t tell this girl with the shining eyes that she was not wanted. He decided to take her home and let Marilla tell her. On the drive home, the girl talked and talked. “Isn’t the world wonderful? There are so many things to imagine! Am I talking too much? People always tell me I do. Would you like me to stop?” Matthew, to his own surprise, was enjoying it. “Oh, you can talk as much as you like. I don’t mind.”","When they drove under a long row of apple trees covered with white flowers, the girl became silent. Her eyes were shining. “What do you call this place?” “Well, the Avenue,” said Matthew. “The Avenue? That’s not a nice name. I will call it the White Way of Delight. It’s the most beautiful thing I have ever seen.”","At Green Gables, Marilla came to the door. “Matthew, who’s that? Where is the boy?” “There wasn’t any boy,” said Matthew. “There was only her.” The girl understood immediately. “You don’t want me!” she cried. “You don’t want me because I’m not a boy! Nobody ever wanted me. Oh, I’m going to burst into tears!” And she did. She sat down at the table, put her face in her arms, and cried and cried.","“Well, well, don’t cry so much,” said Marilla, not knowing what else to say. “What’s your name?” The girl stopped crying. “Will you please call me Cordelia?” “Is that your name?” “No, but I would love to be called Cordelia. It’s such an elegant name.” “Then what is your real name?” “Anne Shirley,” said the girl. “But please call me Anne with an E. It looks so much nicer than A-N-N.”","That night, Anne cried herself to sleep. The next morning, Marilla planned to send her back. But Matthew, who rarely gave his opinion, said quietly, “She’s a really interesting little thing, Marilla. It seems a shame to send her back when she wants to stay so much.” Then Marilla learned that the other choice was a cold, unkind woman who wanted Anne only as a servant. Marilla made a decision that surprised even herself. “Well, Matthew,” she said, “I think we will keep her.”","Life with Anne was never boring. She talked to flowers and trees and gave romantic names to every lake and road. She also made many mistakes. When a boy named Gilbert called her “Carrots” because of her red hair, she hit him on the head with her writing board. She once dyed her red hair green by accident. But she also worked hard, studied very well, and filled the quiet old house with laughter. After one terrible day, she said to Marilla, “Tomorrow is a new day with no mistakes in it yet.” And slowly, without even noticing it, strict old Marilla came to love Anne as her own daughter."],"ko":["매슈 커스버트와 그의 여동생 마릴라는 캐나다 프린스에드워드섬의 농가인 초록 지붕 집에 살았다. 매슈는 예순 살이었고 몹시 수줍음이 많았다. 그는 마릴라를 빼고는 거의 모든 여자를 어려워했다. 매슈가 나이가 들어 가자, 남매는 농장 일을 도울 남자아이를 고아원에서 입양하기로 했다.","아이가 도착하기로 한 날, 매슈는 마차를 몰고 기차역에 갔다. 하지만 거기서 기다리는 아이는 열한 살쯤 된 여자아이 하나뿐이었다. 아이는 아주 짧고, 아주 꽉 끼고, 아주 볼품없는 원피스를 입고 있었다. 머리는 새빨간 색이었고 두 갈래로 길게 땋아져 있었다. 얼굴은 작고 마른 데다 주근깨로 덮여 있었고, 눈은 커서 어떤 빛에서는 초록색으로, 다른 빛에서는 회색으로 보였다.","매슈를 보자 아이는 일어나 가느다란 손을 내밀었다. “초록 지붕 집의 매슈 커스버트 아저씨세요? 만나서 정말 반가워요. 안 오실까 봐 걱정했어요. 오늘 밤 안 오시면 저기 큰 벚나무에 올라가서 자기로 마음먹었거든요. 달빛 아래 벚나무에서 자면 정말 멋질 거예요. 그렇지 않아요?”","매슈는 어떻게 해야 할지 몰랐다. 분명 무언가 잘못된 것이었다. 하지만 눈을 반짝이는 이 아이에게 아무도 너를 원하지 않는다고 말할 수가 없었다. 그는 아이를 집에 데려가서 마릴라가 말하게 하기로 했다. 집으로 가는 길에 아이는 쉬지 않고 이야기했다. “세상은 정말 멋지지 않아요? 상상할 게 정말 많아요! 제가 말을 너무 많이 하나요? 사람들이 늘 그렇다고 해요. 그만할까요?” 매슈는 스스로도 놀랍게 그 시간이 즐거웠다. “아, 하고 싶은 만큼 이야기하렴. 난 괜찮단다.”","하얀 꽃으로 덮인 사과나무가 길게 늘어선 길 아래를 지나가자, 아이는 조용해졌다. 아이의 눈이 반짝이고 있었다. “이곳을 뭐라고 불러요?” “글쎄, 가로수길이라고 하지.” 매슈가 말했다. “가로수길이요? 별로 예쁜 이름이 아니에요. 저는 ‘기쁨의 하얀 길’이라고 부를래요. 지금까지 본 것 중에 제일 아름다워요.”","초록 지붕 집에 도착하자 마릴라가 문으로 나왔다. “오라버니, 저 애는 누구예요? 남자아이는요?” “남자아이는 없었어.” 매슈가 말했다. “이 애뿐이었어.” 아이는 곧바로 알아들었다. “저를 원하지 않으시는군요!” 아이가 외쳤다. “제가 남자애가 아니라서 저를 원하지 않으시는 거예요! 아무도 저를 원한 적이 없어요. 아, 울음이 터질 것 같아요!” 그리고 정말 그랬다. 아이는 식탁에 앉아 팔에 얼굴을 묻고 울고 또 울었다.","“자, 자, 그렇게 울지 마라.” 마릴라는 달리 뭐라고 해야 할지 몰라 이렇게 말했다. “이름이 뭐니?” 아이는 울음을 그쳤다. “저를 코델리아라고 불러 주시겠어요?” “그게 네 이름이니?” “아니요, 하지만 코델리아라고 불리고 싶어요. 정말 우아한 이름이잖아요.” “그럼 진짜 이름은 뭐니?” “앤 셜리요.” 아이가 말했다. “하지만 E가 붙은 앤(Anne)이라고 불러 주세요. A-N-N보다 훨씬 예뻐 보이거든요.”","그날 밤 앤은 울다가 잠이 들었다. 다음 날 아침, 마릴라는 앤을 돌려보낼 계획이었다. 하지만 좀처럼 자기 의견을 말하지 않는 매슈가 조용히 말했다. “정말 재미있는 아이야, 마릴라. 저렇게 여기 있고 싶어 하는데 돌려보내는 건 안타까운 것 같구나.” 그때 마릴라는 앤이 갈 수 있는 다른 곳이 앤을 하녀로만 부리려는 차갑고 불친절한 여자의 집이라는 것을 알게 되었다. 마릴라는 자기 자신도 놀랄 결정을 내렸다. “그래요, 오라버니.” 그녀가 말했다. “이 아이를 키우기로 해요.”","앤과 함께하는 생활은 결코 지루하지 않았다. 앤은 꽃과 나무에게 말을 걸었고, 모든 호수와 길에 낭만적인 이름을 붙였다. 실수도 많이 했다. 길버트라는 남자아이가 빨간 머리 때문에 앤을 “홍당무”라고 부르자, 앤은 석판으로 그의 머리를 내리쳤다. 한번은 실수로 빨간 머리를 초록색으로 염색하기도 했다. 하지만 앤은 열심히 일하고 공부도 아주 잘했으며, 조용한 옛집을 웃음으로 가득 채웠다. 아주 끔찍했던 어느 날이 지난 뒤, 앤은 마릴라에게 말했다. “내일은 아직 아무 실수도 하지 않은 새로운 날이에요.” 그리고 천천히, 스스로도 알아차리지 못하는 사이에, 엄격한 마릴라는 앤을 친딸처럼 사랑하게 되었다."],"gloss":[["be supposed to ~","~하기로 되어 있다"],["hold out","내밀다"],["moonlight","달빛"],["row","줄, 열"],["delight","기쁨"],["elegant","우아한"],["It seems a shame","안타까운 것 같다"],["dye","염색하다"]],"keySentences":[["On the day the boy was supposed to arrive, …","be supposed to ~ = ~하기로 되어 있다"],["He couldn’t tell this girl… that she was not wanted.","was not wanted = 원해지지 않았다 (수동태). 앤의 가장 큰 상처를 표현"],["Matthew, to his own surprise, was enjoying it.","to one’s surprise (4주차 복습) — 수줍은 매슈가 대화를 즐기는 것이 놀라운 변화"],["Tomorrow is a new day with no mistakes in it yet.","원작의 유명한 대사: “내일은 아직 아무 실수도 없는 새로운 날이에요.”"]],"tf":[["Matthew and Marilla wanted to adopt a girl.","F — 농장 일을 도울 남자아이를 원했다."],["Anne wanted to be called Cordelia.","T"],["Marilla decided to keep Anne right away.","F — 처음엔 돌려보내려 했다."],["Anne once dyed her hair green by accident.","T"]],"questions":[["Why did Matthew and Marilla want to adopt a boy?","Because Matthew was getting older, and they needed help on the farm."],["What did Anne plan to do if nobody came?","She planned to climb a cherry tree and sleep in it."],["Why did Marilla finally decide to keep Anne?","Matthew wanted her to stay, and the other choice was an unkind woman who wanted a servant."],["How did Marilla change because of Anne?","(예) She became warmer and came to love Anne like her own daughter."]],"listening":{"shadow":"4","dictation":[["On the day the boy was ___ to arrive, Matthew drove to the train station.","supposed"],["Her face was small, thin, and covered with ___, and she had big eyes that looked green in some light and gray in other light.","freckles"],["“Oh, you can talk as much as you ___.","like"],["I’m going to ___ into tears!","burst"],["Tomorrow is a new day with no ___ in it yet.","mistakes"]]},"grammar":{"title":"감정 형용사 -ed / -ing + so / such","explain":["-ed: 사람이 “느끼는” 감정 → Marilla was surprised. (마릴라가 놀람)","-ing: 감정을 “일으키는” 원인 → Anne’s story was surprising. (이야기가 놀라움을 줌)","so + 형용사 → It’s so elegant. / such + (a/an) + 형용사 + 명사 → It’s such an elegant name.","interested / interesting, bored / boring, excited / exciting, tired / tiring 처럼 짝으로 외우세요."],"examples":[["Matthew was surprised by Anne’s long speech.","매슈는 앤의 긴 이야기에 놀랐다."],["Life with Anne was never boring.","앤과의 생활은 결코 지루하지 않았다."],["I’m interested in Canadian history.","나는 캐나다 역사에 관심이 있다."],["It was such a lovely evening.","정말 아름다운 저녁이었다."]],"exercise":[["The movie was (bored / boring), so I fell asleep.","boring"],["I was (exciting / excited) about the trip.","excited"],["She has ___ a beautiful voice. (so / such)","such"]]},"expressions":[["be supposed to ~","~하기로 되어 있다","The meeting is supposed to start at 3."],["as much as you like","원하는 만큼","Eat as much as you like."],["burst into tears","울음을 터뜨리다","She burst into tears when she heard the news."],["come to + 동사","(점점) ~하게 되다","I came to love this city."]],"speaking":{"retell":["Matthew & Marilla – wanted a boy","station – a red-haired girl","drive home – talked and talked","“You don’t want me because I’m not a boy!”","“Call me Cordelia” – Anne with an E","Matthew wants her to stay – Marilla agrees","mistakes and laughter – Marilla came to love her"],"discuss":["Anne says imagination makes life interesting. Do you agree?","What does “a new day with no mistakes in it yet” teach us?","Who was your best friend when you were a child?"],"model":["What does “a new day with no mistakes” teach us?","I love this line because it shows a healthy way to deal with mistakes. Anne makes terrible mistakes, but she doesn’t stay sad. She believes every morning is a fresh start. I often think about my mistakes at night and feel worse. Anne’s idea is very wise: learn from yesterday, but don’t live in it."],"roleplay":"A: 앤 / B: 마릴라. 앤이 머리를 초록색으로 염색한 실수를 고백하고, 마릴라는 처음엔 혼내다가 결국 위로해 보세요."},"writing":{"task":"인물 묘사: 매슈의 눈으로 처음 본 앤의 외모와 성격 묘사하기 (-ed / -ing 형용사 4개 이상, 150~170단어)","hints":["외모: 머리, 얼굴, 눈, 옷","말투와 행동 → 성격","매슈의 감정 변화: embarrassed → amused → delighted"],"model":["When I first saw her at the station, I was really surprised. I had expected a strong farm boy, but a thin little girl was sitting there. Her dress was too short and too tight, and her hat was old. Two thick braids of bright red hair hung down her back. Her face was covered with freckles, but her big eyes were the most amazing thing about her.","I was so embarrassed. I don’t know how to talk to girls, so I said almost nothing. But she didn’t need me to talk! At first, her endless questions were confusing. But after a while, I found her stories amusing, and then truly delightful.","When we passed under the apple trees, she suddenly became silent, and I saw happy tears in her eyes. At that moment, I understood that she wasn’t only talkative. She had a deep, sensitive heart. I knew I couldn’t send her away."]},"quote":["“Tomorrow is a new day with no mistakes in it yet.” (L. M. Montgomery)","내일은 아직 아무 실수도 없는 새로운 날이에요."]},{"week":18,"title":"비밀의 화원","en":"The Secret Garden","author":"Frances Hodgson Burnett (프랜시스 호지슨 버넷)","year":"1911","genre":"성장소설 (Coming-of-age Novel)","intro":"인도에서 부모를 잃고 영국의 큰 저택에 온 외롭고 버릇없는 소녀 메리가 10년 동안 잠겨 있던 비밀의 정원을 발견합니다. 정원을 가꾸며 메리와 몸이 약한 사촌 콜린이 함께 건강을 되찾아 가는 “자연과 치유”의 이야기예요.","characters":[["Mary Lennox (메리 레녹스)","인도에서 온 고집 세고 외로운 10살 소녀"],["Colin (콜린)","자신이 곧 죽을 거라 믿는 몸이 약한 사촌"],["Dickon (디콘)","동물과 친한 순박한 시골 소년"],["Mr. Craven (크레이븐 씨)","아내를 잃은 슬픔에 집을 떠나 사는 메리의 고모부"],["The robin (울새)","메리를 열쇠로 이끄는 작은 새"]],"warmup":[["Do you feel better when you spend time in nature?","자연 속에 있으면 기분이 나아지나요?"],["Have you ever grown a plant or taken care of an animal?","식물이나 동물을 돌본 적 있나요?"]],"vocab":[["spoiled","버릇없는","Mary was a spoiled child."],["lonely","외로운","She was lonely in the big house."],["uncle","삼촌, 고모부","She went to live with her uncle."],["lock","잠그다","The garden was locked."],["bury","묻다","He buried the key."],["robin","울새","A robin showed her the key."],["key","열쇠","She found an old key."],["door","문","The door was hidden behind the plants."],["dig","파다 (dug)","She began to dig."],["seed","씨앗","They planted seeds."],["alive","살아 있는","The garden is still alive!"],["wheelchair","휠체어","Colin sat in a wheelchair."],["strong","튼튼한","He grew stronger every day."],["stand up","일어서다","Colin stood up on his own."],["magic","마법","Colin believed in the garden’s magic."]],"story":["When Mary Lennox came to live with her uncle in England, everyone said she was the most unpleasant child they had ever seen. She had a thin face, a thin body, and an angry expression. In India, her parents had never paid attention to her. They had left her with servants, who gave her everything she wanted so that she wouldn’t scream. By the age of ten, she was spoiled and selfish. Then a terrible sickness killed her parents, and she was sent to England.","Her uncle, Mr. Craven, lived in a huge old house with nearly a hundred rooms, but most of them were locked. Since his wife’s death ten years ago, he had been very sad, and he traveled most of the time. Mary had nobody to play with and nothing to do. Martha, a cheerful young maid, told her to play outside. “There’s a garden that’s locked,” Martha said. “Nobody has been inside for ten years. It was Mrs. Craven’s garden. When she died, Mr. Craven locked the door and buried the key.”","For the first time in her life, Mary was curious. Every day, she walked around the gardens in the cold wind. Without noticing it, she became stronger and hungrier. She made friends with a little robin with a red chest that seemed to follow her. One day, the robin jumped onto a pile of earth. Mary looked down and saw an old, rusty ring. It was a key! “Maybe it has been buried for ten years,” she whispered. “Maybe it is the key to the garden!”","A few days later, the wind moved the thick plants on the wall, and Mary saw a door handle. Her heart beat fast. She put in the key, turned it with both hands, and slowly pushed the door open. She was inside the secret garden!","It was the most mysterious place she had ever seen. The walls were covered with old roses, but everything was gray and brown. “How quiet it is!” she whispered. “I am the first person who has spoken here in ten years.” Then she saw some tiny green points coming out of the black earth. “It isn’t a dead garden,” she said softly. “There are things that are still alive!” She found a stick and began to dig and pull out the weeds around the little green points.","Soon Mary met Dickon, Martha’s twelve-year-old brother. Wild animals seemed to trust him, and Mary trusted him, too. She showed him the secret garden. Dickon cut a small gray branch with his knife. “Look, there’s green inside,” he said. “It’s alive.” Together, they cleaned the garden and planted seeds. Mary’s face became rosy, and her body grew strong.","One stormy night, Mary heard someone crying in the house. She followed the sound and found a boy in a big bed. He had a thin, pale face and very large eyes. He was her cousin, Colin. He had been sick all his life, and everyone, including Colin himself, believed he would die young. The servants did everything he said, and when he didn’t get what he wanted, he screamed and cried.","But Mary was just as stubborn as Colin, and she wasn’t afraid of him. One night, when he was screaming, she ran into his room. “Stop it!” she shouted. “Everyone is tired of you!” Colin believed his back was growing crooked. Mary looked at it carefully. “There’s nothing wrong with your back!” she said. Nobody had ever spoken to Colin like that before. For the first time, he began to believe that he might not die.","In spring, Mary and Dickon took Colin to the secret garden in his wheelchair. Now everything was green. Roses were starting to bloom, and birds were building nests. Colin looked around in wonder. “I will get well!” he cried. “I will live forever!” Every day in the sunshine, he became stronger. He believed the garden had magic in it. One day, when the old gardener called him “a poor sick boy,” Colin was so angry that he stood up out of his wheelchair — and stood on his own two feet!","Far away in Europe, Mr. Craven had a strange dream. In it, his dead wife’s voice called him: “In the garden.” He hurried home and went to the garden door. He heard running feet and laughter. Suddenly, the door opened, and a tall, handsome boy ran out and almost fell into his arms. It was Colin! “Father,” he said, “I’m Colin. You can’t believe it, can you? It was the garden that did it — and Mary and Dickon and the magic. I’m going to live forever!” That afternoon, Mr. Craven walked back to the house with his son walking proudly beside him."],"ko":["메리 레녹스가 영국의 고모부 댁에 살러 왔을 때, 모두들 지금까지 본 아이 중 가장 정이 안 가는 아이라고 말했다. 메리는 얼굴도 몸도 말랐고 늘 화난 표정이었다. 인도에서 메리의 부모는 메리에게 전혀 관심을 주지 않았다. 부모는 메리를 하인들에게 맡겼고, 하인들은 메리가 소리 지르지 않도록 원하는 것을 다 주었다. 열 살이 되었을 때 메리는 버릇없고 이기적인 아이가 되어 있었다. 그러다 무서운 전염병으로 부모가 세상을 떠났고, 메리는 영국으로 보내졌다.","고모부 크레이븐 씨는 방이 거의 백 개나 되는 크고 오래된 저택에 살았는데, 대부분의 방은 잠겨 있었다. 10년 전 아내가 죽은 뒤로 그는 몹시 슬퍼했고, 대부분의 시간을 여행하며 보냈다. 메리는 함께 놀 사람도, 할 일도 없었다. 쾌활한 젊은 하녀 마사는 메리에게 밖에 나가 놀라고 했다. “잠겨 있는 정원이 하나 있어요.” 마사가 말했다. “10년 동안 아무도 들어가지 않았죠. 크레이븐 부인의 정원이었어요. 부인이 돌아가셨을 때 크레이븐 씨가 문을 잠그고 열쇠를 땅에 묻어 버렸대요.”","메리는 태어나서 처음으로 호기심이 생겼다. 매일 메리는 찬바람 속에서 정원 곳곳을 걸었다. 자기도 모르는 사이에 메리는 더 튼튼해지고 더 배가 고파졌다. 메리는 자기를 따라다니는 것 같은 가슴이 빨간 작은 울새와 친구가 되었다. 어느 날, 울새가 흙더미 위로 뛰어올랐다. 메리가 내려다보니 낡고 녹슨 고리가 보였다. 열쇠였다! “어쩌면 10년 동안 묻혀 있었을지도 몰라.” 메리가 속삭였다. “어쩌면 그 정원 열쇠일지도 몰라!”","며칠 뒤, 바람에 벽을 덮은 무성한 덩굴이 흔들리자 메리는 문손잡이를 보았다. 심장이 빠르게 뛰었다. 메리는 열쇠를 넣고 두 손으로 돌린 다음, 천천히 문을 밀어 열었다. 메리는 비밀의 정원 안에 들어와 있었다!","그곳은 메리가 지금까지 본 곳 중 가장 신비로운 곳이었다. 벽은 오래된 장미 덩굴로 덮여 있었지만, 모든 것이 회색과 갈색이었다. “정말 조용하구나!” 메리가 속삭였다. “10년 만에 여기서 말을 한 사람은 내가 처음이야.” 그때 검은 흙을 뚫고 나오는 작은 초록색 싹들이 보였다. “죽은 정원이 아니야.” 메리가 부드럽게 말했다. “아직 살아 있는 것들이 있어!” 메리는 막대기를 찾아서 작은 초록 싹 주변의 흙을 파고 잡초를 뽑기 시작했다.","곧 메리는 마사의 열두 살 남동생 디콘을 만났다. 야생동물들은 디콘을 믿는 것 같았고, 메리도 그를 믿게 되었다. 메리는 그에게 비밀의 정원을 보여 주었다. 디콘은 칼로 작은 회색 가지를 잘라 보았다. “봐, 안에 초록색이 있어.” 그가 말했다. “살아 있는 거야.” 둘은 함께 정원을 청소하고 씨앗을 심었다. 메리의 얼굴은 발그레해졌고, 몸도 튼튼해졌다.","폭풍이 몰아치던 어느 밤, 메리는 집 안 어딘가에서 누군가 우는 소리를 들었다. 소리를 따라가 보니 커다란 침대에 한 소년이 있었다. 소년은 마르고 창백한 얼굴에 아주 큰 눈을 가지고 있었다. 그는 메리의 사촌 콜린이었다. 콜린은 태어나서 계속 아팠고, 콜린 자신을 포함해 모두가 그가 일찍 죽을 거라고 믿었다. 하인들은 콜린이 시키는 대로 다 했고, 원하는 걸 얻지 못하면 콜린은 소리 지르며 울었다.","하지만 메리도 콜린만큼 고집이 셌고, 콜린을 무서워하지 않았다. 어느 날 밤, 콜린이 소리를 지르고 있을 때 메리가 방으로 뛰어 들어갔다. “그만해!” 메리가 소리쳤다. “다들 너 때문에 지쳤어!” 콜린은 자기 등이 굽어 가고 있다고 믿고 있었다. 메리는 그의 등을 자세히 보았다. “네 등은 아무 이상 없어!” 메리가 말했다. 지금까지 콜린에게 그렇게 말한 사람은 아무도 없었다. 처음으로 콜린은 자신이 죽지 않을 수도 있다고 믿기 시작했다.","봄이 되자 메리와 디콘은 콜린을 휠체어에 태워 비밀의 정원에 데려갔다. 이제 모든 것이 초록색이었다. 장미가 피기 시작했고, 새들은 둥지를 짓고 있었다. 콜린은 놀라워하며 주위를 둘러보았다. “나는 나을 거야!” 그가 외쳤다. “영원히 살 거야!” 매일 햇살 속에서 콜린은 점점 튼튼해졌다. 그는 정원에 마법이 있다고 믿었다. 어느 날, 늙은 정원사가 그를 “불쌍한 아픈 아이”라고 부르자, 콜린은 너무 화가 나서 휠체어에서 일어섰다. 자기 두 발로 선 것이다!","멀리 유럽에 있던 크레이븐 씨는 이상한 꿈을 꾸었다. 꿈속에서 죽은 아내의 목소리가 그를 불렀다. “정원에서요.” 그는 서둘러 집으로 돌아와 정원 문으로 갔다. 뛰어다니는 발소리와 웃음소리가 들렸다. 갑자기 문이 열리더니, 키 크고 잘생긴 소년이 달려 나와 그의 품에 안길 뻔했다. 콜린이었다! “아버지,” 그가 말했다. “저 콜린이에요. 믿기지 않으시죠? 이렇게 만든 건 바로 정원이에요. 그리고 메리와 디콘과 마법이요. 저는 영원히 살 거예요!” 그날 오후, 크레이븐 씨는 당당하게 옆에서 걷는 아들과 함께 집으로 걸어 돌아갔다."],"gloss":[["unpleasant","불쾌한, 정이 안 가는"],["expression","표정"],["maid","하녀"],["rusty","녹슨"],["handle","손잡이"],["weed","잡초"],["stubborn","고집 센"],["crooked","굽은"],["in wonder","놀라워하며"]],"keySentences":[["…who gave her everything she wanted so that she wouldn’t scream.","so that + 주어 + would ~ = ~하도록, ~하기 위해서"],["I am the first person who has spoken here in ten years.","the first person who has p.p. = ~한 첫 번째 사람"],["Nobody had ever spoken to Colin like that before.","과거완료 + ever: 그때까지 한 번도 없었던 일"],["It was the garden that did it.","It was ~ that 강조 구문 (15주차 복습): “그렇게 만든 건 바로 정원이었다”"]],"tf":[["Mary’s parents took good care of her in India.","F — 전혀 관심을 주지 않았다."],["A robin helped Mary find the key.","T"],["Colin was a healthy boy.","F — 평생 아팠고 일찍 죽을 거라 믿었다."],["Mr. Craven came home because of a dream.","T"]],"questions":[["Why was the garden locked?","Mrs. Craven died, and Mr. Craven locked it and buried the key."],["How did Mary change after she started going outside?","She became stronger, hungrier, healthier, and happier."],["Why was Mary’s shouting good for Colin?","Nobody had been honest with him. She showed him his back was fine, so he began to hope."],["What does the garden mean in this story?","(예) It means healing and new life. As the garden comes alive, the children come alive too."]],"listening":{"shadow":"5","dictation":[["By the age of ten, she was spoiled and ___.","selfish"],["For the first time in her life, Mary was ___.","curious"],["There are things that are still ___!","alive"],["Mary was just as ___ as Colin.","stubborn"],["It was the garden that ___ it.","did"]]},"grammar":{"title":"사역동사 make / let / get + 변화 동사 become / grow / get","explain":["make + 사람 + 동사원형: ~하게 만들다 → The garden made Colin feel alive.","let + 사람 + 동사원형: ~하게 허락하다 → Mary let Dickon see the garden.","get + 사람 + to 동사: (설득해서) ~하게 하다 → Mary got Colin to go outside.","변화: become / grow / get + 형용사 → Her face became rosy. / He grew stronger. / It got colder."],"examples":[["The fresh air made her hungry.","신선한 공기가 그녀를 배고프게 만들었다."],["Mr. Craven didn’t let anyone enter the garden.","크레이븐 씨는 아무도 정원에 들어가지 못하게 했다."],["I got my brother to help me.","나는 동생을 설득해 나를 돕게 했다."],["Day by day, Colin grew stronger.","날마다 콜린은 더 튼튼해졌다."]],"exercise":[["엄마는 내가 밤늦게 나가지 못하게 했다. (let)","My mother didn’t let me go out late at night."],["그 영화는 나를 울게 만들었다.","The movie made me cry."],["나는 그를 설득해 같이 가게 했다. (get)","I got him to come with me."]]},"expressions":[["pay attention to ~","~에 관심을 기울이다","Nobody paid attention to her."],["make friends with ~","~와 친구가 되다","She made friends with a robin."],["be tired of ~","~에 지치다, 질리다","I’m tired of waiting."],["on one’s own","혼자 힘으로","He stood up on his own."]],"speaking":{"retell":["Mary – spoiled, lonely – came to England","big house – locked garden – buried key","robin – key – door behind the plants","secret garden – green points – Dickon","crying at night – Colin","Mary shouted – Colin began to hope","spring – Colin stood up – Mr. Craven came home"],"discuss":["How did nature change Mary and Colin?","Whose fault was it that Mary and Colin were spoiled?","Do people today need a “secret garden”? What is yours?"],"model":["Do people today need a “secret garden”?","Definitely. Many people live in cities and look at screens all day, so they feel tired, a little like Colin in his dark room. A secret garden doesn’t have to be a real garden. It can be a hobby, a walking path, or a quiet café. For me, it’s the small park near my house. When I walk there in the morning, I feel calm, just like Mary."],"roleplay":"A: 짜증을 내는 콜린 / B: 메리. 메리는 콜린을 정원에 데려가려고 설득해 보세요. (make / let / get 사용)"},"writing":{"task":"변화 에세이: “How the Garden Changed Them” — 메리와 콜린의 Before → After (사역동사 2개, 변화 동사 3개 이상, 170~200단어)","hints":["처음: 정원이 두 아이를 바꾸었다","Mary: 외모, 성격, 습관","Colin: 몸, 마음, 아버지와의 관계","마지막: 변화의 진짜 이유는?"],"model":["In The Secret Garden, a forgotten garden brings two lonely children back to life.","At the beginning, Mary is thin, pale, and unpleasant. Nobody has loved her, so she doesn’t know how to love others. But the cold wind makes her hungry, and working in the garden makes her body strong. Slowly, she becomes cheerful and kind. She learns to care about Dickon, the robin, and even her difficult cousin.","Colin’s change is even bigger. At first, he lies in a dark room and believes he will die. But Mary gets him to visit the garden, and the sunshine makes him feel hopeful. Day by day, he grows stronger, and finally he stands on his own feet. He also wins back his father’s love.","People say the “magic” of the garden changed them. But I think the real magic was friendship and hope. The garden gave them a reason to go outside, and they healed each other."]},"quote":["“If you look the right way, you can see that the whole world is a garden.” (Frances Hodgson Burnett)","올바르게 바라보면, 온 세상이 하나의 정원이라는 것을 알 수 있다."]},{"week":19,"title":"작은 아씨들","en":"Little Women","author":"Louisa May Alcott (루이자 메이 올컷)","year":"1868","genre":"성장소설 (Coming-of-age Novel)","intro":"미국 남북전쟁 시기, 아버지가 전쟁에 나간 동안 어머니와 함께 사는 네 자매 메그, 조, 베스, 에이미의 성장 이야기입니다. 성격이 모두 다른 자매들이 가난 속에서 꿈과 사랑, 이별을 겪으며 어른이 되어 가요. 작가 자신의 가족 이야기가 바탕이 되었습니다.","characters":[["Meg (메그, 16)","예쁘고 다정하지만 아름다운 것을 동경하는 첫째"],["Jo (조, 15)","작가를 꿈꾸는 말괄량이 둘째"],["Beth (베스, 13)","수줍고 착한, 피아노를 좋아하는 셋째"],["Amy (에이미, 12)","그림에 재능이 있는 막내"],["Marmee (마미)","지혜로운 어머니"],["Laurie (로리)","옆집의 외로운 부잣집 소년"]],"warmup":[["Do you have brothers or sisters? How are you different?","형제자매와 어떻게 다른가요?"],["Can people be happy without much money?","돈이 많지 않아도 행복할 수 있을까요?"]],"vocab":[["sister","자매","There were four sisters."],["war","전쟁","Their father was at the war."],["present","선물","There were no Christmas presents."],["breakfast","아침 식사","They gave away their breakfast."],["writer","작가","Jo wanted to be a writer."],["shy","수줍은","Beth was very shy."],["piano","피아노","Beth loved her old piano."],["neighbor","이웃","Laurie was their neighbor."],["burn","태우다","Amy burned Jo’s stories."],["angry","화난","Jo was very angry."],["ice","얼음","The ice broke."],["forgive","용서하다","The sisters forgave each other."],["sick","아픈","Beth became sick."],["marry","결혼하다","Laurie wanted to marry Jo."],["freedom","자유","Jo loved her freedom."]],"story":["“Christmas won’t be Christmas without any presents,” said Jo, lying on the rug. “It’s so terrible to be poor!” said Meg, looking at her old dress. “It isn’t fair that some girls have lots of pretty things and other girls have nothing,” said little Amy. “We have Father and Mother and each other,” said Beth quietly from her corner. The four sisters smiled at her words. Then Jo said sadly, “But we don’t have Father now, and we won’t have him for a long time.” Their father was far away, helping soldiers in the Civil War.","The four March sisters were very different. Meg, the oldest, was pretty and gentle, but she secretly wanted beautiful dresses and an elegant life. Jo, fifteen, was tall and thin. She hated acting like a “proper young lady.” She loved books, wrote stories and plays, and wanted to be a famous writer more than anything. Beth, thirteen, was so shy that she studied at home. She lived happily in her own quiet world with her old piano. Amy, the youngest, had blue eyes and golden hair. She loved drawing and cared a lot about good manners.","On Christmas morning, their mother, whom they called Marmee, came home with news. “Not far from here, there is a poor woman with a new baby and six children. They have no fire and nothing to eat. My girls, will you give them your breakfast as a Christmas present?” The girls were very hungry. For a minute, nobody spoke. Then Jo said, “I’m so glad you came before we started!” They carried their breakfast to the poor family. That morning, they ate only bread and milk, but they were happier than ever.","Next door lived a lonely rich boy named Laurie and his strict grandfather. One snowy day, Jo threw a snowball at Laurie’s window and visited him. They became best friends at once, and soon Laurie was like a brother to all four girls. Even shy Beth found the courage to play the big piano at his grandfather’s house. The old man, whose granddaughter had died, loved hearing her play, and he gave Beth a small piano of her own.","The sisters had their faults, and they had to fight them. One day, Jo and Meg went to the theater with Laurie but didn’t take Amy. To get revenge, Amy burned the only copy of the stories that Jo had written for years. Jo was so angry that she said she would never forgive her. The next day, Amy followed Jo and Laurie to skate on the river. Jo saw her but said nothing. Suddenly the thin ice broke, and Amy fell into the freezing water! Laurie and Jo pulled her out just in time. That night, Jo cried in Marmee’s arms. “It’s my terrible temper! I almost let her die.” Marmee told her a secret: “I am angry almost every day of my life, Jo, but I have learned not to show it.” Jo learned to control her temper, and the sisters forgave each other.","Then a telegram came: Father was very sick in a hospital in Washington. Marmee had to go at once, but they didn’t have enough money for the trip. Jo disappeared for hours. When she came back, she had twenty-five dollars. She had sold her long, beautiful hair. Later that night, Meg heard her crying. “Are you worried about Father?” Meg asked. “No,” said Jo. “It’s my hair!”","While Marmee was away, Beth kept visiting the poor family, and she caught a terrible fever from the baby. For days, Beth was close to death. Jo took care of her day and night. At last, the fever went down, and Beth slowly got better. But she was never as strong as before.","Years passed, and the girls grew up. Meg married a kind but poor teacher, John Brooke, and she learned that love was more important than money. Laurie fell in love with Jo and asked her to marry him. Jo loved him dearly, but only as a friend. “I don’t think I will ever marry,” she said. “I’m happy as I am, and I love my freedom too much.” Laurie was heartbroken, and Jo moved to New York to work and write.","When Beth became sick again, Jo came home to take care of her. Beth was calm and brave. In the spring, she died peacefully. Jo was very lonely, but she began to write again — this time about her own family, simply and honestly. To her surprise, people loved her book. In the end, Amy married Laurie, and Jo married Professor Bhaer, a kind German teacher who had encouraged her to write from her heart. Together they opened a school for boys. On Marmee’s sixtieth birthday, the whole family gathered under the apple trees. “Oh, my girls,” said Marmee, “I could never wish you a greater happiness than this!”"],"ko":["“선물 없는 크리스마스는 크리스마스가 아니야.” 조가 깔개 위에 누운 채 말했다. “가난한 건 정말 끔찍해!” 메그가 낡은 드레스를 내려다보며 말했다. “어떤 애들은 예쁜 물건이 많고, 어떤 애들은 하나도 없는 건 불공평해.” 꼬마 에이미가 말했다. “우리에겐 아빠와 엄마, 그리고 서로가 있잖아.” 베스가 구석에서 조용히 말했다. 네 자매는 베스의 말에 미소 지었다. 그러다 조가 슬프게 말했다. “하지만 지금 아빠는 여기 없잖아. 그리고 오랫동안 못 볼 거야.” 아버지는 멀리서 남북전쟁의 군인들을 돕고 있었다.","네 명의 마치 자매는 모두 무척 달랐다. 첫째 메그는 예쁘고 다정했지만, 속으로는 아름다운 드레스와 우아한 삶을 원했다. 열다섯 살 조는 키가 크고 말랐다. 조는 “얌전한 아가씨”처럼 행동하는 걸 싫어했다. 책을 좋아했고, 이야기와 연극 대본을 썼으며, 무엇보다 유명한 작가가 되고 싶어 했다. 열세 살 베스는 너무 수줍어서 집에서 공부했다. 베스는 낡은 피아노와 함께 자기만의 조용한 세계에서 행복하게 지냈다. 막내 에이미는 파란 눈에 금발이었다. 에이미는 그림 그리기를 좋아했고 예의범절을 무척 중요하게 여겼다.","크리스마스 아침, 자매들이 “마미”라고 부르는 어머니가 소식을 가지고 돌아왔다. “여기서 멀지 않은 곳에 갓난아기와 여섯 아이를 둔 가난한 여인이 있단다. 그 집엔 불도 없고 먹을 것도 없어. 얘들아, 너희 아침 식사를 크리스마스 선물로 그 가족에게 주지 않겠니?” 자매들은 무척 배가 고팠다. 잠시 아무도 말하지 않았다. 그러다 조가 말했다. “먹기 시작하기 전에 오셔서 정말 다행이에요!” 자매들은 아침 식사를 가난한 가족에게 가져다주었다. 그날 아침 그들은 빵과 우유만 먹었지만, 그 어느 때보다 행복했다.","옆집에는 로리라는 외로운 부잣집 소년이 엄격한 할아버지와 살고 있었다. 눈 오는 어느 날, 조는 로리의 창문에 눈뭉치를 던지고 그를 찾아갔다. 둘은 곧바로 가장 친한 친구가 되었고, 곧 로리는 네 자매 모두에게 오빠이자 남동생 같은 존재가 되었다. 수줍은 베스조차 용기를 내어 로리 할아버지 집의 커다란 피아노를 쳤다. 손녀를 잃었던 노인은 베스의 연주를 듣는 것을 무척 좋아했고, 베스에게 작은 피아노를 선물했다.","자매들에게는 저마다 단점이 있었고, 그것과 싸워야 했다. 어느 날 조와 메그는 로리와 함께 극장에 가면서 에이미를 데려가지 않았다. 복수하려고 에이미는 조가 몇 년 동안 써 온 이야기 원고, 그것도 하나뿐인 원고를 태워 버렸다. 조는 너무 화가 나서 절대 용서하지 않겠다고 했다. 다음 날, 에이미는 강으로 스케이트를 타러 가는 조와 로리를 따라갔다. 조는 에이미를 보았지만 아무 말도 하지 않았다. 갑자기 얇은 얼음이 깨졌고, 에이미가 얼음장 같은 물에 빠졌다! 로리와 조가 가까스로 에이미를 끌어냈다. 그날 밤 조는 마미의 품에서 울었다. “제 못된 성질 때문이에요! 하마터면 동생을 죽게 할 뻔했어요.” 마미는 조에게 비밀을 하나 말해 주었다. “나도 거의 매일 화가 난단다, 조. 하지만 그걸 드러내지 않는 법을 배웠지.” 조는 화를 다스리는 법을 배웠고, 자매는 서로를 용서했다.","그러다 전보가 왔다. 아버지가 워싱턴의 병원에서 몹시 아프다는 소식이었다. 마미는 당장 가야 했지만, 여비가 부족했다. 조가 몇 시간 동안 사라졌다. 돌아왔을 때 조는 25달러를 가지고 있었다. 길고 아름다운 머리카락을 판 것이다. 그날 밤 늦게 메그는 조가 우는 소리를 들었다. “아빠 걱정돼서 그래?” 메그가 물었다. “아니.” 조가 말했다. “내 머리카락 때문이야!”","마미가 집을 비운 동안, 베스는 계속 가난한 가족을 찾아갔다가 아기에게서 무서운 열병이 옮았다. 며칠 동안 베스는 죽음 가까이에 있었다. 조는 밤낮으로 베스를 간호했다. 마침내 열이 내렸고, 베스는 천천히 나아졌다. 하지만 베스는 다시는 예전만큼 건강해지지 못했다.","세월이 흘러 자매들은 어른이 되었다. 메그는 착하지만 가난한 선생님 존 브룩과 결혼했고, 사랑이 돈보다 중요하다는 것을 배웠다. 로리는 조를 사랑하게 되어 결혼해 달라고 했다. 조는 로리를 무척 아꼈지만 친구로서였다. “난 결혼을 안 할 것 같아.” 조가 말했다. “지금 이대로 행복하고, 내 자유를 너무 사랑하거든.” 로리는 가슴이 찢어졌고, 조는 일하고 글을 쓰기 위해 뉴욕으로 떠났다.","베스가 다시 아프자 조는 베스를 돌보러 집에 돌아왔다. 베스는 차분하고 용감했다. 봄에 베스는 평화롭게 세상을 떠났다. 조는 무척 외로웠지만 다시 글을 쓰기 시작했다. 이번에는 자기 가족 이야기를 소박하고 솔직하게 썼다. 놀랍게도 사람들은 그 책을 무척 좋아했다. 결국 에이미는 로리와 결혼했고, 조는 마음에서 우러나는 글을 쓰라고 격려해 준 다정한 독일인 선생님 바에르 교수와 결혼했다. 두 사람은 함께 남학생을 위한 학교를 열었다. 마미의 예순 번째 생일에, 온 가족이 사과나무 아래 모였다. “아, 내 딸들아,” 마미가 말했다. “너희에게 이보다 더 큰 행복을 바랄 수는 없겠구나!”"],"gloss":[["rug","깔개"],["fair","공평한"],["Civil War","(미국) 남북전쟁"],["proper","얌전한, 올바른"],["manners","예의범절"],["fault","단점"],["revenge","복수"],["temper","화, 성질"],["telegram","전보"],["fever","열, 열병"],["heartbroken","가슴이 찢어지는"]],"keySentences":[["…they ate only bread and milk, but they were happier than ever.","비교급 + than ever (3주차 복습) — 나누면 더 행복해진다는 주제"],["I am angry almost every day of my life, but I have learned not to show it.","learn not to ~ = ~하지 않는 법을 배우다 (to부정사의 부정은 not to)"],["I love my freedom too much.","조가 결혼을 거절하는 이유. 당시 여성에게는 흔하지 않은 생각이었어요."],["I could never wish you a greater happiness than this!","could never + 비교급 = 이보다 더 ~할 수는 없다 (최고의 행복)"]],"tf":[["The sisters’ father was at the war.","T"],["The sisters ate their Christmas breakfast as usual.","F — 가난한 가족에게 주었다."],["Jo sold her hair for Marmee’s trip.","T"],["Jo said yes when Laurie asked her to marry him.","F — 친구로만 사랑해서 거절했다."]],"questions":[["Describe each sister in one sentence.","Meg: pretty, gentle, wants an elegant life / Jo: wants to be a writer / Beth: shy, loves the piano / Amy: loves drawing and good manners"],["What did Marmee teach Jo after the ice accident?","She also feels angry almost every day, but she has learned not to show it."],["Why did Jo refuse Laurie?","She loved him only as a friend, and she loved her freedom."],["How did Beth’s death change Jo’s writing?","Jo began to write about her own family, simply and honestly, and people loved it."]],"listening":{"shadow":"5","dictation":[["It isn’t ___ that some girls have lots of pretty things.","fair"],["Beth, thirteen, was so ___ that she studied at home.","shy"],["That morning, they ate only bread and milk, but they were happier than ___.","ever"],["I have learned not to ___ it.","show"],["I love my ___ too much.","freedom"]]},"grammar":{"title":"비교와 대조 — whereas / unlike / both A and B","explain":["whereas / while + 문장: 반면에 → Meg loved dresses, whereas Jo loved books.","unlike + 명사: ~와 달리 → Unlike Amy, Beth was very shy.","On the other hand, + 문장: 반면에 (새 문장으로)","공통점: both A and B (A와 B 둘 다) / like + 명사 (~처럼) → Both Jo and Laurie loved adventure.","인물이나 작품을 비교하는 글에서 꼭 필요한 표현이에요."],"examples":[["Jo wanted to be a writer, whereas Amy wanted to be an artist.","조는 작가가 되고 싶었던 반면 에이미는 화가가 되고 싶었다."],["Unlike her sisters, Beth never left home.","언니들과 달리 베스는 집을 떠나지 않았다."],["Both Meg and Jo worked to help the family.","메그와 조 모두 가족을 돕기 위해 일했다."],["Like her mother, Jo had a quick temper.","어머니처럼 조도 쉽게 화를 냈다."]],"exercise":[["나는 커피를 좋아하는 반면 남편은 차를 좋아한다. (whereas)","I like coffee, whereas my husband likes tea."],["___ his brother, he is very quiet. (~와 달리)","Unlike"],["메그와 에이미 둘 다 예쁜 것을 좋아했다.","Both Meg and Amy loved pretty things."]]},"expressions":[["more than anything","무엇보다도","I want to travel more than anything."],["find the courage to ~","~할 용기를 내다","She found the courage to speak."],["just in time","가까스로 제때","We arrived just in time."],["fall in love with ~","~와 사랑에 빠지다","He fell in love with her."]],"speaking":{"retell":["Christmas – no presents – Father at the war","four different sisters","gave their breakfast to a poor family","Laurie – friendship – Beth’s piano","Amy burned Jo’s stories – ice – forgiveness","Jo sold her hair – Beth’s fever","grew up – Meg married, Jo said no to Laurie, Beth died, Jo wrote a book"],"discuss":["Which sister are you most like? Why?","Should Jo have married Laurie? What do you think?","Marmee says she is angry every day but doesn’t show it. Is that healthy?"],"model":["Should Jo have married Laurie?","Many readers wanted them to get married, because they had so much fun together. But I think Jo made the right choice. Both of them were wild and stubborn, so they would probably fight a lot. Unlike Laurie, Professor Bhaer understood Jo’s dream and helped her write. I think a good partner is someone who helps you grow, not only someone who is fun."],"roleplay":"A: 결혼해 달라고 하는 로리 / B: 조. 조는 상처 주지 않게 거절하고, 두 사람이 계속 친구로 지내기로 하는 대화를 만들어 보세요."},"writing":{"task":"비교·대조 에세이: 네 자매 중 두 명을 비교하기 (whereas, unlike, both 를 각각 1번 이상, 180~200단어)","hints":["처음: 두 인물 소개","차이점: 성격, 꿈, 행동","공통점","마지막: 내가 더 공감하는 인물과 이유"],"model":["Jo and Amy March are sisters, but at first they seem very different.","Jo is a tomboy who hates dresses and polite parties, whereas Amy cares a lot about good manners and how she looks. Jo often speaks without thinking and loses her temper. On the other hand, Amy is careful about what people think of her. Their dreams are also different: Jo wants to be a writer, while Amy wants to be an artist. Unlike Jo, who says no to Laurie, Amy marries him in the end.","However, the two sisters are more alike than they think. Both Jo and Amy are creative, stubborn, and hard-working. Both of them have to learn hard lessons about their faults — Jo about her anger, and Amy about her pride.","Personally, I relate more to Jo. Like her, I sometimes say things I regret, and I love my freedom. But Amy taught me that caring about others’ feelings is not a weakness."]},"quote":["“I’m not afraid of storms, for I’m learning how to sail my ship.” (Louisa May Alcott)","나는 폭풍이 두렵지 않아. 배를 모는 법을 배우고 있으니까."]},{"week":20,"title":"크리스마스 캐럴","en":"A Christmas Carol","author":"Charles Dickens (찰스 디킨스)","year":"1843","genre":"중편소설 (Novella)","intro":"영국 작가 디킨스의 작품입니다. 크리스마스를 싫어하는 구두쇠 스크루지가 과거, 현재, 미래의 세 유령을 만나 자신의 삶을 돌아보고 완전히 다른 사람으로 다시 태어납니다. “사람은 바뀔 수 있을까?”라는 질문에 대한 따뜻한 대답이에요.","characters":[["Ebenezer Scrooge (스크루지)","돈밖에 모르는 늙은 구두쇠"],["Jacob Marley (말리)","7년 전에 죽은 스크루지의 동업자 (유령)"],["Bob Cratchit (밥 크래칫)","스크루지의 가난한 직원"],["Tiny Tim (꼬마 팀)","밥의 아픈 막내아들"],["Fred (프레드)","스크루지를 늘 초대하는 밝은 조카"],["Three Spirits (세 유령)","과거·현재·미래의 크리스마스 유령"]],"warmup":[["Do you think people can really change?","사람은 정말 바뀔 수 있을까요?"],["If you could visit your past, what would you like to see?","과거로 갈 수 있다면 무엇을 보고 싶나요?"]],"vocab":[["miser","구두쇠","Scrooge was a miser."],["Humbug!","헛소리!","“Christmas? Bah! Humbug!”"],["office","사무실","His office was very cold."],["nephew","조카","His nephew invited him to dinner."],["poor","가난한 (the poor 가난한 사람들)","They asked for money for the poor."],["ghost","유령","He saw the ghost of Marley."],["chain","쇠사슬","The ghost wore a heavy chain."],["spirit","유령, 정령","Three spirits will visit you."],["past","과거","The first spirit showed him the past."],["present","현재","The second spirit was the Ghost of Christmas Present."],["future","미래","The last spirit showed him the future."],["grave","무덤","He saw his name on a grave."],["turkey","칠면조","He bought the biggest turkey."],["raise","(월급을) 올리다","He raised Bob’s salary."],["generous","너그러운","Scrooge became very generous."]],"story":["Marley was dead. There was no doubt about that. He had been Ebenezer Scrooge’s business partner for many years, and Scrooge was the only person at his funeral.","Scrooge was a cold, hard old man who loved only money. He never gave anything to anyone. Nobody ever stopped him in the street to say, “Hello, Mr. Scrooge! How are you?” Even dogs seemed to know him and pulled their owners away from him.","On Christmas Eve, Scrooge sat in his cold office. His clerk, Bob Cratchit, worked in a tiny room with only one small piece of coal for a fire. Scrooge’s cheerful nephew, Fred, came in. “Merry Christmas, Uncle!” “Bah! Humbug!” said Scrooge. “Why are you so happy? You’re poor.” “Why are you so unhappy? You’re rich,” said Fred. Scrooge refused his invitation to Christmas dinner. Then two gentlemen came and asked for money for the poor. “Are there no prisons?” said Scrooge. “Many poor people would rather die than go there,” said the gentlemen. “Then they should die,” said Scrooge, “and there will be fewer people in the world.”","That night, in his dark, empty house, Scrooge saw the ghost of Marley. The ghost was wearing a long, heavy chain made of money boxes and keys. “I wear the chain I made in my life,” said the ghost. “I made it link by link with my greed. Your chain is even longer and heavier! But you still have a chance. Three spirits will visit you.”","At one o’clock, the Ghost of Christmas Past came. It took Scrooge back to his childhood. He saw himself as a lonely boy, left alone at school during Christmas. Scrooge cried for his poor younger self. Next, he saw his kind old boss, Mr. Fezziwig, giving a happy Christmas party for his workers. “He made us so happy with such small things,” Scrooge said, and suddenly he thought of Bob Cratchit. Finally, he saw a young woman named Belle. She had loved him, but she was leaving him. “You love money more than me now,” she said sadly. “Spirit,” cried Scrooge, “show me no more!”","The second spirit, the Ghost of Christmas Present, was a happy giant in a green robe. He took Scrooge to Bob Cratchit’s small house. The family had very little, but they were full of love. They had a small goose and a small pudding, and everyone said it was the best dinner ever. The youngest son, Tiny Tim, was sick. He used a small crutch, and his legs were very weak. “God bless us, every one!” said Tiny Tim. “Spirit,” said Scrooge, “will Tiny Tim live?” “I see an empty chair,” said the spirit, “and a crutch without its owner. If nothing changes in the future, the child will die.” “Oh no!” said Scrooge. “Then he should die,” said the spirit, “and there will be fewer people in the world.” Scrooge heard his own cruel words, and he lowered his head in shame.","The last spirit, the Ghost of Christmas Yet to Come, wore a black robe and never spoke. It showed Scrooge some businessmen laughing about the death of a rich old man. Nobody was sad about him. Then Scrooge saw the Cratchits’ house. It was quiet and sad. Tiny Tim had died. Finally, the spirit took him to a cold, lonely graveyard. On a gravestone, Scrooge saw his own name: EBENEZER SCROOGE. “Spirit!” he cried. “I am not the same man! Why show me this if I can’t change? I will keep Christmas in my heart all year long. I will remember the Past, the Present, and the Future!”","Suddenly, he was in his own bed. It was morning. “I’m alive! I have another chance!” He laughed and cried at the same time. He opened the window and called to a boy in the street. “What day is it today?” “It’s Christmas Day!” “I haven’t missed it!” He sent the boy to buy the biggest turkey in the shop and sent it secretly to Bob Cratchit’s house.","Then he put on his best clothes and walked through the streets, smiling at everyone. He met one of the gentlemen from the day before and promised him a large amount of money for the poor. In the afternoon, he went to his nephew’s house, and Fred welcomed him warmly to Christmas dinner.","The next morning, Bob Cratchit came to work late. “Why are you late?” growled Scrooge, pretending to be angry. “I won’t accept this anymore. And therefore,” he said, jumping up, “I am going to raise your salary!” Scrooge kept his promise and did much more. Tiny Tim did not die, and Scrooge became like a second father to him. He became as good a friend and as good a man as anyone in the city. People always said that he knew how to keep Christmas well. And as Tiny Tim said, “God bless us, every one!”"],"ko":["말리는 죽었다. 그 점에는 의심의 여지가 없었다. 그는 오랫동안 에비니저 스크루지의 동업자였고, 그의 장례식에 온 사람은 스크루지뿐이었다.","스크루지는 오직 돈만 사랑하는 차갑고 냉정한 노인이었다. 그는 누구에게도 아무것도 주지 않았다. 길에서 그를 멈춰 세우고 “안녕하세요, 스크루지 씨! 잘 지내세요?”라고 인사하는 사람은 아무도 없었다. 심지어 개들도 그를 알아보는 것 같았고, 주인을 그에게서 멀리 끌고 갔다.","크리스마스이브, 스크루지는 차가운 사무실에 앉아 있었다. 그의 직원 밥 크래칫은 석탄 한 조각만 불에 넣은 아주 작은 방에서 일했다. 스크루지의 쾌활한 조카 프레드가 들어왔다. “메리 크리스마스, 삼촌!” “흥! 헛소리!” 스크루지가 말했다. “너는 왜 그렇게 기쁘냐? 가난하면서.” “삼촌은 왜 그렇게 불행하세요? 부자면서요.” 프레드가 말했다. 스크루지는 크리스마스 저녁 초대를 거절했다. 그때 두 신사가 와서 가난한 사람들을 위한 돈을 부탁했다. “감옥이 없나요?” 스크루지가 말했다. “많은 가난한 사람들은 거기 가느니 차라리 죽겠다고 합니다.” 신사들이 말했다. “그럼 죽으라고 하시오.” 스크루지가 말했다. “그러면 세상에 사람이 좀 줄겠군.”","그날 밤, 어둡고 텅 빈 집에서 스크루지는 말리의 유령을 보았다. 유령은 돈궤와 열쇠로 만든 길고 무거운 쇠사슬을 차고 있었다. “나는 살아서 내가 만든 사슬을 차고 있네.” 유령이 말했다. “나의 탐욕으로 한 고리 한 고리 만들었지. 자네 사슬은 이보다 더 길고 무거워! 하지만 자네에겐 아직 기회가 있네. 세 유령이 자네를 찾아올 걸세.”","1시에 과거의 크리스마스 유령이 왔다. 유령은 스크루지를 어린 시절로 데려갔다. 그는 크리스마스에 학교에 홀로 남겨진 외로운 소년인 자신을 보았다. 스크루지는 가엾은 어린 자신을 보며 울었다. 다음으로, 그는 친절했던 옛 사장 페지윅 씨가 직원들을 위해 즐거운 크리스마스 파티를 여는 모습을 보았다. “그분은 아주 작은 것으로도 우리를 정말 행복하게 해 주셨지.” 스크루지는 이렇게 말하다가 문득 밥 크래칫이 떠올랐다. 마지막으로 그는 벨이라는 젊은 여인을 보았다. 그녀는 그를 사랑했지만, 그를 떠나고 있었다. “당신은 이제 나보다 돈을 더 사랑해요.” 그녀가 슬프게 말했다. “유령이여,” 스크루지가 외쳤다. “더는 보여 주지 마시오!”","두 번째 유령, 현재의 크리스마스 유령은 초록 옷을 입은 쾌활한 거인이었다. 유령은 스크루지를 밥 크래칫의 작은 집으로 데려갔다. 그 가족은 가진 것이 거의 없었지만 사랑으로 가득했다. 작은 거위 한 마리와 작은 푸딩뿐이었지만, 모두가 최고의 저녁이라고 말했다. 막내아들 꼬마 팀은 아팠다. 작은 목발을 짚었고, 다리가 무척 약했다. “하느님, 우리 모두에게 축복을!” 꼬마 팀이 말했다. “유령이여,” 스크루지가 말했다. “꼬마 팀은 살 수 있소?” “빈 의자가 보이는구나.” 유령이 말했다. “그리고 주인 없는 목발도. 미래에 아무것도 바뀌지 않는다면, 저 아이는 죽을 것이다.” “아, 안 돼!” 스크루지가 말했다. “그럼 죽으라지.” 유령이 말했다. “그러면 세상에 사람이 좀 줄 테니.” 스크루지는 자신의 잔인한 말을 듣고 부끄러워 고개를 숙였다.","마지막 유령, 아직 오지 않은 크리스마스의 유령은 검은 옷을 입고 한마디도 하지 않았다. 유령은 어떤 부자 노인의 죽음을 두고 웃고 있는 사업가들을 스크루지에게 보여 주었다. 그의 죽음을 슬퍼하는 사람은 아무도 없었다. 그다음 스크루지는 크래칫의 집을 보았다. 집은 조용하고 슬펐다. 꼬마 팀이 죽은 것이다. 마지막으로 유령은 그를 차갑고 쓸쓸한 묘지로 데려갔다. 한 묘비에서 스크루지는 자기 이름을 보았다. “에비니저 스크루지.” “유령이여!” 그가 외쳤다. “나는 예전의 내가 아니오! 내가 바뀔 수 없다면 왜 이걸 보여 주는 거요? 나는 일 년 내내 마음속에 크리스마스를 간직하겠소. 과거와 현재와 미래를 기억하겠소!”","갑자기 그는 자기 침대에 있었다. 아침이었다. “살아 있어! 다시 기회가 생겼어!” 그는 웃으면서 동시에 울었다. 그는 창문을 열고 거리에 있는 소년을 불렀다. “오늘이 무슨 날이냐?” “크리스마스잖아요!” “놓치지 않았구나!” 그는 소년을 시켜 가게에서 가장 큰 칠면조를 사게 하고, 몰래 밥 크래칫의 집으로 보냈다.","그러고 나서 그는 가장 좋은 옷을 입고 모두에게 미소 지으며 거리를 걸었다. 그는 전날 만났던 신사 중 한 사람을 만나 가난한 사람들을 위해 큰돈을 내겠다고 약속했다. 오후에는 조카의 집에 갔고, 프레드는 그를 크리스마스 저녁 식사에 따뜻하게 맞아 주었다.","다음 날 아침, 밥 크래칫이 지각했다. “왜 늦었나?” 스크루지가 화난 척 으르렁거렸다. “더는 이런 걸 봐줄 수 없네. 그러니까,” 그가 벌떡 일어나며 말했다. “자네 월급을 올려 주겠네!” 스크루지는 약속을 지켰고, 그보다 훨씬 많은 일을 했다. 꼬마 팀은 죽지 않았고, 스크루지는 그에게 두 번째 아버지 같은 존재가 되었다. 그는 그 도시의 누구 못지않게 좋은 친구, 좋은 사람이 되었다. 사람들은 그가 크리스마스를 제대로 지킬 줄 아는 사람이라고 늘 말했다. 그리고 꼬마 팀의 말처럼, “하느님, 우리 모두에게 축복을!”"],"gloss":[["funeral","장례식"],["coal","석탄"],["would rather A than B","B하느니 차라리 A하겠다"],["link","(사슬의) 고리"],["greed","탐욕"],["crutch","목발"],["in shame","부끄러워서"],["growl","으르렁거리다"]],"keySentences":[["Many poor people would rather die than go there.","would rather A than B = B하느니 차라리 A하겠다"],["I made it link by link with my greed.","link by link = 한 고리씩. 작은 욕심이 모여 무거운 사슬이 된다는 비유"],["If nothing changes in the future, the child will die.","조건문: 미래가 바뀌지 않으면 → Unless the future changes, … 와 같은 뜻"],["I will keep Christmas in my heart all year long.","keep Christmas = 크리스마스의 정신(나눔, 사랑)을 지키다"]],"tf":[["Scrooge was the only person at Marley’s funeral.","T"],["Scrooge gave money to the gentlemen on Christmas Eve.","F — 거절했다. 다음 날 큰돈을 약속했다."],["Belle left Scrooge because he loved money more than her.","T"],["Tiny Tim died at the end.","F — 스크루지 덕분에 죽지 않았다."]],"questions":[["What was Marley’s chain made of, and what did it mean?","Money boxes and keys. It meant the greed of his life."],["What did the Ghost of Christmas Past show Scrooge?","His lonely childhood, Mr. Fezziwig’s party, and Belle leaving him."],["How did the second spirit use Scrooge’s own words?","It said “Then he should die” about Tiny Tim, and Scrooge felt ashamed."],["List three things Scrooge did on Christmas Day.","He sent a turkey to the Cratchits, promised money for the poor, and had dinner with Fred."]],"listening":{"shadow":"6","dictation":[["Scrooge ___ his invitation to Christmas dinner.","refused"],["I made it link by link with my ___.","greed"],["If nothing ___ in the future, the child will die.","changes"],["I will keep Christmas in my heart all year ___.","long"],["I am going to ___ your salary!","raise"]]},"grammar":{"title":"조건 표현 — unless / as long as / otherwise / in case","explain":["unless = if ~ not: ~하지 않으면 → Unless Scrooge changes, Tiny Tim will die.","as long as: ~하기만 하면, ~하는 한 → You can stay as long as you are quiet.","otherwise: 그렇지 않으면 → Change your life. Otherwise, you will be like Marley.","in case: ~할 경우에 대비해서 → Take an umbrella in case it rains.","unless 뒤에는 not 을 쓰지 않아요: unless you don’t ~ (X)"],"examples":[["Unless you hurry, you’ll miss the train.","서두르지 않으면 기차를 놓칠 거야."],["I’ll lend you the money as long as you pay me back.","갚기만 한다면 돈을 빌려줄게."],["Save some money. Otherwise, you’ll have problems later.","돈을 좀 모아. 그렇지 않으면 나중에 곤란해질 거야."],["Write down my number in case you get lost.","길을 잃을 경우를 대비해 내 번호를 적어 둬."]],"exercise":[["If you don’t study, you won’t pass. (unless 로)","Unless you study, you won’t pass."],["Bring a jacket ___ it gets cold. (in case / unless)","in case"],["Hurry up. ___, we’ll be late. (Otherwise / As long as)","Otherwise"]]},"expressions":[["There is no doubt about ~","~에는 의심의 여지가 없다","There is no doubt about his talent."],["would rather A than B","B하느니 차라리 A하겠다","I would rather walk than take a crowded bus."],["at the same time","동시에","He laughed and cried at the same time."],["keep one’s promise","약속을 지키다","She always keeps her promises."]],"speaking":{"retell":["Scrooge – a miser – “Bah! Humbug!”","Marley’s ghost – chain – three spirits","Past: lonely boy, Fezziwig, Belle","Present: the Cratchits, Tiny Tim","Future: nobody cares – Tiny Tim dead – his own grave","woke up – Christmas Day – turkey, money for the poor, Fred","raised Bob’s salary – second father to Tiny Tim"],"discuss":["Which spirit had the strongest effect on Scrooge? Why?","What “chains” do people make for themselves today?","If a spirit showed you your life in 20 years, what would you change now?"],"model":["What “chains” do people make for themselves today?","I think many people make chains of stress and greed. Some people work seventy hours a week just to buy a bigger car or apartment, and they never have time for family. Each choice seems small, but link by link, the chain gets heavier. Unless we stop and think about what really matters, we might end up like Marley — rich but alone."],"roleplay":"A: 미래의 유령 앞에서 애원하는 스크루지 / B: 해설자. 스크루지는 unless, as long as 를 사용해 무엇을 바꾸겠다고 약속해 보세요."},"writing":{"task":"5개월 차 마무리 — “나의 세 유령” 에세이 (unless / as long as / otherwise 를 2개 이상, 200단어)","hints":["Past: 기억하고 싶은 과거의 장면 하나","Present: 지금 내가 놓치고 있는 것","Future: 바뀌지 않으면 일어날 일","마지막: 지금부터 바꿀 것"],"model":["If the three spirits visited me on Christmas Eve, they would show me some uncomfortable truths.","The Ghost of Christmas Past would take me back to my grandmother’s small house in the countryside. Every winter, she made rice cakes for the whole village and gave them away. She had very little money, but she was the happiest person I knew.","The Ghost of Christmas Present would show me my life now. I work late almost every night, and I look at my phone even at dinner. My parents call me every Sunday, but I often say, “I’m busy. I’ll call you back,” and then I forget.","The Ghost of the Future would be the scariest. It might show me an empty apartment and a phone with no messages. Unless I change my habits, I might become rich in money but poor in relationships, like Scrooge.","Luckily, I still have time. From now on, I will visit my parents once a month and turn off my phone at dinner. As long as I remember my grandmother’s kitchen, I believe I can keep Christmas in my heart all year long."]},"quote":["“I will honour Christmas in my heart, and try to keep it all the year.” (Charles Dickens)","나는 마음속으로 크리스마스를 기리며, 일 년 내내 그 정신을 지키겠다."]}],"review":{"vocab":[["orphan","고아"],["imagination","상상력"],["spoiled","버릇없는"],["stubborn","고집 센"],["freedom","자유"],["forgive","용서하다"],["miser","구두쇠"],["generous","너그러운"],["greed","탐욕"],["alive","살아 있는"]],"grammar":[["The news was ___. (surprise → 원인)","surprising"],["The fresh air made her ___ (feel) better.","feel"],["I got him ___ (help) me.","to help"],["Jo was wild, ___ Meg was gentle. (반면에)","whereas / while"],["___ you study, you won’t pass. (~하지 않으면)","Unless"]],"project":{"title":"5개월 차 프로젝트 — 인물 인터뷰 (Character Interview)","steps":["네 작품 중 한 인물을 골라 “인터뷰 기사”를 쓰세요.","질문 6개: 과거, 가장 힘들었던 순간, 변화의 계기, 후회, 꿈, 독자에게 하고 싶은 말","인물의 목소리로 답변 쓰기 (각 2~3문장)","친구나 가족과 역할을 나눠 인터뷰를 녹음하세요.","250단어 내외"]}}},{"month":6,"title":"세계 고전 문학 — 생각하며 읽고 내 의견 쓰기","level":"B1+ (지문 790~950단어)","intro":"마지막 달에는 영문학의 대표 고전을 읽습니다. 오만과 편견, 지킬 박사와 하이드 씨, 프랑켄슈타인, 야성의 부름은 지금도 영화와 드라마로 계속 만들어지는 작품들이에요. 정중한 표현, 양보 표현, 후회를 나타내는 가정법을 익히고, 작품에 대한 내 의견을 논리적으로 쓰는 연습으로 6개월 과정을 마무리합니다.","skill":"읽기 전략: 다 읽은 뒤 “작가가 이 이야기로 말하고 싶었던 것(주제)”을 영어 한 문장으로 써 보세요.","units":[{"week":21,"title":"오만과 편견","en":"Pride and Prejudice","author":"Jane Austen (제인 오스틴)","year":"1813","genre":"로맨스 소설 (Romance Novel)","intro":"영국 작가 제인 오스틴의 대표작입니다. 똑똑하고 재치 있는 엘리자베스와 부유하지만 거만해 보이는 다아시가 첫인상의 오해(편견)와 자존심(오만)을 극복하고 서로를 이해하게 되는 이야기예요. 200년이 넘도록 사랑받는 로맨스 소설의 원조입니다.","characters":[["Elizabeth Bennet (엘리자베스)","똑똑하고 재치 있는 베넷 가의 둘째 딸"],["Mr. Darcy (다아시)","부유하고 자존심 강한 신사"],["Jane (제인)","착하고 아름다운 첫째 딸"],["Mr. Bingley (빙리)","다아시의 친구, 제인을 사랑함"],["Mrs. Bennet (베넷 부인)","딸들을 부자와 결혼시키려 애쓰는 어머니"],["Mr. Wickham (위컴)","다아시에 대해 거짓말을 하는 군인"]],"warmup":[["How important are first impressions?","첫인상은 얼마나 중요할까요?"],["Have you ever completely changed your opinion about someone?","누군가에 대한 생각이 완전히 바뀐 적 있나요?"]],"vocab":[["rich","부유한","Mr. Bingley was rich and handsome."],["daughter","딸","Mrs. Bennet had five daughters."],["dance","무도회, 춤","They met at a dance."],["proud","거만한, 자존심 강한","Everyone thought Darcy was proud."],["rude","무례한","His words were rude."],["opinion","의견","She had a bad opinion of him."],["believe","믿다","Elizabeth believed Wickham’s story."],["propose","청혼하다","Darcy proposed to Elizabeth."],["refuse","거절하다","She refused him."],["letter","편지","Darcy gave her a long letter."],["truth","진실","The letter told the truth."],["judge","판단하다","She judged him too quickly."],["run away","달아나다","Lydia ran away with Wickham."],["secretly","몰래","Darcy secretly helped her family."],["change","변하다","Their feelings changed."]],"story":["It is a truth that everyone knows: a single man with a lot of money must want a wife. At least, that was what Mrs. Bennet believed. She had five daughters and no sons, and her greatest wish in life was to see her daughters married to rich men.","So when Mr. Bingley, a rich and handsome young man, moved into a big house nearby, Mrs. Bennet was very excited. At the local dance, Mr. Bingley danced twice with Jane, the oldest and most beautiful Bennet sister, and everyone could see that he liked her.","Mr. Bingley’s friend, Mr. Darcy, was even richer. At first, all the ladies admired him because he was tall and handsome. But soon everyone decided that he was proud and unpleasant. He only danced with his friend’s sisters and didn’t talk to anyone else. When Mr. Bingley told him to dance with Elizabeth, Jane’s clever younger sister, Darcy looked at her and said coldly, “She is okay, but not pretty enough for me.” Elizabeth heard him. She laughed about it with her friends, but she never forgot it.","Over the next few weeks, however, Darcy started to like Elizabeth. He admired her beautiful dark eyes, her quick mind, and the playful way she argued with him. But Elizabeth disliked him more and more. Then she met Mr. Wickham, a charming young soldier. Wickham told her that Darcy had treated him cruelly and taken away money that Darcy’s father had promised him. Elizabeth believed every word. Later, Mr. Bingley suddenly left for London without saying goodbye to Jane. Jane was heartbroken. Elizabeth found out that Darcy had told Bingley to leave, because he thought Jane didn’t really love his friend.","A few months later, Darcy suddenly visited Elizabeth when she was alone. “I have tried to fight my feelings,” he said, “but I can’t. I must tell you how much I admire and love you.” Elizabeth was shocked. But Darcy didn’t only talk about love. He also talked about how her family was lower than his, and how hard it was for him to ask her. He clearly expected her to say yes.","Elizabeth’s face turned red with anger. “From the very beginning,” she said, “I saw that you were proud and selfish, and that you didn’t care about other people’s feelings. You are the last man in the world that I would marry.” She said he had ruined her sister’s happiness and treated Wickham badly. Darcy turned pale, said goodbye politely, and left.","The next morning, Darcy gave her a long letter. In it, he calmly explained everything. Yes, he had separated Bingley from Jane, because Jane had seemed so calm that he truly believed she didn’t love his friend. But Wickham’s story was a lie. Darcy had given Wickham a lot of money, and Wickham had wasted it all on gambling. Even worse, Wickham had tried to run away with Darcy’s fifteen-year-old sister to get her money. Elizabeth read the letter again and again. Slowly, she realized that Darcy was telling the truth. “How badly I have judged!” she cried. “I was so proud of my good judgment. Until this moment, I never really knew myself.”","In the summer, Elizabeth traveled with her aunt and uncle and visited Darcy’s beautiful home, Pemberley. His housekeeper told them that Darcy was the kindest master and the best brother in the world. Then Darcy himself arrived. To her surprise, he was polite and warm, even to her aunt and uncle, whom he would have looked down on before. Elizabeth began to see him in a new way.","Then terrible news came. Elizabeth’s youngest sister, Lydia, had run away with Wickham! At that time, this was a huge shame for the whole family, and Wickham had no plan to marry her. But a few days later, the problem was solved: Wickham married Lydia. Later, Elizabeth learned the secret. It was Darcy who had found them in London, paid Wickham’s debts, and arranged the marriage. And he had asked everyone not to tell her.","Soon after, Bingley came back and asked Jane to marry him, and she happily said yes. Then Darcy came to Elizabeth once more. “If your feelings are still the same as last April, tell me now,” he said. “My feelings have not changed. But one word from you will stop me from speaking about this forever.” This time, Elizabeth told him that her feelings had completely changed. As they walked together, they talked honestly about their mistakes. Elizabeth had judged him too quickly — that was her prejudice. Darcy had been too proud — that was his pride. Each had learned from the other, and they were married, both happier than they had ever imagined."],"ko":["누구나 아는 진리가 있다. 돈이 많은 독신 남자에게는 틀림없이 아내가 필요하다는 것이다. 적어도 베넷 부인은 그렇게 믿었다. 그녀에게는 딸이 다섯 명이고 아들은 없었는데, 인생의 가장 큰 소원은 딸들을 부자와 결혼시키는 것이었다.","그래서 부유하고 잘생긴 젊은 남자 빙리 씨가 근처의 큰 저택으로 이사 오자, 베넷 부인은 무척 들떴다. 동네 무도회에서 빙리 씨는 베넷 가의 첫째이자 가장 아름다운 제인과 두 번이나 춤을 추었고, 모두가 그가 제인을 좋아한다는 것을 알 수 있었다.","빙리 씨의 친구 다아시 씨는 그보다 더 부자였다. 처음에는 키가 크고 잘생긴 그를 모든 숙녀가 동경했다. 하지만 곧 모두가 그를 거만하고 불쾌한 사람이라고 결론 내렸다. 그는 친구의 누이들하고만 춤을 추었고, 다른 누구와도 이야기하지 않았다. 빙리 씨가 제인의 똑똑한 동생 엘리자베스와 춤을 추라고 하자, 다아시는 그녀를 보더니 차갑게 말했다. “그럭저럭 괜찮지만, 내 눈에 찰 만큼 예쁘지는 않아.” 엘리자베스는 그 말을 들었다. 그녀는 친구들과 웃어넘겼지만, 그 말을 결코 잊지 않았다.","하지만 그 후 몇 주 동안 다아시는 엘리자베스를 좋아하게 되었다. 그는 그녀의 아름다운 검은 눈, 재빠른 두뇌, 장난스럽게 자기와 논쟁하는 모습에 감탄했다. 그러나 엘리자베스는 그가 점점 더 싫어졌다. 그러다 그녀는 매력적인 젊은 군인 위컴 씨를 만났다. 위컴은 다아시가 자신을 잔인하게 대했고, 다아시의 아버지가 자신에게 약속한 돈을 빼앗았다고 말했다. 엘리자베스는 그 말을 하나도 빠짐없이 믿었다. 나중에 빙리 씨는 제인에게 인사도 없이 갑자기 런던으로 떠났다. 제인은 가슴이 찢어졌다. 엘리자베스는 다아시가 빙리에게 떠나라고 했다는 것을 알게 되었다. 제인이 그의 친구를 진심으로 사랑하지 않는다고 생각했기 때문이다.","몇 달 뒤, 다아시는 엘리자베스가 혼자 있을 때 갑자기 찾아왔다. “내 감정과 싸워 보려 했지만,” 그가 말했다. “그럴 수가 없습니다. 내가 당신을 얼마나 존경하고 사랑하는지 말해야겠어요.” 엘리자베스는 충격을 받았다. 하지만 다아시는 사랑만 이야기한 것이 아니었다. 그녀의 집안이 자기 집안보다 얼마나 낮은지, 그리고 청혼하기가 자기에게 얼마나 힘들었는지도 이야기했다. 그는 그녀가 당연히 승낙할 거라고 기대하는 게 분명했다.","엘리자베스의 얼굴이 분노로 붉어졌다. “처음부터,” 그녀가 말했다. “나는 당신이 거만하고 이기적이며, 다른 사람의 감정은 신경 쓰지 않는 사람이라는 걸 알았어요. 당신은 이 세상에서 내가 결혼할 마지막 남자예요.” 그녀는 그가 언니의 행복을 망쳤고 위컴을 부당하게 대했다고 말했다. 다아시는 창백해져서 정중하게 작별 인사를 하고 떠났다.","다음 날 아침, 다아시는 그녀에게 긴 편지를 건넸다. 편지에서 그는 차분하게 모든 것을 설명했다. 그렇다, 그는 빙리와 제인을 떼어 놓았다. 제인이 너무 차분해 보여서, 제인이 친구를 사랑하지 않는다고 진심으로 믿었기 때문이다. 하지만 위컴의 이야기는 거짓말이었다. 다아시는 위컴에게 큰돈을 주었고, 위컴은 그것을 모두 도박으로 날렸다. 더 나쁜 것은, 위컴이 다아시의 열다섯 살 여동생의 돈을 노리고 그녀와 함께 달아나려 했다는 것이다. 엘리자베스는 편지를 읽고 또 읽었다. 그녀는 천천히 다아시가 진실을 말하고 있다는 것을 깨달았다. “내가 얼마나 잘못 판단했던가!” 그녀가 외쳤다. “난 내 판단력을 그렇게 자랑스러워했는데. 이 순간까지 나는 나 자신을 진짜로 알지 못했어.”","여름에 엘리자베스는 이모 부부와 함께 여행을 하다가 다아시의 아름다운 저택 펨벌리를 방문했다. 그의 가정부는 다아시가 세상에서 가장 친절한 주인이자 가장 좋은 오빠라고 말했다. 그때 다아시가 직접 나타났다. 놀랍게도 그는 예의 바르고 따뜻했다. 예전 같으면 무시했을 그녀의 이모 부부에게까지도 그랬다. 엘리자베스는 그를 새로운 눈으로 보기 시작했다.","그때 끔찍한 소식이 왔다. 엘리자베스의 막내 여동생 리디아가 위컴과 함께 달아난 것이다! 당시 이것은 온 가족에게 엄청난 수치였고, 위컴은 그녀와 결혼할 생각이 없었다. 그런데 며칠 뒤 문제가 해결되었다. 위컴이 리디아와 결혼한 것이다. 나중에 엘리자베스는 비밀을 알게 되었다. 런던에서 두 사람을 찾아내고, 위컴의 빚을 갚아 주고, 결혼을 성사시킨 사람은 바로 다아시였다. 그리고 그는 모두에게 그녀에게는 말하지 말아 달라고 부탁했었다.","곧 빙리가 돌아와 제인에게 청혼했고, 제인은 기쁘게 승낙했다. 그리고 다아시가 다시 한번 엘리자베스를 찾아왔다. “당신 마음이 지난 4월과 같다면, 지금 말해 주세요.” 그가 말했다. “내 마음은 변하지 않았습니다. 하지만 당신이 한마디만 하면 이 이야기는 영원히 다시 꺼내지 않겠습니다.” 이번에 엘리자베스는 자기 마음이 완전히 바뀌었다고 말했다. 함께 걸으며 두 사람은 서로의 실수에 대해 솔직하게 이야기했다. 엘리자베스는 그를 너무 성급하게 판단했다. 그것이 그녀의 편견이었다. 다아시는 너무 거만했다. 그것이 그의 오만이었다. 두 사람은 서로에게서 배웠고, 결혼하여 상상했던 것보다 훨씬 더 행복하게 살았다."],"gloss":[["single","독신의"],["nearby","근처에"],["admire","감탄하다, 동경하다"],["charming","매력적인"],["heartbroken","가슴이 찢어지는"],["ruin","망치다"],["gambling","도박"],["housekeeper","가정부"],["look down on","~을 깔보다"],["arrange","준비하다, 성사시키다"],["prejudice","편견"]],"keySentences":[["It is a truth that everyone knows: a single man with a lot of money must want a wife.","영문학에서 가장 유명한 첫 문장 중 하나를 쉽게 바꾼 것. 사실은 “사람들이 그렇게 믿는다”는 유머(아이러니)예요."],["You are the last man in the world that I would marry.","the last + 명사 + that ~ = 결코 ~하지 않을 사람"],["…whom he would have looked down on before.","would have p.p. = (예전이라면) ~했을 것이다"],["It was Darcy who had found them in London.","It was ~ who/that 강조 (15주차 복습): “그들을 찾은 사람은 바로 다아시였다”"]],"tf":[["Darcy said Elizabeth was too beautiful to dance with.","F — 자기 눈에 찰 만큼 예쁘지 않다고 했다."],["Wickham told Elizabeth the truth about Darcy.","F — 거짓말을 했다."],["Elizabeth refused Darcy’s first proposal.","T"],["Darcy secretly helped Elizab
