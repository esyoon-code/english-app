<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>명작 영어 클래스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app — a bookshelf home (cloth-bound covers per month), a reader-style unit screen with sticky step tabs, and a bottom nav. */
:root{
  --paper:#f7f6f2; --card:#ffffff; --ink:#1d2430; --ink-2:#5b6472; --rule:#e2e0d8; --tint:#eef0f3;
  --accent:#2c5a8a; --ok:#2f7a4b; --bad:#b4442f; --hl:#fdf1c7;
  --m1:#8c3b3b; --m2:#3f6e4e; --m3:#2e5e8c; --m4:#6e4a86; --m5:#a8692a; --m6:#26364e;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15181d; --card:#1e232a; --ink:#e8e6e1; --ink-2:#a3a9b3; --rule:#2e343d; --tint:#262c35;
  --accent:#8fb6e0; --ok:#6cc08b; --bad:#ec8a73; --hl:#4a3f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181d; --card:#1e232a; --ink:#e8e6e1; --ink-2:#a3a9b3; --rule:#2e343d; --tint:#262c35;
  --accent:#8fb6e0; --ok:#6cc08b; --bad:#ec8a73; --hl:#4a3f1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;margin:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.25}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:54px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.iconbtn:active{background:var(--tint)}
.tabs{max-width:640px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;display:flex;align-items:center;gap:5px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab .chk{font-size:11px;color:var(--ok)}
.tab[aria-selected="true"] .chk{color:inherit}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:transparent;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--ink-2)}
.nav button span:first-child{font-size:19px;line-height:1.2}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}

/* home */
.hero{padding:22px 0 8px;display:grid;gap:14px}
.hero h2{font-size:28px}
.meter{height:8px;border-radius:99px;background:var(--tint);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.resume{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.resume .cv{width:54px;flex:none}
.resume b{display:block;font-family:var(--serif);font-size:17px;line-height:1.3}
.monthsel{display:flex;gap:6px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:none}
.monthsel::-webkit-scrollbar{display:none}
.monthsel button{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px}
.monthsel button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.monthhead{display:grid;gap:4px;margin:6px 0 14px}
.monthhead h3{font-size:20px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cover{position:relative;border:0;border-radius:4px 10px 10px 4px;padding:14px 12px 12px 18px;min-height:178px;text-align:left;color:#fbf8f0;background:var(--c);display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 14px -8px rgba(0,0,0,.45)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.22)}
.cover::after{content:"";position:absolute;top:8px;right:8px;bottom:8px;left:15px;border:1px solid rgba(255,255,255,.28);border-radius:3px;pointer-events:none}
.cover .wk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.cover .ti{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.25}
.cover .ko{font-size:12px;opacity:.85}
.cover .dots{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.cover .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28)}
.cover .dots i.on{background:#fbf8f0}
.cv{aspect-ratio:3/4;min-height:72px;border-radius:2px 6px 6px 2px;background:var(--c);position:relative;max-width:100%}
.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(0,0,0,.22)}
.reviewbtn{grid-column:1/-1;border:1px dashed var(--ink-2);background:transparent;border-radius:var(--r);padding:14px;text-align:left}

/* sections */
.sec{display:grid;gap:14px;padding:18px 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.card h3{font-size:17px;margin-bottom:6px}
.meta{font-size:13px;color:var(--ink-2)}
.chars{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.chars li{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:10px;font-size:14px}
.chars b{font-weight:700}

/* reader */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:8px 13px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--tint);font-weight:700}
.story{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 18px}
.story h2{font-size:22px;text-align:center}
.story .by{text-align:center;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-2);margin:4px 0 18px}
.para{position:relative;font-family:var(--serif);font-size:var(--fs,18px);line-height:1.75;margin:0 0 16px;padding:4px 6px;border-radius:8px}
.para .n{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--c);margin-right:6px;vertical-align:2px}
.para.speaking{background:var(--hl)}
.para .ko{display:block;font-family:var(--sans);font-size:14.5px;line-height:1.65;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.para .acts{display:flex;gap:6px;margin-top:6px}
.mini{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:3px 9px;font-size:12px}
.gloss{display:flex;flex-wrap:wrap;gap:6px}
.gloss span{background:var(--tint);border-radius:8px;padding:4px 9px;font-size:13px}
.gloss b{font-family:var(--serif);font-weight:600;margin-right:4px}
.ks{display:grid;gap:12px}
.ks div{border-left:3px solid var(--c);padding-left:12px}
.ks p{margin:0}
.ks .en{font-family:var(--serif);font-size:16px}
.ks .ex{font-size:13.5px;color:var(--ink-2)}

/* flashcards */
.flash{perspective:1000px;height:260px}
.flash .inner{position:relative;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;top:0;left:0;right:0;bottom:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--rule);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .w{font-family:var(--serif);font-size:30px;font-weight:600}
.face .m{font-size:22px;font-weight:700}
.face .e{font-family:var(--serif);font-size:16px;color:var(--ink-2)}
.fc-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:grid;gap:0;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.list .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:11px 14px;border-top:1px solid var(--rule);align-items:center}
.list .row:first-child{border-top:0}
.list .row b{font-family:var(--serif);font-size:16px}
.list .row .sub{font-size:13px;color:var(--ink-2)}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--tint);color:var(--ink-2)}
.tag.ok{background:var(--tint);background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.bad{background:var(--tint);background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

/* quiz */
.q{display:grid;gap:10px}
.q .stem{font-family:var(--serif);font-size:16.5px}
.tf{display:flex;gap:8px}
.tf button{flex:1;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:10px;font-weight:700}
.tf button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.tf button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{font-size:14px;border-radius:10px;padding:9px 12px;background:var(--tint)}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
input[type=text],textarea{width:100%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
textarea{min-height:200px;resize:vertical;font-family:var(--serif);line-height:1.6}
details{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
details summary{cursor:pointer;font-weight:700;font-size:14px}
details[open] summary{margin-bottom:8px}
.model p{font-family:var(--serif);margin:0 0 10px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
.retell{counter-reset:k;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.retell li{counter-increment:k;display:flex;gap:10px;font-family:var(--serif)}
.retell li::before{content:counter(k);font-family:var(--sans);font-size:12px;font-weight:700;color:var(--c);min-width:1.2em}
.ex2{display:grid;gap:10px}
.ex2 .row{display:grid;gap:2px}
.ex2 .en{font-family:var(--serif);font-size:16px}
.ex2 .koline{font-size:13.5px;color:var(--ink-2)}
.quote{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.6}
.stepdone{display:flex;justify-content:center;padding:6px 0 4px}
.score{font-size:32px;font-family:var(--serif);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:14px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.mc{display:grid;gap:8px}
.mc button{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:11px 12px;text-align:left}
.mc button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.mc button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px;display:grid;gap:2px}
.stat b{font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums}
.grid6{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.mrow .meter{height:7px}
.mrow .sw{width:12px;height:30px;border-radius:2px 4px 4px 2px;background:var(--c)}
.note{font-size:13px;color:var(--ink-2);background:var(--tint);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>

});

<script id="data" type="application/json">[{"month":1,"title":"우화와 동화 — 짧은 이야기로 시작하기","level":"A2+ (지문 260~360단어)","intro":"기초 과정을 마친 여러분이 처음 만나는 “긴 영어 글”입니다. 누구나 아는 짧은 우화와 동화라서 줄거리를 이미 알고 있어 영어에만 집중할 수 있어요. 이야기는 대부분 과거형으로 쓰여 있으니, 기초 과정에서 배운 과거형·과거진행형을 실제 이야기 속에서 다시 만나게 됩니다.","skill":"읽기 전략: 처음에는 사전 없이 끝까지 읽고, 두 번째에 모르는 단어를 찾으세요.","units":[{"week":1,"title":"개미와 베짱이","en":"The Ant and the Grasshopper","author":"Aesop (이솝)","year":"기원전 6세기경","genre":"우화 (Fable)","intro":"고대 그리스의 이솝이 들려준 것으로 전해지는 우화예요. 열심히 일하는 개미와 노래만 부르는 베짱이를 통해 미래를 준비하는 것이 왜 중요한지 이야기합니다. 이 교재의 결말은 원작과 조금 다르니 끝까지 읽어 보세요.","characters":[["The Ant (개미)","여름 내내 겨울 식량을 모으는 부지런한 개미"],["The Grasshopper (베짱이)","여름 내내 노래하며 노는 베짱이"]],"warmup":[["Do you save money for the future?","미래를 위해 돈을 모으나요?"],["What do you like to do on a sunny summer day?","화창한 여름날 무엇을 하고 싶나요?"]],"vocab":[["field","들판","The grasshopper sang in the field."],["carry","나르다","The ant carried a grain of corn."],["corn","옥수수, 곡식","She found some corn on the ground."],["tired","지친, 피곤한","The ant looked tired."],["save","모아 두다","I save money every month."],["winter","겨울","Winter is cold here."],["laugh","웃다","The grasshopper laughed at her."],["silly","어리석은","Don’t be silly!"],["snow","눈; 눈이 오다","Snow covered the field."],["hungry","배고픈","He was very hungry."],["knock","(문을) 두드리다","He knocked on the door."],["beg","간청하다","He begged for food."],["weak","약한","He was too weak to walk."],["sigh","한숨 쉬다","The ant sighed."],["enjoy","즐기다","She enjoyed his songs."]],"story":["It was a hot summer day. A Grasshopper was jumping and singing in a green field. The sun was warm, and there was a lot of food everywhere.","Then he saw an Ant. She was carrying a big piece of corn on her back. She walked slowly, and she looked very tired.","“Hi, Ant!” said the Grasshopper. “Why are you working so hard? Come and sing with me!”","“I can’t,” said the Ant. “I’m saving food for the winter. You should save some food, too.”","The Grasshopper laughed. “Winter? Winter is a long time away! We have a lot of food now. Don’t be silly.” The Ant didn’t say anything. She just carried her corn home.","All summer, the Grasshopper sang and played. All summer, the Ant worked. Then autumn came, and the days became cold. Soon it was winter. Snow covered the field. The Grasshopper couldn’t find any food. He was so hungry and cold that he could hardly move.","One night, he knocked on the Ant’s door. “Please help me,” he begged. “I’m so hungry. Can you give me a little food?”","“What did you do all summer?” asked the Ant. “I sang every day,” said the Grasshopper.","The Ant looked at him. He was very weak. She sighed and opened the door. “Come in,” she said. “But next summer, you will work with me.”","The next summer, the Grasshopper worked in the morning and sang in the evening. And the Ant learned something, too. For the first time, she stopped working for a while and enjoyed his songs."],"ko":["무더운 여름날이었다. 베짱이 한 마리가 푸른 들판에서 뛰어다니며 노래하고 있었다. 햇살은 따뜻했고, 어디에나 먹을 것이 많았다.","그때 베짱이는 개미 한 마리를 보았다. 개미는 커다란 옥수수 한 조각을 등에 지고 있었다. 개미는 천천히 걸었고, 무척 지쳐 보였다.","“안녕, 개미야!” 베짱이가 말했다. “왜 그렇게 열심히 일하니? 이리 와서 나랑 노래하자!”","“그럴 수 없어.” 개미가 말했다. “겨울을 위해 먹이를 모으고 있거든. 너도 먹이를 좀 모아 두는 게 좋을 거야.”","베짱이는 웃었다. “겨울? 겨울은 아직 한참 남았어! 지금은 먹을 게 많잖아. 바보같이 굴지 마.” 개미는 아무 말도 하지 않았다. 그저 옥수수를 집으로 날랐다.","여름 내내 베짱이는 노래하고 놀았다. 여름 내내 개미는 일했다. 그러다 가을이 왔고, 날이 추워졌다. 곧 겨울이 되었다. 눈이 들판을 덮었다. 베짱이는 먹을 것을 하나도 찾을 수 없었다. 너무 배고프고 추워서 거의 움직일 수도 없었다.","어느 날 밤, 베짱이는 개미의 집 문을 두드렸다. “제발 도와줘.” 베짱이가 간청했다. “너무 배가 고파. 먹을 것 좀 조금만 줄 수 있니?”","“여름 내내 뭘 했니?” 개미가 물었다. “매일 노래했어.” 베짱이가 말했다.","개미는 베짱이를 바라보았다. 베짱이는 몹시 약해져 있었다. 개미는 한숨을 쉬고 문을 열었다. “들어와.” 개미가 말했다. “하지만 내년 여름엔 나랑 같이 일하는 거야.”","다음 여름, 베짱이는 아침에는 일하고 저녁에는 노래했다. 그리고 개미도 무언가를 배웠다. 처음으로 개미는 잠시 일을 멈추고 베짱이의 노래를 즐겼다."],"gloss":[["a long time away","한참 먼 (미래)"],["cover","덮다"],["hardly","거의 ~않다"],["for a while","잠시 동안"]],"keySentences":[["He was so hungry and cold that he could hardly move.","so + 형용사 + that ~ = 너무 ~해서 …하다 / hardly = 거의 ~않다 (이미 부정의 뜻이라 not 을 같이 쓰지 않아요)"],["You should save some food, too.","should = ~하는 게 좋겠다 (부드러운 조언)"],["Winter is a long time away!","“겨울은 한참 남았어!” — 미래가 아직 멀다는 표현"],["For the first time, she stopped working for a while.","for the first time = 처음으로 / stop + ~ing = ~하는 것을 멈추다"]],"tf":[["The Ant was singing in the field.","F — 개미는 옥수수를 나르고 있었다."],["The Grasshopper thought winter was far away.","T"],["In winter, the Ant didn’t open the door.","F — 개미는 문을 열어 주었다."],["The next summer, the Grasshopper worked and sang.","T"]],"questions":[["What was the Ant carrying?","She was carrying a big piece of corn."],["Why didn’t the Ant sing with the Grasshopper?","Because she was saving food for the winter."],["What happened to the Grasshopper in winter?","He couldn’t find any food. He was very hungry and cold."],["What did the Ant learn at the end?","She learned to stop working for a while and enjoy music (life)."]],"listening":{"shadow":"6","dictation":[["A Grasshopper was ___ and singing in a green field.","jumping"],["She was ___ a big piece of corn on her back.","carrying"],["I’m ___ food for the winter.","saving"],["He was so hungry and cold that he could ___ move.","hardly"],["For the first time, she stopped working for a while and ___ his songs.","enjoyed"]]},"grammar":{"title":"과거진행형 vs 과거형 — 이야기의 배경과 사건","explain":["이야기는 대부분 과거형으로 진행됩니다. → He knocked on the door. (사건)","그때 “하고 있던 일(배경)”은 과거진행형 was/were + ~ing 로 씁니다. → A Grasshopper was jumping and singing. (배경)","두 가지를 함께 쓸 때: 배경(과거진행) + when + 사건(과거) → I was walking when I saw her.","기초 교재 17주차에서 배운 내용이에요. 이번에는 이야기 속에서 다시 확인해 보세요."],"examples":[["The Ant was carrying corn when the Grasshopper called her.","베짱이가 불렀을 때 개미는 옥수수를 나르고 있었다."],["It was snowing when he knocked on the door.","그가 문을 두드렸을 때 눈이 오고 있었다."],["I was cooking dinner when my phone rang.","저녁을 요리하고 있을 때 전화가 울렸다."],["What were you doing at 8 last night?","어젯밤 8시에 뭐 하고 있었어요?"]],"exercise":[["The Grasshopper (sing) when the Ant (walk) past.","was singing / walked"],["It (rain) when I (leave) home this morning.","was raining / left"],["What (you / do) at 10 last night?","were you doing"]]},"expressions":[["a lot of ~","많은 ~","There is a lot of food in the fridge."],["so ~ that …","너무 ~해서 …하다","I was so tired that I went to bed at 9."],["for the first time","처음으로","I saw the sea for the first time."],["for a while","잠시 동안","Let’s rest for a while."]],"speaking":{"retell":["summer – Grasshopper singing","Ant – carrying corn – saving food","Grasshopper – laughed","winter – snow – hungry","knocked on the door – begged","Ant – let him in","next summer – worked and sang"],"discuss":["Are you more like the Ant or the Grasshopper? Why?","Should the Ant help the Grasshopper? Why or why not?","Is it important to enjoy life now, or to save for the future?"],"model":["Are you more like the Ant or the Grasshopper?","I think I’m more like the Ant. I save money every month, and I always plan my week. But sometimes I work too hard and I feel tired. So I want to be a little like the Grasshopper, too. I think we need both work and fun."],"roleplay":"A: 겨울밤 문을 두드리는 베짱이 / B: 개미. 베짱이는 도와달라고 부탁하고, 개미는 조건을 말해 보세요."},"writing":{"task":"“다른 결말” 쓰기: 베짱이가 여름에 개미의 말을 들었다면? (80~100단어)","hints":["과거형으로 쓰기","대사(“ ”)를 1~2개 넣기","마지막 문장에 교훈 쓰기"],"model":["The Grasshopper listened to the Ant. “Maybe you’re right,” he said. The next day, he worked with the Ant in the morning. In the afternoon, he sang songs, and the songs made the Ant happy. When winter came, they had a lot of food. On cold nights, they sat together by the fire. The Grasshopper sang, and the Ant listened. Other animals came to hear his music, too.","The lesson: work and fun can go together."]},"quote":["“It is best to prepare for the days of need.” (Aesop)","필요한 날을 위해 미리 준비하는 것이 가장 좋다."]},{"week":2,"title":"벌거벗은 임금님","en":"The Emperor’s New Clothes","author":"Hans Christian Andersen (안데르센)","year":"1837","genre":"동화 (Fairy Tale)","intro":"덴마크 작가 안데르센의 대표작입니다. 옷을 너무 좋아하는 황제가 “바보에게는 보이지 않는 옷”이라는 사기꾼의 말에 속는 이야기예요. 모두가 진실을 알면서도 말하지 못할 때, 한 아이가 용기를 냅니다.","characters":[["The Emperor (황제)","새 옷을 무엇보다 좋아하는 황제"],["Two men (두 사기꾼)","보이지 않는 옷을 만든다고 속이는 사람들"],["The old minister (늙은 신하)","진실을 말하지 못하는 신하"],["A little child (아이)","진실을 말한 아이"]],"warmup":[["Have you ever agreed with something because everyone else did?","다른 사람들이 모두 그래서 동의한 적 있나요?"],["Is it easy to tell the truth to your boss?","상사에게 진실을 말하기 쉬운가요?"]],"vocab":[["emperor","황제","The emperor loved new clothes."],["clothes","옷","He had a lot of clothes."],["cloth","천, 옷감","They made beautiful cloth."],["magic","마법의","The cloth was magic."],["stupid","어리석은","Nobody wanted to look stupid."],["pretend","~인 척하다","They pretended to work."],["gold","금","The emperor gave them gold."],["minister","신하, 장관","He sent his old minister."],["lie","거짓말하다","The minister lied."],["wear","입다 (wore – worn)","He wore the new clothes."],["street","거리","People stood on the street."],["shout","외치다","The child shouted."],["whisper","속삭이다","People began to whisper."],["truth","진실","The child told the truth."],["proud","자랑스러운, 거만한","He walked on, proud and straight."]],"story":["Many years ago, there was an Emperor who loved new clothes. He didn’t care about his soldiers or his people. He only cared about his clothes. He had a different coat for every hour of the day.","One day, two men came to the city. “We can make the most beautiful cloth in the world,” they said. “And our cloth is magic. Stupid people can’t see it.”","“Wonderful!” thought the Emperor. “With these clothes, I can find out which of my men are stupid.” He gave the two men a lot of gold.","The two men started to “work.” But there was nothing in their machines. They only pretended to make cloth, and they kept the gold for themselves.","After a few days, the Emperor sent his old minister to see the cloth. The minister looked and looked, but he couldn’t see anything. “Oh no!” he thought. “Am I stupid? Nobody must know this.” So he said, “It’s beautiful! I love the colors!”","Then the Emperor went to see it. He couldn’t see anything, either. “Am I stupid?” he thought. But he said, “It’s wonderful! I love it!”","On the day of the big parade, the two men pretended to dress the Emperor. “The clothes are very light,” they said. “You will feel like you are wearing nothing.” Then the Emperor walked through the streets. All the people said, “What beautiful clothes!” Nobody wanted to look stupid.","Suddenly, a little child shouted, “But he isn’t wearing anything!” People began to whisper. Soon the whole city was shouting, “He isn’t wearing anything!”","The Emperor knew they were right. But he thought, “I must finish the parade.” So he walked on, even more proudly than before."],"ko":["아주 오래전, 새 옷을 무척 좋아하는 황제가 있었다. 황제는 병사들이나 백성들에게는 관심이 없었다. 오직 자기 옷에만 관심이 있었다. 하루 중 매 시간마다 다른 코트가 있을 정도였다.","어느 날, 두 남자가 그 도시에 왔다. “우리는 세상에서 가장 아름다운 옷감을 만들 수 있습니다.” 그들이 말했다. “게다가 우리 옷감은 마법의 옷감이죠. 어리석은 사람들 눈에는 보이지 않습니다.”","“훌륭하군!” 황제는 생각했다. “이 옷이 있으면 내 신하 중 누가 어리석은지 알아낼 수 있겠어.” 황제는 두 남자에게 금을 잔뜩 주었다.","두 남자는 “일”을 시작했다. 하지만 베틀에는 아무것도 없었다. 그들은 옷감을 짜는 척만 했고, 금은 자기들이 챙겼다.","며칠 후, 황제는 늙은 신하를 보내 옷감을 보게 했다. 신하는 보고 또 보았지만 아무것도 보이지 않았다. “이런!” 그는 생각했다. “내가 어리석은 건가? 아무도 이걸 알아서는 안 돼.” 그래서 그는 말했다. “아름답군요! 색깔이 정말 마음에 듭니다!”","그다음엔 황제가 직접 보러 갔다. 황제 역시 아무것도 보이지 않았다. “내가 어리석은 건가?” 황제는 생각했다. 하지만 이렇게 말했다. “훌륭하구나! 아주 마음에 든다!”","큰 행진이 있는 날, 두 남자는 황제에게 옷을 입히는 척했다. “이 옷은 아주 가볍습니다.” 그들이 말했다. “아무것도 안 입은 것처럼 느껴지실 겁니다.” 그리고 황제는 거리를 걸었다. 모든 사람이 말했다. “정말 아름다운 옷이야!” 아무도 어리석어 보이고 싶지 않았다.","갑자기 한 어린아이가 외쳤다. “하지만 임금님은 아무것도 안 입었잖아요!” 사람들이 수군거리기 시작했다. 곧 온 도시 사람들이 외쳤다. “임금님은 아무것도 안 입었다!”","황제는 사람들 말이 맞다는 것을 알았다. 하지만 이렇게 생각했다. “행진은 끝내야 해.” 그래서 황제는 전보다 훨씬 더 당당하게 계속 걸어갔다."],"gloss":[["care about","~에 관심을 가지다"],["find out","알아내다"],["for themselves","자기들을 위해"],["parade","행진"],["walk on","계속 걷다"]],"keySentences":[["Stupid people can’t see it.","“어리석은 사람들은 그것을 볼 수 없다” — 이 한 문장 때문에 아무도 진실을 말하지 못해요."],["Nobody must know this.","“아무도 이걸 알아서는 안 돼” — must 의 강한 의무"],["You will feel like you are wearing nothing.","feel like + 문장 = ~인 것처럼 느끼다"],["He walked on, even more proudly than before.","even + 비교급 = 훨씬 더 ~ / walk on = 계속 걷다"]],"tf":[["The Emperor cared a lot about his people.","F — 오직 옷에만 관심이 있었다."],["The two men kept the gold for themselves.","T"],["The minister said he couldn’t see the cloth.","F — 아름답다고 거짓말했다."],["A child told the truth.","T"]],"questions":[["What was special about the cloth?","It was magic. Stupid people couldn’t see it."],["Why did the minister lie?","Because he didn’t want people to think he was stupid."],["What did the people say at the parade?","They said, “What beautiful clothes!”"],["Why do you think a child told the truth first?","(예) Children are honest. They don’t worry about looking stupid."]],"listening":{"shadow":"7","dictation":[["He only ___ about his clothes.","cared"],["They only ___ to make cloth.","pretended"],["The minister looked and looked, but he couldn’t see ___.","anything"],["___ wanted to look stupid.","Nobody"],["But he isn’t ___ anything!","wearing"]]},"grammar":{"title":"pretend to / feel like — “~인 척하다, ~처럼 느끼다”","explain":["pretend to + 동사원형: ~하는 척하다 → They pretended to make cloth.","pretend not to + 동사원형: ~하지 않는 척하다 → She pretended not to see me.","feel like + 문장: ~인 것처럼 느끼다 → I feel like I’m flying.","feel like + ~ing: ~하고 싶다 (회화에서 자주 써요) → I feel like eating pizza."],"examples":[["He pretended to be asleep.","그는 자는 척했다."],["She pretended not to hear me.","그녀는 내 말을 못 들은 척했다."],["I feel like I’m in a dream.","꿈속에 있는 것 같아."],["I don’t feel like going out tonight.","오늘 밤엔 나가고 싶지 않아."]],"exercise":[["그는 아픈 척했다.","He pretended to be sick."],["오늘은 요리하고 싶지 않아.","I don’t feel like cooking today."],["The two men pretended ___ (work) all day.","to work"]]},"expressions":[["care about ~","~에 관심을 갖다","He only cares about money."],["find out","알아내다","I want to find out the truth."],["look + 형용사","~해 보이다","You look tired today."],["not ~ either","~도 아니다","I can’t swim, either."]],"speaking":{"retell":["Emperor – loved clothes","two men – magic cloth – stupid people can’t see it","gold – they pretended to work","minister & Emperor – saw nothing – lied","parade – people said “beautiful!”","child – “He isn’t wearing anything!”","Emperor – walked on proudly"],"discuss":["Why didn’t anyone tell the truth?","Can you think of a modern example? (회사, SNS, 유행 등)","What would you do if you were the old minister?"],"model":["Can you think of a modern example?","Yes. In meetings at work, sometimes the boss has a bad idea. But nobody says anything because they are afraid. Everyone pretends to like it. Later, the project fails. I think a good team needs people who can say, “I don’t think this will work.”"],"roleplay":"A: 진실을 말하고 싶은 늙은 신하 / B: 황제. 신하는 정중하게 진실을 말해 보세요. (I’m sorry, but… / To be honest, …)"},"writing":{"task":"황제의 일기: 행진이 끝난 그날 밤, 황제의 마음 쓰기 (80~100단어)","hints":["Dear Diary, 로 시작","감정 단어: embarrassed(창피한), angry, sorry","앞으로 바꿀 것 한 가지"],"model":["Dear Diary,","Today was the worst day of my life. I walked through the city with no clothes, and everyone saw me. When the child shouted, I wanted to run away. But I was too proud, so I kept walking.","Now I understand. There was no cloth! I lied because I didn’t want to look stupid, and my ministers lied for the same reason.","From tomorrow, I will listen to honest people. And I will give a present to that brave child."]},"quote":["“But he hasn’t got anything on!” a little child said. (Andersen)","“하지만 임금님은 아무것도 안 입었는걸!” 한 아이가 말했다."]},{"week":3,"title":"미운 오리 새끼","en":"The Ugly Duckling","author":"Hans Christian Andersen (안데르센)","year":"1843","genre":"동화 (Fairy Tale)","intro":"생김새가 다르다는 이유로 놀림받던 새끼 새가 춥고 긴 겨울을 견딘 뒤, 자신이 아름다운 백조라는 것을 알게 되는 이야기입니다. “다름”과 “성장”에 대한 이야기로 오랫동안 사랑받아 왔어요.","characters":[["The Duckling (새끼 새)","다른 새끼들과 달라 놀림받는 회색 새"],["Mother Duck (엄마 오리)","처음엔 감싸 주지만 점점 지치는 엄마"],["The swans (백조들)","마지막에 주인공을 받아 주는 하얀 새들"]],"warmup":[["Have you ever felt different from the people around you?","주변 사람들과 다르다고 느낀 적 있나요?"],["What makes people feel confident?","사람은 언제 자신감을 느낄까요?"]],"vocab":[["egg","알","There were five eggs in the nest."],["hatch","부화하다","The eggs began to hatch."],["ugly","못생긴","Everyone called him ugly."],["gray","회색의","He was big and gray."],["pond","연못","They swam in the pond."],["laugh at","~을 비웃다","The ducks laughed at him."],["bite","물다, 쪼다 (bit – bitten)","The hens bit him."],["run away","도망치다","He ran away from the farm."],["alone","혼자","He was alone all winter."],["lake","호수","He landed on the lake."],["wing","날개","He spread his wings."],["swan","백조","The swans were white and beautiful."],["reflection","(물에 비친) 모습","He saw his reflection in the water."],["shy","수줍은","He felt shy."],["proud","교만한, 자랑스러운","He was happy but not proud."]],"story":["It was summer on a farm. A Mother Duck was sitting on her eggs. One by one, the eggs began to hatch, and cute yellow ducklings came out. But the biggest egg didn’t open.","At last, it opened. A big, gray bird came out. “He’s so big and ugly,” said the Mother Duck. “He doesn’t look like the others.” But when they went to the pond, he swam better than all the others.","Life on the farm was hard for him. The other ducks laughed at him. The hens bit him. Even his brothers and sisters said, “Go away, you ugly thing!” In the end, his mother said, “I wish you were far away.”","So the little duckling ran away. He walked and walked. He met wild ducks, and they laughed at him, too. Hunters came, and he hid in the grass. He was very scared.","Autumn came. One evening, he saw some beautiful white birds in the sky. They had long necks and big white wings. They were flying to a warm country. He didn’t know their name, but he loved them.","Then winter came. It was very cold, and the duckling was alone. He had no friends and no home. It was the hardest time of his life.","At last, spring came, and the sun was warm again. The duckling opened his wings. They were big and strong now! He flew up into the sky and landed on a beautiful lake. There he saw three of the white birds.","“I’ll go to them,” he thought. “Maybe they will bite me because I’m ugly. But I don’t care.” He swam to them and put his head down.","Then he saw his reflection in the clear water. He wasn’t a gray, ugly bird anymore. He was a white swan! The other swans swam around him and touched him gently. Some children came to the lake. “Look!” they shouted. “There’s a new swan, and he’s the most beautiful one!”","The young swan felt shy and happy. But he wasn’t proud, because a good heart is never proud. He remembered the hard days, and now he was happier than ever."],"ko":["농장의 여름이었다. 엄마 오리가 알을 품고 있었다. 하나씩 알이 깨지기 시작했고, 귀여운 노란 새끼 오리들이 나왔다. 하지만 가장 큰 알은 열리지 않았다.","마침내 그 알이 열렸다. 크고 회색인 새 한 마리가 나왔다. “정말 크고 못생겼구나.” 엄마 오리가 말했다. “다른 애들이랑 하나도 안 닮았어.” 하지만 연못에 갔을 때, 그 새끼는 다른 누구보다 헤엄을 잘 쳤다.","농장 생활은 그에게 힘들었다. 다른 오리들은 그를 비웃었다. 암탉들은 그를 쪼았다. 심지어 형제자매들도 “저리 가, 이 못생긴 녀석아!”라고 말했다. 결국 엄마마저 “네가 멀리 가 버렸으면 좋겠구나.”라고 말했다.","그래서 어린 새끼 오리는 도망쳤다. 걷고 또 걸었다. 야생 오리들을 만났지만, 그들도 그를 비웃었다. 사냥꾼들이 오자 그는 풀숲에 숨었다. 그는 너무 무서웠다.","가을이 왔다. 어느 저녁, 그는 하늘에서 아름다운 하얀 새들을 보았다. 그 새들은 목이 길고 하얀 날개가 컸다. 따뜻한 나라로 날아가고 있었다. 그는 그 새들의 이름을 몰랐지만, 그 새들이 정말 좋았다.","그리고 겨울이 왔다. 몹시 추웠고, 새끼 오리는 혼자였다. 친구도 집도 없었다. 그의 삶에서 가장 힘든 시간이었다.","마침내 봄이 왔고, 햇살은 다시 따뜻해졌다. 새끼 오리는 날개를 펼쳤다. 날개는 이제 크고 튼튼했다! 그는 하늘로 날아올라 아름다운 호수에 내려앉았다. 그곳에서 그 하얀 새 세 마리를 보았다.","“저 새들에게 가 보자.” 그는 생각했다. “내가 못생겨서 날 쪼을지도 몰라. 하지만 상관없어.” 그는 그 새들에게 헤엄쳐 가서 고개를 숙였다.","그때 맑은 물에 비친 자신의 모습이 보였다. 그는 더 이상 회색의 못생긴 새가 아니었다. 하얀 백조였다! 다른 백조들이 그의 주위를 헤엄치며 다정하게 그를 어루만졌다. 아이들 몇 명이 호숫가로 왔다. “봐!” 아이들이 외쳤다. “새 백조가 있어. 저 백조가 제일 아름다워!”","젊은 백조는 수줍고 행복했다. 하지만 교만하지 않았다. 착한 마음은 결코 교만하지 않기 때문이다. 그는 힘들었던 날들을 기억했고, 이제 그 어느 때보다 행복했다."],"gloss":[["one by one","하나씩"],["at last","마침내"],["look like","~처럼 보이다, ~를 닮다"],["hide – hid","숨다"],["gently","다정하게, 부드럽게"]],"keySentences":[["He swam better than all the others.","비교급 + than all the others = 다른 누구보다 더 ~"],["I wish you were far away.","I wish + 과거형 = 현재와 다른 소망 (“네가 멀리 있으면 좋겠다” — 아주 슬픈 말)"],["He wasn’t a gray, ugly bird anymore.","not ~ anymore = 더 이상 ~이 아니다"],["He was happier than ever.","비교급 + than ever = 그 어느 때보다 더 ~"]],"tf":[["The biggest egg opened first.","F — 가장 늦게 열렸다."],["The duckling was a good swimmer.","T"],["The wild ducks were kind to him.","F — 그들도 비웃었다."],["At the end, the swan became proud.","F — 행복했지만 교만하지 않았다."]],"questions":[["How did the farm animals treat the duckling?","They laughed at him and bit him."],["Why did he run away?","Because everyone was mean to him, even his family."],["What did he see in the water?","He saw his reflection. He was a swan."],["What do you think the story teaches us?","(예) Don’t judge people by how they look. / Hard times can help us grow."]],"listening":{"shadow":"9","dictation":[["But the ___ egg didn’t open.","biggest"],["But when they went to the pond, he swam ___ than all the others.","better"],["The other ducks ___ at him.","laughed"],["It was the ___ time of his life.","hardest"],["He ___ a gray, ugly bird anymore.","wasn’t"]]},"grammar":{"title":"I wish ~ — 현재의 소망과 과거의 후회","explain":["I wish + 과거형: 지금 사실과 다른 소망 → I wish I were taller. (지금 키가 크지 않음)","be동사는 주어와 상관없이 were 를 주로 써요. → I wish it were Friday.","I wish + had + p.p.: 지나간 일에 대한 후회 → I wish I had studied harder.","hope 는 실제로 가능한 일에 써요. → I hope you feel better soon."],"examples":[["I wish I had more free time.","자유 시간이 더 있으면 좋을 텐데."],["I wish I could speak English well.","영어를 잘하면 좋을 텐데."],["I wish I hadn’t eaten so much.","그렇게 많이 먹지 말걸."],["I hope it doesn’t rain tomorrow.","내일 비가 안 오면 좋겠다."]],"exercise":[["수영을 잘하면 좋을 텐데.","I wish I could swim well."],["어제 일찍 잘걸.","I wish I had gone to bed early yesterday."],["I (wish / hope) you pass the test.","hope"]]},"expressions":[["one by one","하나씩","The guests left one by one."],["in the end","결국","In the end, we went home."],["not ~ anymore","더 이상 ~않다","I don’t live there anymore."],["than ever","그 어느 때보다","She looks happier than ever."]],"speaking":{"retell":["big egg – gray, ugly bird","farm – laughed at, bit him","ran away – hunters – scared","autumn – saw white birds","cold winter – alone","spring – strong wings – lake","reflection – a swan!"],"discuss":["Why do people laugh at others who are different?","Did the duckling change, or did his place change?","Talk about a hard time that helped you grow."],"model":["Talk about a hard time that helped you grow.","When I started my first job, I made a lot of mistakes. I felt like an ugly duckling. But I didn’t give up. I asked many questions and practiced every day. After one year, I was good at my job. Now I know that hard times can make us stronger."],"roleplay":"A: 봄에 백조가 된 주인공 / B: 농장의 엄마 오리. 다시 만난 두 새의 대화를 만들어 보세요."},"writing":{"task":"“나의 미운 오리 새끼 시절” — 힘들었지만 성장한 경험 (100단어)","hints":["When I was ~, I felt like an ugly duckling because ~.","어떻게 견뎠는지","지금은 어떻게 생각하는지"],"model":["When I was in middle school, I felt like an ugly duckling. I was very shy, and I wasn’t good at sports. Some classmates laughed at me. I was often alone.","But I loved drawing. Every day after school, I drew pictures in my notebook. One day, my teacher saw my drawings and put them on the wall. Everyone liked them!","Now I work as a designer. I still remember those hard days, but I am thankful for them. They made me who I am."]},"quote":["“It doesn’t matter if you are born in a duck yard, if you come from a swan’s egg.” (Andersen)","오리 농장에서 태어났어도, 백조의 알에서 나왔다면 상관없다."]},{"week":4,"title":"어부와 그의 아내","en":"The Fisherman and His Wife","author":"The Brothers Grimm (그림 형제)","year":"1812","genre":"민담 (Folk Tale)","intro":"그림 형제가 모은 독일 민담입니다. 마법의 물고기 덕분에 소원을 이룰 때마다 더 큰 것을 바라는 아내의 이야기예요. 같은 장면이 반복되면서 점점 커지는 구조라 읽기와 말하기 연습에 아주 좋아요.","characters":[["The fisherman (어부)","가난하지만 만족하며 사는 착한 어부"],["His wife (아내)","점점 더 큰 것을 바라는 어부의 아내"],["The fish (물고기)","소원을 들어주는 마법의 물고기"]],"warmup":[["If you could have one wish, what would it be?","소원 하나를 빌 수 있다면?"],["Does more money always make people happier?","돈이 많으면 항상 더 행복할까요?"]],"vocab":[["fisherman","어부","A poor fisherman lived by the sea."],["hut","오두막","They lived in a small hut."],["catch","잡다 (caught – caught)","He caught a big fish."],["let ~ go","~을 놓아주다","Please let me go."],["wish","소원; 바라다","Didn’t you make a wish?"],["house","집","She wanted a nice house."],["castle","성","Now she wanted a castle."],["king","왕","She wanted to be king."],["queen","여왕","She became queen."],["greedy","욕심 많은","His wife became greedy."],["happy with","~에 만족하는","She was never happy with anything."],["dark","어두운","The sea was dark."],["storm","폭풍","A big storm came."],["afraid","두려워하는","The fisherman was afraid."],["still","여전히, 아직도","They are still there."]],"story":["Once upon a time, a poor fisherman and his wife lived in a small, dirty hut by the sea. Every day, the fisherman went fishing.","One day, he caught a big fish. To his surprise, the fish spoke. “Please let me go,” it said. “I’m not a real fish. I’m a magic prince.” The fisherman was kind, so he let the fish go.","When he got home, he told his wife. “Didn’t you make a wish?” she asked. “No,” he said. “Go back and ask for a nice little house!” said his wife.","The fisherman didn’t want to, but he went back to the sea. He called the fish, and it came. “What does she want?” asked the fish. “A nice little house.” “Go home,” said the fish. “She has it already.” And it was true! There was a pretty house with a garden.","For two weeks, his wife was happy. Then she said, “This house is too small. I want a big castle. Go and ask the fish.” The fisherman went. The sea was dark blue now. The fish gave her a castle.","But the next morning, she said, “I want to be queen!” The sea was gray now, but the fish made her queen. Soon she wanted more and more. Each time, the sea became darker, and the fisherman became more afraid.","One morning, she watched the sun come up. “I want to make the sun and the moon rise!” she said. “Go to the fish!”","The fisherman went. A terrible storm was blowing. The waves were as high as mountains. He shouted his wife’s wish into the wind.","“Go home,” said the fish. “She is in her dirty hut again.” And they are still there today."],"ko":["옛날 옛적에, 가난한 어부와 그의 아내가 바닷가의 작고 더러운 오두막에 살았다. 어부는 매일 고기를 잡으러 갔다.","어느 날, 어부는 커다란 물고기를 잡았다. 놀랍게도 그 물고기가 말을 했다. “제발 놓아주세요.” 물고기가 말했다. “저는 진짜 물고기가 아니에요. 마법에 걸린 왕자랍니다.” 어부는 착했기 때문에 물고기를 놓아주었다.","집에 돌아와 어부는 아내에게 이야기했다. “소원은 안 빌었어요?” 아내가 물었다. “아니.” 어부가 말했다. “돌아가서 멋진 작은 집을 달라고 해요!” 아내가 말했다.","어부는 가고 싶지 않았지만 바다로 돌아갔다. 물고기를 부르자 물고기가 나타났다. “그녀가 무엇을 원하나요?” 물고기가 물었다. “멋진 작은 집이요.” “집으로 가세요.” 물고기가 말했다. “벌써 생겼답니다.” 정말이었다! 정원이 있는 예쁜 집이 있었다.","2주 동안 아내는 행복했다. 그러다 아내가 말했다. “이 집은 너무 작아요. 큰 성을 갖고 싶어요. 가서 물고기에게 부탁해요.” 어부는 갔다. 바다는 이제 짙은 파란색이었다. 물고기는 아내에게 성을 주었다.","하지만 다음 날 아침, 아내가 말했다. “여왕이 되고 싶어요!” 바다는 이제 회색이었지만, 물고기는 아내를 여왕으로 만들어 주었다. 곧 아내는 점점 더 많은 것을 원했다. 그때마다 바다는 더 어두워졌고, 어부는 더 두려워졌다.","어느 날 아침, 아내는 해가 뜨는 것을 바라보았다. “나도 해와 달을 뜨게 하고 싶어요!” 아내가 말했다. “물고기에게 가요!”","어부는 갔다. 무시무시한 폭풍이 불고 있었다. 파도는 산처럼 높았다. 어부는 바람 속으로 아내의 소원을 외쳤다.","“집으로 가세요.” 물고기가 말했다. “그녀는 다시 더러운 오두막에 있답니다.” 그리고 그들은 오늘날까지도 그곳에 살고 있다."],"gloss":[["once upon a time","옛날 옛적에"],["to his surprise","놀랍게도"],["already","이미, 벌써"],["come up / rise","(해가) 뜨다"],["wave","파도"]],"keySentences":[["To his surprise, the fish spoke.","To one’s surprise = 놀랍게도"],["She has it already.","“그녀는 이미 그걸 가졌다” — 소원이 바로 이루어졌다는 뜻"],["Each time, the sea became darker, and the fisherman became more afraid.","each time = 매번 / 비교급 두 개로 긴장이 커지는 느낌을 줘요"],["The waves were as high as mountains.","as + 형용사 + as ~ = ~만큼 …한"]],"tf":[["The fisherman made a wish right away.","F — 처음엔 아무 소원도 빌지 않았다."],["The fish was really a prince.","T"],["The wife was happy with the castle forever.","F — 곧 여왕이 되고 싶어 했다."],["At the end, they lived in the dirty hut again.","T"]],"questions":[["Why did the fisherman let the fish go?","Because the fish could talk and he was kind."],["List the wife’s wishes in order.","a little house → a castle → queen → to make the sun and moon rise"],["How did the sea change?","It became darker and darker, and finally there was a terrible storm."],["What is the lesson of the story?","(예) If you are too greedy, you can lose everything."]],"listening":{"shadow":"6","dictation":[["One day, he ___ a big fish.","caught"],["Please let me ___.","go"],["Didn’t you make a ___?","wish"],["Soon she wanted more and ___.","more"],["The waves were as ___ as mountains.","high"]]},"grammar":{"title":"비교급 and 비교급 / as ~ as — 점점 더 ~, ~만큼","explain":["비교급 and 비교급: 점점 더 ~ → darker and darker / more and more","긴 형용사는 more and more + 형용사 → more and more afraid","as + 형용사 + as: ~만큼 …한 → as high as mountains","not as ~ as: ~만큼 …하지 않은 → The hut was not as big as the castle."],"examples":[["The sea became darker and darker.","바다는 점점 더 어두워졌다."],["She wanted more and more.","그녀는 점점 더 많이 원했다."],["English is getting easier and easier.","영어가 점점 쉬워지고 있다."],["My room is not as big as yours.","내 방은 네 방만큼 크지 않다."]],"exercise":[["날씨가 점점 추워지고 있다.","It’s getting colder and colder."],["그는 점점 더 바빠졌다.","He became busier and busier."],["이 가방은 저 가방만큼 비싸다.","This bag is as expensive as that one."]]},"expressions":[["once upon a time","옛날 옛적에","Once upon a time, there lived a king."],["to one’s surprise","놀랍게도","To my surprise, she said yes."],["make a wish","소원을 빌다","Close your eyes and make a wish."],["more and more","점점 더 많이","More and more people are learning English."]],"speaking":{"retell":["poor fisherman – dirty hut","talking fish – let it go","wife: “Ask for a house!”","house → castle → queen","sea – darker and darker","“I want to make the sun rise!” – storm","back in the dirty hut"],"discuss":["Who is more responsible, the fisherman or his wife?","Why are some people never happy with what they have?","If you met the magic fish, what would you ask for?"],"model":["Who is more responsible?","Most people blame the wife, but I think the fisherman is also responsible. He knew her wishes were wrong, but he never said “no.” If he said “no” once, maybe they could keep the nice house. Sometimes saying “no” is the kindest thing."],"roleplay":"A: 어부 / B: 아내. 이번에는 어부가 성을 원하는 아내를 설득해 작은 집에 만족하게 만들어 보세요."},"writing":{"task":"1개월 차 마무리 — 나만의 짧은 우화 쓰기 (120단어)","hints":["동물 두 마리 이상 등장","Once upon a time 으로 시작","마지막 줄에 Moral(교훈)"],"model":["The Rabbit and the Phone","Once upon a time, there was a young Rabbit. He loved his phone more than anything. He looked at it when he ate, when he walked, and even when he talked to his friends.","One day, the Owl said, “Rabbit, look! The flowers are beautiful.” But the Rabbit didn’t look up. The next week, his friends went on a trip to the mountains. The Rabbit didn’t know about it because he was watching videos.","That night, his phone battery died. The forest was dark and quiet, and he felt lonely. The next morning, he left his phone at home and ran to find his friends.","Moral: Don’t miss the real world because of a small screen."]},"quote":["“Go home. She is sitting in her dirty hut again.” (Grimm)","“집으로 가라. 그녀는 다시 더러운 오두막에 앉아 있다.”"]}],"review":{"vocab":[["pretend","~인 척하다"],["truth","진실"],["hatch","부화하다"],["reflection","비친 모습"],["greedy","욕심 많은"],["beg","간청하다"],["weak","약한"],["proud","교만한, 자랑스러운"],["castle","성"],["storm","폭풍"]],"grammar":[["The Ant (carry) corn when the Grasshopper (call).","was carrying / called"],["He pretended ___ (sleep).","to sleep"],["I wish I ___ (be) taller.","were"],["The sea became ___ and ___. (dark)","darker / darker"],["He was ___ tired ___ he could hardly walk.","so / that"]],"project":{"title":"1개월 차 프로젝트 — 줄거리 요약과 교훈","steps":["네 작품 중 가장 좋았던 이야기를 하나 고르세요.","줄거리를 영어 5문장으로 요약하세요.","가장 기억에 남는 장면과 이유를 2~3문장으로 쓰세요.","이야기의 교훈과 내 삶의 연결을 2문장으로 쓰세요.","보지 않고 1분 동안 말하며 녹음하세요."]}}},{"month":2,"title":"명작 동화 — 감정과 장면을 읽다","level":"B1 입문 (지문 410~510단어)","intro":"두 번째 달에는 오스카 와일드, 안데르센, 콜로디의 명작 동화를 읽습니다. 1개월 차보다 조금 길고, 인물의 감정과 장면 묘사가 더 풍부해요. 관계대명사, used to, 지각동사, 간접화법처럼 문장을 길고 자연스럽게 만드는 문법을 이야기 속에서 익힙니다.","skill":"읽기 전략: 문단마다 핵심 내용을 우리말 한 줄로 메모하며 읽으세요.","units":[{"week":5,"title":"행복한 왕자","en":"The Happy Prince","author":"Oscar Wilde (오스카 와일드)","year":"1888","genre":"문학 동화 (Literary Fairy Tale)","intro":"아일랜드 작가 오스카 와일드의 동화입니다. 금과 보석으로 덮인 왕자 동상과 작은 제비가 가난한 사람들을 위해 자신이 가진 모든 것을 나누어 줍니다. 희생과 진정한 아름다움에 대한 슬프고 아름다운 이야기예요.","characters":[["The Happy Prince (행복한 왕자)","도시 위에 서 있는 금빛 왕자 동상"],["The Swallow (제비)","따뜻한 이집트로 떠나려다 왕자를 돕게 된 작은 새"],["The Mayor (시장)","겉모습만 중요하게 여기는 시장"]],"warmup":[["What makes a person truly beautiful?","사람을 진정으로 아름답게 만드는 것은?"],["Have you ever helped someone who was in trouble?","어려운 사람을 도운 적 있나요?"]],"vocab":[["statue","동상","The statue stood in the city."],["cover","덮다","He was covered with gold."],["jewel","보석","He had jewels for eyes."],["swallow","제비","A little swallow flew over the city."],["cry","울다","Why are you crying?"],["poor","가난한","A poor woman lived there."],["sick","아픈","Her son was sick."],["blind","눈이 먼","Now the Prince was blind."],["leaf","(금박) 조각, 잎 (pl. leaves)","He gave away every leaf of gold."],["snow","눈","Then the snow came."],["die","죽다","The little bird died."],["heart","심장, 마음","His heart broke in two."],["mayor","시장","The Mayor walked by."],["angel","천사","God sent an angel."],["precious","소중한","These are the most precious things."]],"story":["High above the city stood the statue of the Happy Prince. He was covered with gold. His eyes were two blue jewels, and a big red jewel shone on his sword. Everyone thought he was beautiful.","One night, a little Swallow flew over the city. His friends were already in warm Egypt, but he was late. He decided to sleep at the feet of the statue. Then a drop of water fell on him. The Happy Prince was crying!","“Why are you crying?” asked the Swallow. “When I was alive,” said the Prince, “I lived in a palace where nobody was ever sad. I didn’t know about the poor. But now I stand here, and I can see all the sad things in my city.”","“Far away, there is a poor woman who makes dresses. Her little boy is sick, and she has no money. Little Swallow, will you take the red jewel from my sword to her?” The Swallow wanted to go to Egypt, but the Prince looked so sad. So he took the jewel to the poor woman.","The next night, the Prince asked again. A young writer was too cold and hungry to work. “Take one of my eyes to him,” said the Prince. The night after that, he gave his other eye to a little girl who was crying in the street. Now the Prince was blind. “I will stay with you forever,” said the Swallow.","Every day, the Swallow flew over the city and told the Prince about the poor people. Leaf by leaf, he took the gold from the statue and gave it to them. The Prince became gray and dull, but the children of the city laughed and played.","Then the snow came. The poor little Swallow got colder and colder, but he didn’t leave the Prince. At last, he kissed the Prince and fell down dead at his feet. At that moment, there was a strange sound inside the statue. The Prince’s heart broke in two.","The next morning, the Mayor walked by. “The Happy Prince looks terrible!” he said. “He looks like a beggar!” They took the statue down and melted it. But the broken heart didn’t melt, so they threw it away with the dead bird.","“Bring me the two most precious things in the city,” God said to an angel. The angel brought the broken heart and the dead bird. “You are right,” said God. “They will live with me forever.”"],"ko":["도시 높은 곳에 행복한 왕자의 동상이 서 있었다. 왕자는 온몸이 금으로 덮여 있었다. 두 눈은 파란 보석이었고, 칼에는 커다란 빨간 보석이 빛나고 있었다. 모두가 왕자가 아름답다고 생각했다.","어느 날 밤, 작은 제비 한 마리가 도시 위를 날고 있었다. 친구들은 이미 따뜻한 이집트에 가 있었지만, 제비는 늦었다. 제비는 동상의 발치에서 자기로 했다. 그때 물방울 하나가 제비 위로 떨어졌다. 행복한 왕자가 울고 있었던 것이다!","“왜 울고 있어요?” 제비가 물었다. “내가 살아 있을 때,” 왕자가 말했다. “나는 아무도 슬퍼하지 않는 궁전에서 살았어. 가난한 사람들에 대해서는 몰랐지. 하지만 지금 여기 서 있으니, 우리 도시의 슬픈 모습이 모두 보여.”","“저 멀리, 옷을 만드는 가난한 여인이 있어. 그녀의 어린 아들은 아픈데, 그녀에겐 돈이 없어. 작은 제비야, 내 칼에 있는 빨간 보석을 그녀에게 가져다주겠니?” 제비는 이집트에 가고 싶었지만, 왕자가 너무 슬퍼 보였다. 그래서 그는 보석을 가난한 여인에게 가져다주었다.","다음 날 밤, 왕자는 또 부탁했다. 한 젊은 작가가 너무 춥고 배고파서 일을 할 수 없었다. “내 눈 하나를 그에게 가져다주렴.” 왕자가 말했다. 그다음 날 밤, 왕자는 길에서 울고 있는 어린 소녀에게 나머지 눈마저 주었다. 이제 왕자는 앞을 볼 수 없었다. “제가 영원히 곁에 있을게요.” 제비가 말했다.","매일 제비는 도시 위를 날아다니며 왕자에게 가난한 사람들에 대해 이야기했다. 한 조각 한 조각, 제비는 동상에서 금을 떼어내 그들에게 주었다. 왕자는 회색빛으로 칙칙해졌지만, 도시의 아이들은 웃으며 뛰어놀았다.","그러다 눈이 내렸다. 불쌍한 작은 제비는 점점 더 추워졌지만, 왕자를 떠나지 않았다. 마침내 제비는 왕자에게 입을 맞추고 그의 발치에 떨어져 죽었다. 그 순간, 동상 안에서 이상한 소리가 났다. 왕자의 심장이 두 조각으로 깨진 것이다.","다음 날 아침, 시장이 지나갔다. “행복한 왕자 꼴이 엉망이군!” 시장이 말했다. “거지 같아 보여!” 사람들은 동상을 끌어내려 녹였다. 하지만 깨진 심장은 녹지 않아서, 죽은 새와 함께 버려졌다.","“이 도시에서 가장 소중한 것 두 가지를 가져오너라.” 하느님이 천사에게 말했다. 천사는 깨진 심장과 죽은 새를 가져왔다. “옳게 골랐구나.” 하느님이 말했다. “그들은 영원히 나와 함께 살 것이다.”"],"gloss":[["shine – shone","빛나다"],["palace","궁전"],["dull","칙칙한"],["beggar","거지"],["melt","녹다, 녹이다"],["throw away","버리다"]],"keySentences":[["I lived in a palace where nobody was ever sad.","관계부사 where: “아무도 슬퍼하지 않는 궁전” — 장소를 설명해요"],["A young writer was too cold and hungry to work.","too ~ to … = 너무 ~해서 …할 수 없다"],["Leaf by leaf, he took the gold from the statue.","leaf by leaf = 한 조각 한 조각씩 (one by one 과 같은 구조)"],["The Swallow got colder and colder.","비교급 and 비교급 = 점점 더 ~ (4주차 복습)"]],"tf":[["The Swallow was already in Egypt.","F — 늦어서 혼자 남아 있었다."],["The Prince didn’t know about the poor when he was alive.","T"],["The red jewel went to the young writer.","F — 아픈 아이의 엄마에게 갔다."],["The Prince’s heart didn’t melt.","T"]],"questions":[["Why was the Prince crying?","Because he could see all the sad things in his city."],["Why did the Swallow stay with the Prince?","Because the Prince was blind, and the Swallow loved him."],["What did the Mayor think of the statue at the end?","He thought it looked terrible, like a beggar."],["Why were the heart and the bird “precious”?","(예) Because they showed true love and sacrifice."]],"listening":{"shadow":"7","dictation":[["High above the city ___ the statue of the Happy Prince.","stood"],["I lived in a palace ___ nobody was ever sad.","where"],["Now the Prince was ___.","blind"],["The poor little Swallow got ___ and colder, but he didn’t leave the Prince.","colder"],["Bring me the two most ___ things in the city.","precious"]]},"grammar":{"title":"관계대명사 who / which / where — 설명을 덧붙이기","explain":["사람을 설명할 때 → who: a poor woman who makes dresses (옷을 만드는 가난한 여인)","사물·동물을 설명할 때 → which 또는 that: the jewel which was on his sword","장소를 설명할 때 → where: a palace where nobody was sad","두 문장을 하나로: There is a girl. + She is crying. → There is a girl who is crying."],"examples":[["He gave his eye to a girl who was crying.","그는 울고 있는 소녀에게 눈을 주었다."],["This is the statue which stands in the city.","이것이 도시에 서 있는 동상이다."],["I visited the town where I was born.","나는 내가 태어난 마을을 방문했다."],["The man who lives next door is a doctor.","옆집에 사는 남자는 의사다."]],"exercise":[["I have a friend. She lives in Busan. (한 문장으로)","I have a friend who lives in Busan."],["This is the café ___ we first met.","where"],["I lost the bag ___ my mom gave me.","which (that)"]]},"expressions":[["too ~ to …","너무 ~해서 …할 수 없다","I’m too tired to cook."],["look like ~","~처럼 보이다","He looks like a movie star."],["at that moment","그 순간","At that moment, the phone rang."],["give away","나누어 주다","She gave away all her old clothes."]],"speaking":{"retell":["golden statue – jewels","Swallow – late for Egypt – the Prince was crying","red jewel → poor woman","eyes → writer, little girl – blind","gold leaves → the poor","snow – Swallow died – heart broke","Mayor – angel – two precious things"],"discuss":["Was the Prince really happy when he was alive?","Why did the Swallow stay, even in the cold?","Do people today judge others by how they look?"],"model":["Was the Prince really happy when he was alive?","I don’t think so. He had a lot of money and fun, but he didn’t know about other people’s pain. After he died, he became sad, but he also started to help people. I think he found real happiness when he gave everything away."],"roleplay":"A: 왕자 / B: 이집트로 떠나고 싶은 제비. 왕자는 하룻밤만 더 있어 달라고 부탁하고, 제비는 떠나야 하는 이유를 말해 보세요."},"writing":{"task":"제비의 편지: 이집트의 친구들에게 왜 떠나지 않는지 쓰기 (100~120단어)","hints":["Dear friends, 로 시작","왕자를 만난 날, 한 일, 지금의 마음","관계대명사 who / which 를 2번 이상"],"model":["Dear friends,","I know you are waiting for me in Egypt. But I am not coming. I met a statue who cries for his city. He is called the Happy Prince, but he is very sad.","Every night, he asks me to take his treasures to people who are poor. I took his red jewel to a sick boy’s mother, and I gave his eyes to a writer and a little girl. Now he is blind, so he needs me.","It is very cold here, and I am getting weak. But I am doing something important.","With love,","Your little Swallow"]},"quote":["“There is no mystery so great as misery.” (Oscar Wilde)","가난과 고통만큼 큰 신비는 없다."]},{"week":6,"title":"욕심쟁이 거인","en":"The Selfish Giant","author":"Oscar Wilde (오스카 와일드)","year":"1888","genre":"문학 동화 (Literary Fairy Tale)","intro":"아이들을 정원에서 쫓아낸 거인의 정원에는 봄이 오지 않습니다. 거인이 마음을 열자 다시 꽃이 피어요. “나눔”과 “마음의 변화”를 계절의 변화로 아름답게 보여 주는 이야기입니다.","characters":[["The Giant (거인)","7년 만에 돌아와 아이들을 쫓아낸 거인"],["The children (아이들)","거인의 정원에서 놀던 아이들"],["The little boy (작은 소년)","나무에 오르지 못해 울던 아이"]],"warmup":[["Where did you play when you were a child?","어릴 때 어디서 놀았나요?"],["What does “selfish” mean? Give an example.","“이기적인”의 예를 들어 보세요."]],"vocab":[["giant","거인","The giant was very tall."],["garden","정원","It was a beautiful garden."],["selfish","이기적인","He was a selfish giant."],["wall","담","He built a high wall."],["sign","표지판","He put up a sign."],["spring","봄","Spring came to the country."],["bloom","꽃이 피다","The trees didn’t bloom."],["frost","서리","The frost painted the trees white."],["hole","구멍","The children came through a hole."],["branch","나뭇가지","A child sat on every branch."],["climb","오르다","He couldn’t climb the tree."],["melt","(마음이) 녹다","The Giant’s heart melted."],["knock down","허물다","He knocked down the wall."],["used to","~하곤 했다","The children used to play here."],["paradise","천국, 낙원","Come to my garden, Paradise."]],"story":["Every afternoon after school, the children used to play in the Giant’s garden. It was a large, lovely garden with soft green grass and beautiful flowers. There were twelve peach trees, and in spring they were full of pink and white flowers. Birds sang in the trees. “We are so happy here!” said the children.","One day, the Giant came back. He had visited his friend for seven years. When he saw the children, he shouted, “What are you doing here? This is my garden! Nobody can play here but me!” The children ran away. The Giant built a high wall around the garden and put up a sign: KEEP OUT. He was a very selfish Giant.","Now the children had nowhere to play. They used to walk around the high wall and talk about the beautiful garden inside. “We were so happy there,” they said.","Then spring came, and there were flowers and birds all over the country. But in the Giant’s garden, it was still winter. The birds didn’t sing there because there were no children, and the trees forgot to bloom. Snow covered the grass, and the frost painted the trees white. The cold North Wind came to stay, too.","“Why is spring so late?” said the Giant, looking out at his cold, white garden. But spring never came, and summer never came.","One morning, the Giant heard beautiful music. It was a little bird singing outside his window. He looked out and saw a wonderful sight. The children had come in through a little hole in the wall, and they were sitting in the trees. The trees were so happy that they were covered with flowers. Spring had come back!","But in one corner, it was still winter. A very small boy was standing there. He was too small to climb the tree, and he was crying. The Giant’s heart melted. “How selfish I have been!” he said. “Now I know why spring didn’t come.”","He went out quietly. The other children were afraid and ran away, but the little boy didn’t see him, because his eyes were full of tears. The Giant gently put him up into the tree. At once, the tree bloomed, and the little boy kissed the Giant. When the other children saw this, they came back, and spring came with them. “It’s your garden now, children,” said the Giant, and he knocked down the wall.","From then on, the Giant played with the children every day. But the little boy never came back, and the Giant missed him very much. Many years later, when the Giant was very old, he saw the little boy again under a tree full of white flowers. “Once you let me play in your garden,” said the boy. “Today you will come with me to my garden, which is Paradise.” That afternoon, the children found the Giant lying under the tree, covered with white flowers."],"ko":["매일 오후 학교가 끝나면 아이들은 거인의 정원에서 놀곤 했다. 부드러운 초록 잔디와 아름다운 꽃이 있는 크고 멋진 정원이었다. 복숭아나무가 열두 그루 있었는데, 봄이면 분홍색과 흰색 꽃으로 가득했다. 나무에서는 새들이 노래했다. “여기 있으면 정말 행복해!” 아이들이 말했다.","어느 날 거인이 돌아왔다. 그는 7년 동안 친구 집에 다녀왔던 것이다. 아이들을 보자 거인이 소리쳤다. “여기서 뭐 하는 거야? 여긴 내 정원이야! 나 말고는 아무도 여기서 놀 수 없어!” 아이들은 도망쳤다. 거인은 정원 둘레에 높은 담을 쌓고 표지판을 세웠다. “출입 금지.” 그는 아주 이기적인 거인이었다.","이제 아이들은 놀 곳이 없었다. 아이들은 높은 담 주위를 걸으며 안에 있는 아름다운 정원 이야기를 하곤 했다. “거기서 우린 정말 행복했는데.” 아이들이 말했다.","그리고 봄이 왔고, 온 나라에 꽃과 새가 가득했다. 하지만 거인의 정원은 여전히 겨울이었다. 아이들이 없어서 새들은 그곳에서 노래하지 않았고, 나무들은 꽃 피우는 것을 잊어버렸다. 눈이 잔디를 덮었고, 서리가 나무를 하얗게 칠했다. 차가운 북풍도 머물러 왔다.","“왜 이렇게 봄이 늦지?” 거인이 차갑고 하얀 정원을 내다보며 말했다. 하지만 봄은 결코 오지 않았고, 여름도 오지 않았다.","어느 날 아침, 거인은 아름다운 음악 소리를 들었다. 작은 새 한 마리가 창밖에서 노래하고 있었다. 밖을 내다본 거인은 멋진 광경을 보았다. 아이들이 담에 난 작은 구멍으로 들어와 나무 위에 앉아 있었다. 나무들은 너무 기뻐서 꽃으로 뒤덮였다. 봄이 돌아온 것이다!","하지만 한쪽 구석은 여전히 겨울이었다. 아주 작은 소년이 그곳에 서 있었다. 소년은 너무 작아서 나무에 오를 수 없었고, 울고 있었다. 거인의 마음이 녹았다. “내가 얼마나 이기적이었나!” 그가 말했다. “이제 봄이 왜 오지 않았는지 알겠어.”","거인은 조용히 밖으로 나갔다. 다른 아이들은 무서워서 도망쳤지만, 작은 소년은 눈물이 가득해서 거인을 보지 못했다. 거인은 소년을 살며시 나무 위에 올려 주었다. 그러자 곧바로 나무에 꽃이 피었고, 소년은 거인에게 입을 맞추었다. 이것을 본 다른 아이들이 돌아왔고, 아이들과 함께 봄도 왔다. “이제 이건 너희 정원이란다, 얘들아.” 거인은 이렇게 말하고 담을 허물었다.","그때부터 거인은 매일 아이들과 함께 놀았다. 하지만 그 작은 소년은 다시 오지 않았고, 거인은 소년을 무척 그리워했다. 여러 해가 흘러 거인이 아주 늙었을 때, 그는 하얀 꽃이 가득 핀 나무 아래에서 그 소년을 다시 보았다. “예전에 당신은 나를 당신 정원에서 놀게 해 주었지요.” 소년이 말했다. “오늘은 당신이 나와 함께 내 정원, 천국으로 가요.” 그날 오후, 아이들은 하얀 꽃에 덮인 채 나무 아래 누워 있는 거인을 발견했다."],"gloss":[["peach tree","복숭아나무"],["keep out","출입 금지"],["nowhere","아무 데도 없는"],["sight","광경"],["gently","살며시"],["from then on","그때부터"]],"keySentences":[["Nobody can play here but me!","but = except (~외에는). “나 말고는 아무도 놀 수 없어!”"],["He had visited his friend for seven years.","과거완료 had + p.p.: 이야기 시점(돌아온 날)보다 더 이전의 일"],["The trees were so happy that they were covered with flowers.","so ~ that … (1주차 복습) / be covered with ~ = ~로 덮이다"],["How selfish I have been!","How + 형용사 + 주어 + 동사! = 감탄문 “내가 얼마나 ~했던가!”"]],"tf":[["The Giant had been away for seven years.","T"],["Spring came to the Giant’s garden on time.","F — 거인의 정원은 계속 겨울이었다."],["The little boy ran away from the Giant.","F — 눈물 때문에 거인을 보지 못했다."],["The Giant built a new wall at the end.","F — 담을 허물었다."]],"questions":[["What did the Giant do when he came back?","He shouted at the children, built a high wall, and put up a sign."],["Why didn’t spring come to his garden?","Because there were no children there."],["What made the Giant’s heart melt?","He saw a little boy crying because he couldn’t climb the tree."],["What does the garden tell us about the Giant’s heart?","(예) When he was selfish, it was winter. When he shared, spring came."]],"listening":{"shadow":"6","dictation":[["Every afternoon after school, the children ___ to play in the Giant’s garden.","used"],["Now the children had ___ to play.","nowhere"],["The birds didn’t sing there because there were no children, and the trees forgot to ___.","bloom"],["He was too small to ___ the tree.","climb"],["The Giant’s heart ___.","melted"]]},"grammar":{"title":"used to vs be used to — “~하곤 했다” vs “~에 익숙하다”","explain":["used to + 동사원형: 예전에 ~하곤 했다 (지금은 안 함) → The children used to play in the garden.","부정·의문: didn’t use to / Did you use to ~?","be used to + 명사 / ~ing: ~에 익숙하다 (전혀 다른 뜻!) → I’m used to waking up early.","get used to ~ing: ~에 익숙해지다 → You’ll get used to it."],"examples":[["I used to live in Busan.","나는 예전에 부산에 살았다."],["He didn’t use to drink coffee.","그는 예전엔 커피를 안 마셨다."],["I’m used to cold weather.","나는 추운 날씨에 익숙하다."],["She got used to her new job.","그녀는 새 일에 익숙해졌다."]],"exercise":[["나는 어릴 때 피아노를 치곤 했다.","I used to play the piano when I was a child."],["그는 매운 음식에 익숙하다.","He is used to (eating) spicy food."],["We (used to / are used to) walk to school together.","used to"]]},"expressions":[["put up","(표지판을) 세우다, 붙이다","They put up a poster on the wall."],["nowhere to ~","~할 곳이 없는","I have nowhere to go tonight."],["at once","즉시, 곧바로","He called me at once."],["from then on","그때부터","From then on, we were best friends."]],"speaking":{"retell":["children – played in the garden","Giant came back – wall – sign","spring everywhere – winter in his garden","bird – children came through a hole","little boy crying – heart melted","knocked down the wall","years later – the boy came back – Paradise"],"discuss":["Why did the writer use seasons to show the Giant’s heart?","Have you ever changed your mind about something completely?","Is it wrong to protect your own things?"],"model":["Why did the writer use seasons?","I think winter shows the Giant’s cold heart, and spring shows love and sharing. When he was selfish, nothing could grow. When he opened his heart, spring came at once. It shows that our feelings can change the world around us."],"roleplay":"A: 담 밖에서 부탁하는 아이 / B: 아직 이기적인 거인. 아이는 정원에서 놀게 해 달라고 설득해 보세요."},"writing":{"task":"“Then and Now” — 거인의 예전 모습과 지금 모습 비교 (used to 3번 이상, 100~120단어)","hints":["The Giant used to ~, but now he ~.","정원, 성격, 아이들과의 관계 비교","마지막에 내가 배운 점"],"model":["The Selfish Giant changed a lot in this story.","He used to think only about himself. He used to say, “This is my garden!” and he didn’t let anyone in. He used to sit alone and look at his cold, white garden.","But now he is different. He knocked down the wall, and he plays with the children every day. His garden is full of flowers and birds.","This story taught me that happiness grows when we share it."]},"quote":["“I have many beautiful flowers, but the children are the most beautiful flowers of all.” (Oscar Wilde)","“내겐 아름다운 꽃이 많지만, 아이들이야말로 가장 아름다운 꽃이야.”"]},{"week":7,"title":"성냥팔이 소녀","en":"The Little Match Girl","author":"Hans Christian Andersen (안데르센)","year":"1845","genre":"동화 (Fairy Tale)","intro":"새해 전날 밤, 추위 속에서 성냥을 팔던 소녀가 성냥불 속에서 따뜻한 환상을 봅니다. 짧지만 “보고, 듣고, 냄새 맡고, 느끼는” 감각 묘사가 뛰어나서 묘사하는 표현을 배우기 좋은 작품이에요.","characters":[["The little match girl (성냥팔이 소녀)","맨발로 성냥을 파는 가난한 소녀"],["Her grandmother (할머니)","소녀를 사랑해 주었던 돌아가신 할머니"]],"warmup":[["What do people do on New Year’s Eve in Korea?","한국에서는 새해 전날 무엇을 하나요?"],["Who loved you most when you were a child?","어릴 때 누가 당신을 가장 사랑해 주었나요?"]],"vocab":[["match","성냥","She sold matches on the street."],["bare feet","맨발","She walked in bare feet."],["shoe","신발","She lost her shoes."],["sell","팔다 (sold – sold)","Nobody bought her matches."],["corner","모퉁이, 구석","She sat in a corner."],["light","불을 켜다 (lit – lit)","She lit a match."],["warm","따뜻한","The fire was warm."],["stove","난로","She saw a big stove."],["smell","냄새; 냄새 맡다","She could smell the food."],["Christmas tree","크리스마스트리","There was a beautiful Christmas tree."],["star","별","A star fell from the sky."],["grandmother","할머니","She saw her grandmother."],["disappear","사라지다","The stove disappeared."],["freeze to death","얼어 죽다","The girl froze to death."],["smile","미소","She had a smile on her face."]],"story":["It was very cold, and snow was falling. It was the last night of the year — New Year’s Eve. A poor little girl was walking through the dark streets. She had no hat, and she had bare feet.","When she left home, she had shoes. They were her mother’s old shoes, and they were much too big. She lost them when she ran across the street. Now her little feet were red and blue with cold.","She had a lot of matches in her old apron. Nobody had bought any matches from her all day. Nobody had given her a single coin. She was hungry and cold. Through the windows, she could see bright lights, and she could smell roast goose. It was New Year’s Eve, after all.","She sat down in a corner between two houses. She didn’t want to go home. She hadn’t sold any matches, and her father would hit her. And it was cold at home, too.","Her hands were almost frozen. “One match will warm my fingers,” she thought. She lit a match. What a warm, bright light! She felt like she was sitting in front of a big, hot stove. She put out her feet to warm them — but then the match went out, and the stove disappeared.","She lit another match. Now she could see into a room. There was a table with a white cloth, and on it was a delicious roast goose. Then the match went out, and she saw only the cold wall.","She lit a third match. Now she was sitting under a beautiful Christmas tree with thousands of candles. She reached up her hands — and the match went out. The candles went up higher and higher, and she saw that they were stars. One star fell across the sky. “Someone is dying,” she thought. Her grandmother, the only person who had loved her, used to say this when a star fell.","She lit another match, and in the light stood her grandmother. She looked so kind and happy. “Grandmother!” cried the little girl. “Please take me with you! I know you will disappear when the match goes out.” Quickly, she lit all the other matches. The light was brighter than day. Her grandmother took her in her arms, and they flew up together, high above the earth, to a place with no cold, no hunger, and no pain.","In the cold morning, people found the little girl in the corner. She had frozen to death on the last night of the year, but there was a smile on her face. “She wanted to warm herself,” people said. Nobody knew about the beautiful things she had seen."],"ko":["몹시 추웠고, 눈이 내리고 있었다. 한 해의 마지막 밤, 새해 전날 밤이었다. 가난한 어린 소녀가 어두운 거리를 걷고 있었다. 소녀는 모자도 없었고, 맨발이었다.","집을 나설 때는 신발이 있었다. 엄마의 낡은 신발이었는데, 너무 컸다. 길을 뛰어 건너다 신발을 잃어버렸다. 이제 소녀의 작은 발은 추위로 빨갛고 파랗게 변해 있었다.","소녀의 낡은 앞치마에는 성냥이 잔뜩 들어 있었다. 하루 종일 아무도 성냥을 사지 않았다. 아무도 동전 한 푼 주지 않았다. 소녀는 배고프고 추웠다. 창문 너머로 밝은 불빛이 보였고, 거위 구이 냄새가 났다. 어쨌든 새해 전날 밤이었으니까.","소녀는 두 집 사이 구석에 앉았다. 집에 가고 싶지 않았다. 성냥을 하나도 팔지 못했으니 아버지가 때릴 것이다. 게다가 집도 추웠다.","손이 거의 얼어 있었다. “성냥 하나면 손가락을 녹일 수 있을 거야.” 소녀는 생각했다. 소녀는 성냥 하나를 켰다. 어쩜 이렇게 따뜻하고 밝은 빛일까! 크고 뜨거운 난로 앞에 앉아 있는 것 같았다. 소녀는 발을 녹이려고 내밀었다. 그런데 그때 성냥이 꺼졌고, 난로도 사라졌다.","소녀는 성냥을 하나 더 켰다. 이번엔 어느 방 안이 들여다보였다. 하얀 식탁보가 덮인 식탁이 있었고, 그 위에 맛있는 거위 구이가 있었다. 그러다 성냥이 꺼졌고, 차가운 벽만 보였다.","소녀는 세 번째 성냥을 켰다. 이번엔 수천 개의 촛불이 달린 아름다운 크리스마스트리 아래 앉아 있었다. 소녀가 손을 뻗자 성냥이 꺼졌다. 촛불들은 점점 더 높이 올라갔고, 소녀는 그것들이 별이라는 것을 알았다. 별 하나가 하늘을 가로질러 떨어졌다. “누군가 죽어 가고 있구나.” 소녀는 생각했다. 소녀를 사랑해 준 단 한 사람, 할머니는 별이 떨어질 때 이렇게 말하곤 했다.","소녀가 성냥을 하나 더 켜자, 빛 속에 할머니가 서 있었다. 할머니는 무척 다정하고 행복해 보였다. “할머니!” 소녀가 외쳤다. “제발 저도 데려가 주세요! 성냥이 꺼지면 할머니도 사라질 거잖아요.” 소녀는 재빨리 나머지 성냥을 모두 켰다. 그 빛은 대낮보다 밝았다. 할머니는 소녀를 품에 안았고, 둘은 함께 날아올랐다. 땅 위 높이, 추위도 배고픔도 아픔도 없는 곳으로.","추운 아침, 사람들은 구석에서 어린 소녀를 발견했다. 소녀는 한 해의 마지막 밤에 얼어 죽었지만, 얼굴에는 미소가 있었다. “몸을 녹이고 싶었나 봐.” 사람들이 말했다. 소녀가 본 아름다운 것들에 대해서는 아무도 알지 못했다."],"gloss":[["apron","앞치마"],["coin","동전"],["roast goose","거위 구이"],["go out (불이)","꺼지다"],["reach up","손을 위로 뻗다"],["hunger","배고픔"]],"keySentences":[["Nobody had bought any matches from her all day.","과거완료: 그 시점까지 계속 아무도 사지 않았다"],["She felt like she was sitting in front of a big, hot stove.","feel like + 문장 (2주차 복습): ~인 것처럼 느끼다"],["Her grandmother, the only person who had loved her, used to say this.","콤마 사이가 할머니를 설명해요 (동격) + 관계대명사 who + used to"],["Nobody knew about the beautiful things she had seen.","the things (that) she had seen: 목적격 관계대명사 that 이 생략됨"]],"tf":[["The girl lost her shoes because they were too big.","T"],["She sold many matches that day.","F — 하나도 팔지 못했다."],["The first match showed her a Christmas tree.","F — 첫 번째는 난로였다."],["People in the morning knew about her dreams.","F — 아무도 몰랐다."]],"questions":[["Why didn’t the girl go home?","She hadn’t sold any matches, and her father would hit her. Also, it was cold at home."],["What did she see with each match?","a warm stove → a roast goose → a Christmas tree → her grandmother"],["Why did she light all the matches at once?","She wanted to keep her grandmother with her."],["Is the ending sad or happy? Why?","(예) Both. She died, but she was with her grandmother and had no more pain."]],"listening":{"shadow":"8","dictation":[["Now her little feet were red and blue with ___.","cold"],["Through the windows, she could see bright lights, and she could ___ roast goose.","smell"],["She felt ___ she was sitting in front of a big, hot stove.","like"],["She put out her feet to warm them — but then the match went out, and the stove ___.","disappeared"],["She had frozen to death on the last night of the year, but there was a ___ on her face.","smile"]]},"grammar":{"title":"지각동사 see / hear / smell / feel — 감각으로 묘사하기","explain":["see / hear / feel + 목적어 + 동사원형: 동작 전체를 보거나 듣다 → I saw a star fall.","see / hear / feel + 목적어 + ~ing: 진행 중인 장면을 보다 → She saw people eating dinner.","smell / look / sound / feel + 형용사: ~한 냄새가 나다 / ~해 보이다 / ~하게 들리다 → It smells delicious.","글을 쓸 때 오감(보기, 듣기, 냄새, 맛, 촉감)을 넣으면 장면이 살아나요."],"examples":[["I heard someone call my name.","누군가 내 이름을 부르는 소리를 들었다."],["She saw a star falling across the sky.","그녀는 별이 하늘을 가로질러 떨어지는 것을 보았다."],["The soup smells good.","수프 냄새가 좋다."],["Your idea sounds great!","네 생각 정말 좋다!"]],"exercise":[["나는 아이들이 노는 소리를 들었다.","I heard the children playing (play)."],["이 빵은 맛있는 냄새가 난다.","This bread smells delicious."],["The room looked (warm / warmly).","warm"]]},"expressions":[["after all","어쨌든, 결국","Don’t worry. It’s only a test, after all."],["go out","(불이) 꺼지다","Suddenly, the lights went out."],["take ~ in one’s arms","~을 품에 안다","She took the baby in her arms."],["freeze to death","얼어 죽다","Some birds froze to death that winter."]],"speaking":{"retell":["New Year’s Eve – cold – bare feet","lost shoes – no matches sold","afraid to go home – sat in a corner","match 1: stove / 2: roast goose / 3: Christmas tree","falling star – grandmother","all the matches – flew up together","morning – frozen – smiling"],"discuss":["Why did nobody help the little girl?","Who are the “little match girls” in today’s world?","What can ordinary people do to help children in need?"],"model":["Why did nobody help the little girl?","I think people were too busy with their own New Year’s parties. They were in warm houses with good food, so they didn’t look outside. It’s very sad. Even today, we often don’t notice poor people around us. I think the writer wanted us to open our eyes."],"roleplay":"A: 길을 지나던 사람 / B: 성냥팔이 소녀. 누군가 소녀에게 말을 걸었다면? 소녀를 돕는 대화를 만들어 보세요."},"writing":{"task":"감각 묘사: 추운 겨울밤 거리 장면을 오감으로 묘사하기 (100~120단어)","hints":["I could see / hear / smell / feel ~","as ~ as, like ~ 를 사용한 비유","마지막 문장에 감정"],"model":["It was a freezing night in December. I could see snow falling under the street lights. Through a restaurant window, I saw families laughing around big tables.","I could smell sweet potatoes on a street cart, and my stomach felt empty. The wind was as sharp as a knife. My fingers were red and stiff. Somewhere, I heard children singing a Christmas song.","I bought a hot sweet potato and held it in both hands. It felt like a small fire. At that moment, I thought of the little match girl, and I felt thankful for my warm home."]},"quote":["“Nobody knew what beautiful things she had seen.” (Andersen)","소녀가 어떤 아름다운 것들을 보았는지 아무도 알지 못했다."]},{"week":8,"title":"피노키오","en":"The Adventures of Pinocchio","author":"Carlo Collodi (카를로 콜로디)","year":"1883","genre":"아동 소설 (Children’s Novel)","intro":"이탈리아 작가 콜로디의 장편 동화입니다. 나무 인형 피노키오가 거짓말과 유혹에 빠져 여러 모험을 겪고, 마침내 진짜 소년이 되기까지의 이야기예요. 이 교재에서는 원작의 핵심 장면(거짓말과 코, 장난감 나라, 상어 뱃속)을 엮어 다시 썼습니다.","characters":[["Pinocchio (피노키오)","말하는 나무 인형"],["Geppetto (제페토)","피노키오를 만든 가난한 목수 할아버지"],["The Blue Fairy (푸른 요정)","피노키오를 돕는 요정"],["Lampwick (램프윅)","피노키오를 장난감 나라로 데려가는 친구"]],"warmup":[["Is it ever okay to tell a lie?","거짓말을 해도 되는 때가 있을까요?"],["What does it mean to be a “real” person?","“진짜 사람”이 된다는 건 무슨 뜻일까요?"]],"vocab":[["wood","나무, 목재","Pinocchio was made of wood."],["puppet","인형, 꼭두각시","He was a wooden puppet."],["coat","외투","Geppetto sold his only coat."],["school","학교","Go to school and study hard."],["promise","약속하다","Pinocchio promised to be good."],["lie","거짓말(하다)","Every time he lied, his nose grew."],["nose","코","His nose got longer and longer."],["fairy","요정","The Blue Fairy helped him."],["toy","장난감","They went to Toy Land."],["donkey","당나귀","The boys became donkeys."],["shark","상어","A shark swallowed him."],["swallow","삼키다","The shark swallowed the boat."],["save","구하다","Pinocchio saved his father."],["take care of","~을 돌보다","He took care of his father."],["real","진짜의","He became a real boy."]],"story":["Once upon a time, a poor old man named Geppetto made a puppet from a piece of wood. To his surprise, the puppet could talk and laugh! Geppetto named him Pinocchio and loved him like a son.","Geppetto was very poor, but he sold his only coat to buy Pinocchio a book for school. “Go to school, study hard, and be a good boy,” he said. Pinocchio promised he would. But on his way to school, he heard music from a puppet show. “I’ll go to school tomorrow,” he said, and he sold his book to buy a ticket.","That was the start of his troubles. Later, a kind Blue Fairy found him and asked, “Where is the money that Geppetto gave you?” “I lost it,” said Pinocchio. But that was a lie — the money was in his pocket. At once, his nose grew longer! “I mean, I dropped it in the forest,” he said. His nose grew even longer. Soon it was so long that he couldn’t turn around in the room. The Fairy laughed. “Lies are easy to see,” she said. “Some lies have short legs, and some have long noses. Yours have long noses!”","Pinocchio cried and said sorry, so the Fairy made his nose small again. He promised to be good. For a while, he went to school and studied hard. The Fairy told him that he would become a real boy soon.","But one night, his friend Lampwick came. “I’m going to Toy Land,” he said. “There are no schools and no teachers. You can play all day!” Pinocchio knew he should say no. But he thought, “Just for one day.” One day became five months. Then, one morning, Pinocchio woke up with two long donkey ears! Soon he had a tail, and he could only say “Hee-haw!” All the lazy boys in Toy Land had become donkeys.","After many hard days, Pinocchio fell into the sea and became a wooden puppet again. Then a giant shark swallowed him. Inside the dark stomach of the shark, he saw a small light. He walked toward it and found — his father, Geppetto! Geppetto had been looking for Pinocchio in a small boat when the shark swallowed him, too.","“Father! I will never leave you again!” cried Pinocchio. While the shark was sleeping with its mouth open, Pinocchio led his father out and swam to land with the old man on his back.","From that day, Pinocchio changed. Geppetto was weak and sick, so Pinocchio worked every day to buy him milk. At night, he studied. He saved money for a new coat, but when he heard that the Blue Fairy was sick, he gave all his money to help her.","That night, he dreamed of the Fairy. “You have a good heart,” she said. When Pinocchio woke up, he looked in the mirror. He wasn’t a wooden puppet anymore. He was a real boy! “How funny I was when I was a puppet,” he said, “and how happy I am now!”"],"ko":["옛날 옛적에, 제페토라는 가난한 노인이 나무 조각으로 인형을 만들었다. 놀랍게도 그 인형은 말도 하고 웃을 수도 있었다! 제페토는 인형의 이름을 피노키오라고 짓고 아들처럼 사랑했다.","제페토는 무척 가난했지만, 하나뿐인 외투를 팔아 피노키오에게 학교에서 쓸 책을 사 주었다. “학교에 가서 열심히 공부하고 착한 아이가 되거라.” 그가 말했다. 피노키오는 그러겠다고 약속했다. 하지만 학교 가는 길에 인형극 음악 소리를 들었다. “학교는 내일 가야지.” 피노키오는 이렇게 말하고 표를 사려고 책을 팔았다.","그것이 고난의 시작이었다. 나중에 친절한 푸른 요정이 피노키오를 찾아와 물었다. “제페토가 준 돈은 어디 있니?” “잃어버렸어요.” 피노키오가 말했다. 하지만 그건 거짓말이었다. 돈은 주머니에 있었다. 그러자 곧바로 코가 길어졌다! “아니, 숲에 떨어뜨렸어요.” 그러자 코는 더 길어졌다. 곧 코가 너무 길어져서 방 안에서 몸을 돌릴 수도 없었다. 요정이 웃었다. “거짓말은 쉽게 보이는 법이란다.” 요정이 말했다. “어떤 거짓말은 다리가 짧고, 어떤 거짓말은 코가 길지. 네 거짓말은 코가 긴 거짓말이구나!”","피노키오는 울며 잘못했다고 했고, 요정은 코를 다시 작게 만들어 주었다. 피노키오는 착하게 살겠다고 약속했다. 한동안 피노키오는 학교에 가서 열심히 공부했다. 요정은 피노키오에게 곧 진짜 소년이 될 거라고 말해 주었다.","그런데 어느 날 밤, 친구 램프윅이 찾아왔다. “나 장난감 나라에 갈 거야.” 그가 말했다. “거기엔 학교도 선생님도 없어. 하루 종일 놀 수 있어!” 피노키오는 거절해야 한다는 걸 알았다. 하지만 이렇게 생각했다. “딱 하루만.” 하루는 다섯 달이 되었다. 그러던 어느 날 아침, 피노키오는 일어나 보니 긴 당나귀 귀가 두 개 생겨 있었다! 곧 꼬리도 생겼고, “히힝!” 소리밖에 낼 수 없었다. 장난감 나라의 게으른 소년들은 모두 당나귀가 되어 버렸다.","힘든 날들을 많이 보낸 뒤, 피노키오는 바다에 빠져 다시 나무 인형이 되었다. 그러다 거대한 상어가 피노키오를 삼켰다. 어두운 상어 뱃속에서 피노키오는 작은 불빛을 보았다. 그쪽으로 걸어가 보니 아버지 제페토가 있었다! 제페토는 작은 배를 타고 피노키오를 찾아다니다가 상어에게 함께 삼켜졌던 것이다.","“아버지! 다시는 아버지를 떠나지 않을게요!” 피노키오가 외쳤다. 상어가 입을 벌린 채 자는 동안, 피노키오는 아버지를 데리고 나와 노인을 등에 업고 육지까지 헤엄쳤다.","그날부터 피노키오는 변했다. 제페토는 약하고 아팠기 때문에, 피노키오는 아버지에게 우유를 사 드리려고 매일 일했다. 밤에는 공부를 했다. 새 외투를 사려고 돈을 모았지만, 푸른 요정이 아프다는 소식을 듣고는 모은 돈을 전부 요정을 돕는 데 주었다.","그날 밤, 피노키오는 요정의 꿈을 꾸었다. “너는 착한 마음을 가졌구나.” 요정이 말했다. 피노키오가 잠에서 깨어 거울을 보았다. 그는 더 이상 나무 인형이 아니었다. 진짜 소년이었다! “인형이었을 때 나는 얼마나 우스웠는지,” 그가 말했다. “그리고 지금 나는 얼마나 행복한지!”"],"gloss":[["name A B","A를 B라고 이름 짓다"],["trouble","고난, 문제"],["turn around","몸을 돌리다"],["lazy","게으른"],["stomach","배, 위"],["lead – led","이끌다"]],"keySentences":[["Some lies have short legs, and some have long noses.","원작의 유명한 대사: 들통나는 거짓말의 두 종류"],["Pinocchio knew he should say no.","know (that) + 문장: ~라는 것을 알다 / should say no = 거절해야 한다"],["Geppetto had been looking for Pinocchio when the shark swallowed him, too.","과거완료진행 had been ~ing: 그 일이 있기 전부터 계속하던 일"],["How funny I was… and how happy I am now!","How + 형용사 + 주어 + 동사! 감탄문 두 개로 과거와 현재를 비교"]],"tf":[["Geppetto sold his coat to buy a book.","T"],["Pinocchio’s nose grew when he told the truth.","F — 거짓말할 때 자랐다."],["Pinocchio stayed in Toy Land for one day.","F — 다섯 달 동안 있었다."],["Pinocchio became a real boy because of his good heart.","T"]],"questions":[["What did Pinocchio do with his school book?","He sold it to buy a ticket for the puppet show."],["What happened to the boys in Toy Land?","They became donkeys."],["Where did Pinocchio find Geppetto?","Inside the stomach of a giant shark."],["What did Pinocchio do after he saved his father?","He worked every day, studied at night, and gave his money to the sick Fairy."]],"listening":{"shadow":"5","dictation":[["Pinocchio ___ he would.","promised"],["At once, his nose ___ longer!","grew"],["Pinocchio knew he ___ say no.","should"],["All the ___ boys in Toy Land had become donkeys.","lazy"],["He wasn’t a wooden ___ anymore.","puppet"]]},
